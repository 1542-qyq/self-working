let currentFilter = 'all';
let currentTier = 'all';
let currentSort = 'rank';
let searchQuery = '';

// 从localStorage加载状态
function loadStatus() {
  const saved = localStorage.getItem('jobApplicationStatus');
  return saved ? JSON.parse(saved) : {};
}

function saveStatus(status) {
  localStorage.setItem('jobApplicationStatus', JSON.stringify(status));
}

let jobStatus = loadStatus();

function getMatchClass(score) {
  if (score >= 54) return 'match-high';
  if (score >= 42) return 'match-mid';
  return 'match-low';
}

function getTierText(tier) {
  const map = { s: 'S', a: 'A', b: 'B', c: 'C', x: '⚠' };
  return map[tier] || '';
}

function renderJobs() {
  const grid = document.getElementById('jobs-grid');
  const filtered = jobs.filter(job => {
    if (currentTier !== 'all' && job.tier !== currentTier) return false;
    const status = jobStatus[job.id]?.status || 'pending';
    if (currentFilter !== 'all' && status !== currentFilter) return false;
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      return job.company.toLowerCase().includes(q) || job.position.toLowerCase().includes(q);
    }
    return true;
  });

  // 排序
  if (currentSort === 'ai') {
    filtered.sort((a, b) => (b.aiScore || 0) - (a.aiScore || 0));
  } else {
    filtered.sort((a, b) => a.rank - b.rank);
  }

  grid.innerHTML = filtered.map(job => {
    const status = jobStatus[job.id]?.status || 'pending';
    const date = jobStatus[job.id]?.date || '';
    const note = jobStatus[job.id]?.note || '';
    const statusText = {
      pending: '待投递',
      applied: '已投递',
      written: '笔试中',
      interview: '面试中',
      offer: '已Offer',
      rejected: '已结束'
    };

    return `
      <div class="job-card tier-${job.tier}" data-id="${job.id}">
        <div class="job-header">
          <div style="display:flex; gap:10px; align-items:flex-start; flex:1;">
            <div class="rank-badge rank-${job.tier}">${job.rank}</div>
            <div>
              <div class="job-company">${job.company}</div>
              <div class="job-position">${job.position}</div>
            </div>
          </div>
          <div class="job-salary">${job.salary}<br><span style="font-size:11px; color:#888; font-weight:normal;">${job.location}</span></div>
        </div>
        <div class="job-tags">
          ${job.tags.map(t => `<span class="tag tag-${t}">${job.tagsText.split('·')[job.tags.indexOf(t)] || t}</span>`).join('')}
        </div>
        <div class="match-row">
          <span class="match-score" style="color:${job.score >= 54 ? '#38a169' : job.score >= 42 ? '#dd6b20' : '#e53e3e'}">${job.score}</span>
          <div class="match-bar"><div class="match-fill ${getMatchClass(job.score)}" style="width:${Math.min(job.score/70*100, 100)}%"></div></div>
          <span class="match-label">手动评分</span>
        </div>
        <div class="match-row ai-score-row">
          <span class="match-score ai-score-num" style="color:${job.aiScore >= 4.2 ? '#10b981' : job.aiScore >= 3.8 ? '#f59e0b' : '#6b7280'}">${job.aiScore ? job.aiScore.toFixed(1) : '-'}</span>
          <div class="match-bar"><div class="match-fill match-ai" style="width:${job.aiScore ? (job.aiScore/5*100) : 0}%"></div></div>
          <span class="match-label">AI评分</span>
        </div>
        <div class="job-desc">${job.desc}</div>
        <div class="job-actions">
          <select class="status-select ${status}" onchange="updateStatus(${job.id}, this.value)">
            <option value="pending" ${status==='pending'?'selected':''}>待投递</option>
            <option value="applied" ${status==='applied'?'selected':''}>已投递</option>
            <option value="written" ${status==='written'?'selected':''}>笔试中</option>
            <option value="interview" ${status==='interview'?'selected':''}>面试中</option>
            <option value="offer" ${status==='offer'?'selected':''}>已Offer</option>
            <option value="rejected" ${status==='rejected'?'selected':''}>已结束</option>
          </select>
          <input type="date" class="date-input" value="${date}" onchange="updateDate(${job.id}, this.value)" title="投递/面试日期">
          <a href="${job.resume}" class="btn-link btn-resume" target="_blank">📄简历</a>
          <a href="${job.jd}" class="btn-link btn-jd" target="_blank">🖼️JD</a>
        </div>
        <input type="text" class="note-input" placeholder="📝 备注（面试时间、进度等）" value="${note}" onchange="updateNote(${job.id}, this.value)">
      </div>
    `;
  }).join('');

  updateStats();
}

function updateStatus(id, status) {
  if (!jobStatus[id]) jobStatus[id] = {};
  jobStatus[id].status = status;
  saveStatus(jobStatus);
  renderJobs();
}

function updateDate(id, date) {
  if (!jobStatus[id]) jobStatus[id] = {};
  jobStatus[id].date = date;
  saveStatus(jobStatus);
}

function updateNote(id, note) {
  if (!jobStatus[id]) jobStatus[id] = {};
  jobStatus[id].note = note;
  saveStatus(jobStatus);
}

function updateStats() {
  const counts = { total: jobs.length, pending: 0, applied: 0, written: 0, interview: 0, offer: 0, rejected: 0 };
  jobs.forEach(job => {
    const status = jobStatus[job.id]?.status || 'pending';
    counts[status]++;
  });
  document.getElementById('stat-total').textContent = counts.total;
  document.getElementById('stat-pending').textContent = counts.pending;
  document.getElementById('stat-applied').textContent = counts.applied;
  document.getElementById('stat-written').textContent = counts.written;
  document.getElementById('stat-interview').textContent = counts.interview;
  document.getElementById('stat-offer').textContent = counts.offer;
  document.getElementById('stat-rejected').textContent = counts.rejected;
}

function filterStatus(status) {
  currentFilter = status;
  document.querySelectorAll('.stat-card').forEach(c => c.classList.remove('active'));
  document.querySelector(`[data-filter="${status}"]`).classList.add('active');
  renderJobs();
}

function filterTier(tier) {
  currentTier = tier;
  document.querySelectorAll('.filter-btn[data-tier]').forEach(b => b.classList.remove('active'));
  document.querySelector(`[data-tier="${tier}"]`).classList.add('active');
  renderJobs();
}

function searchJobs(q) {
  searchQuery = q;
  renderJobs();
}

function sortBy(sort) {
  currentSort = sort;
  document.querySelectorAll('.filter-btn[data-sort]').forEach(b => b.classList.remove('active'));
  document.querySelector(`[data-sort="${sort}"]`).classList.add('active');
  renderJobs();
}

renderJobs();
</script>
