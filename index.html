<title>个人工作台 · Minimal Dashboard</title>
<style>
  /* ============================================================
     THEME TOKENS — Minimal Dashboard Design System
     主色: #2563ef (brand blue), 无阴影, 边框对比, 紧凑专业
     ============================================================ */
  :root {
    /* ---- 页面与表面 ---- */
    --page-bg: #ffffff;
    --surface-card: #ffffff;
    --surface-nested: #f9fafb;

    /* ---- 边框 ---- */
    --border: #e5e7eb;
    --border-input: #d1d5db;

    /* ---- 文本层级 ---- */
    --text: #111827;
    --text-secondary: #4b5563;
    --text-tertiary: #9ca3af;

    /* ---- 主色 ---- */
    --brand-50: #f8fafc;
    --brand-100: #f1f5f9;
    --brand-500: #64748b;
    --brand-600: #475569;
    --brand-700: #334155;
    --accent: var(--brand-600);
    --accent-muted: var(--brand-50);
    --on-accent: #ffffff;

    /* ---- 模块色 — 统一只用灰蓝色系！ ---- */
    --module-1: #475569;
    --module-2: #475569;
    --module-3: #475569;
    --module-4: #475569;
    --module-5: #475569;

    /* ---- 状态色 ---- */
    --danger: #ef4444;
    --danger-muted: #fef2f2;
    --success: #10b981;
    --warning: #f59e0b;

    /* ---- 抽屉/侧栏 ---- */
    --drawer-bg: #f9fafb;
    --drawer-bg-top: #f9fafb;
    --drawer-text: #111827;
    --drawer-text-mute: #9ca3af;
    --drawer-hover: #f3f4f6;
    --drawer-active: #eff6ff;

    /* ---- 背景图 ---- */
    --greet-image: none;
    --page-texture: none;

    /* ---- 圆角 ---- */
    --radius-sm: 6px;
    --radius-control: 8px;
    --radius-tile: 12px;
    --radius-card: 16px;
    --radius-lg: 16px;
    --radius-sheet: 20px;

    /* ---- 阴影 — 全部去掉！ ---- */
    --shadow-card: none;
    --shadow-overlay: 0 10px 28px rgba(0,0,0,.08);

    /* ---- 字体与布局 ---- */
    --font: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-mono: 'JetBrains Mono', "SF Mono", Menlo, Consolas, monospace;
    --sidebar-w: 240px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--page-bg); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased; min-height: 100vh; min-width: 1000px;
  }
  svg { display: block; }
  .layout { min-height: 100vh; }

  /* ---------- sidebar (固定在左侧，不随内容滚动) ---------- */
  .sidebar { background: var(--drawer-bg); color: var(--drawer-text); border-right:1px solid var(--border);
    display: flex; flex-direction: column; position: fixed; top: 0; left: 0; width: var(--sidebar-w); height: 100vh; z-index: 30; }
  .sidebar .brand { padding: 24px 20px 20px; display: flex; align-items: center; gap: 12px; }
  .sidebar .brand .ava { position: relative; width: 40px; height: 40px; border-radius: var(--radius-control); overflow: hidden; flex: 0 0 auto;
    background: var(--surface-card); border:1px solid var(--border); cursor: pointer; }
  .sidebar .brand .ava img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .sidebar .brand .ava .cam { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0;
    background: rgba(0,0,0,.4); color: white; transition: opacity .15s; }
  .sidebar .brand .ava:hover .cam { opacity: 1; }
  .sidebar .brand h1 { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
  .sidebar .brand p { font-size: 11px; color:var(--text-tertiary); margin-top: 2px; font-weight:500; }
  .sidebar .nav { flex: 1; overflow-y: auto; padding: 4px 12px 12px; }
  .sidebar .nav::-webkit-scrollbar { width: 4px; }
  .sidebar .nav::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .navi { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: var(--radius-control); cursor: pointer;
    font-size: 13px; font-weight: 500; color: var(--text-secondary); transition: all .12s; margin-bottom: 2px; }
  .navi:hover { background: var(--drawer-hover); color: var(--text); }
  .navi.active { background: var(--drawer-active); color: var(--accent); font-weight: 600; }
  .navi svg { color: var(--text-tertiary); flex: 0 0 auto; }
  .navi.active svg { color: var(--accent); }
  .nav-sep { font-size: 10.5px; color:var(--text-tertiary); padding: 16px 12px 8px; letter-spacing: .08em; font-weight:600; text-transform:uppercase; }
  .sidebar .foot { padding: 16px 20px; font-size: 11px; color:var(--text-tertiary); border-top: 1px solid var(--border); font-weight:500; }

  /* ---------- main ---------- */
  .main { margin-left: var(--sidebar-w); padding: 26px 34px 48px; }
  .main > #screen { max-width: 1180px; }
  .header { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 6px; }
  .header h2 { font-size: 27px; font-weight: 800; letter-spacing: -.03em; }
  .header p { color: var(--text-secondary); font-size: 13px; margin-top: 5px; }
  .header .spacer { flex: 1; }
  .date-chip { display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--text-secondary);
    background: var(--surface-card); border:1px solid var(--border); border-radius:999px; padding:8px 15px; box-shadow: var(--shadow-card); }
  .date-chip svg { color: var(--text-tertiary); }

  /* ---------- hero banner (顶部问候区) ---------- */
  .hero-banner { position: relative; overflow: hidden; border-radius: var(--radius-card); border: 1px solid var(--border);
    min-height: 160px; display: flex; flex-direction: column; justify-content: center;
    padding: 28px 32px; margin-bottom: 20px; background: var(--surface-card); }
  .hero-banner::before { display:none; }
  .hero-banner > * { position: relative; z-index: 1; }
  .hero-banner .hi { font-size: 28px; font-weight: 600; letter-spacing: -.02em; }
  .hero-banner .sub { color: var(--text-secondary); font-size: 14px; margin-top: 6px; max-width: 460px; line-height:1.5; font-weight:500; }
  .hero-banner .hstats { display: flex; gap: 24px; margin-top: 18px; }
  .hero-banner .hstat { display: flex; flex-direction: column; gap: 2px; }
  .hero-banner .hstat .n { font-size: 20px; font-weight: 600; letter-spacing: -.01em; font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
  .hero-banner .hstat .t { font-size: 12px; color: var(--text-secondary); font-weight:500; }
  .hero-banner .hstat + .hstat { padding-left: 24px; border-left: 1px solid var(--border); }
  .hero-banner .htop { position: absolute; top: 20px; right: 24px; z-index: 2; display: flex; gap: 10px; align-items: center; }

  .card { background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-card); box-shadow: var(--shadow-card); }
  .sec-title { display:flex; align-items:center; gap:9px; font-size:14px; font-weight:600; margin: 18px 2px 10px; letter-spacing: -.01em; }
  .sec-title::before { content:""; width: 3px; height: 14px; border-radius: 2px; background: var(--accent); }

  /* ---------- dashboard grid ---------- */
  .grid { display: grid; gap: 16px; }
  .g-4 { grid-template-columns: repeat(4, 1fr); }
  .g-3 { grid-template-columns: repeat(3, 1fr); }
  .g-2 { grid-template-columns: repeat(2, 1fr); }
  .g-main { grid-template-columns: 1.55fr 1fr; align-items: start; }

  /* 各模块概况卡片 */
  .modcard-grid { display:grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .modcard { background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-card);
    padding: 15px 16px; cursor: pointer; transition: border-color .12s; }
  .modcard:hover { border-color: var(--border-input); }
  .modcard .mc-head { display:flex; align-items:center; gap: 11px; }
  .modcard .mc-ic { width: 36px; height: 36px; border-radius: 10px; display:grid; place-items:center; flex:0 0 auto; }
  .modcard .mc-tt { flex:1; min-width:0; }
  .modcard .mc-name { font-size: 14.5px; font-weight: 800; letter-spacing: -.01em; }
  .modcard .mc-desc { font-size: 11.5px; color: var(--text-secondary); margin-top: 1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .modcard .mc-arw { color: var(--text-tertiary); flex:0 0 auto; }
  .modcard .mc-body { display:flex; align-items:baseline; gap: 8px; margin-top: 11px; }
  .modcard .mc-main { font-size: 15px; font-weight: 800; letter-spacing: -.01em; }
  .modcard .mc-extra { font-size: 12px; color: var(--text-secondary); }

  /* quote banner */
  .quote { padding: 22px 26px; border-radius: var(--radius-card); position: relative; overflow: hidden;
    background: var(--surface-card); border: 1px solid var(--border); box-shadow: var(--shadow-card); }
  .quote::before { content:""; position:absolute; left:0; top:18px; bottom:18px; width:3px; border-radius:2px; background: var(--accent); }
  .quote .tag { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; color:var(--text-secondary);
    letter-spacing:.04em; margin-bottom:11px; }
  .quote .tag svg { color: var(--text-tertiary); }
  .quote .txt { font-size:20px; font-weight:700; color:var(--text); letter-spacing:-.01em; line-height:1.5; }

  /* overview rings */
  .rings { display:grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap:0; }
  .ring { display:flex; flex-direction:column; align-items:center; gap:6px; padding:14px 4px; cursor:pointer; min-width:0;
    border-radius: var(--radius-card); transition: background .15s; }
  .ring:hover { background: var(--surface-nested); }
  .ring .dial { position:relative; width:96px; height:96px; }
  .ring .dial svg.gauge { transform: rotate(-90deg); width:100%; height:100%; }
  .ring .dial .mid { position:absolute; inset:0; display:grid; place-items:center; }
  .ring .pct { font-size:20px; font-weight:600; letter-spacing:-.02em; color:var(--text); }
  .ring .lbl { font-size:14px; font-weight:700; color:var(--text); }
  .ring .sub { font-size:11px; color:var(--text-secondary); }

  /* quick add */
  .quick-grid { display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:10px; }
  .qbtn { display:flex; align-items:center; gap:12px; padding:14px 15px; border:none; cursor:pointer; border-radius:var(--radius-tile);
    background:var(--surface-card); border:1px solid var(--border); box-shadow: var(--shadow-card); text-align:left; transition: all .15s; min-width:0; }
  .qbtn:hover { border-color:var(--border-input); }
  .qbtn .e { position:relative; width:42px; height:42px; border-radius:12px; display:grid; place-items:center; flex:0 0 auto; }
  .qbtn .e .qplus { position:absolute; right:-3px; bottom:-3px; width:17px; height:17px; border-radius:50%;
    background: var(--accent); color:var(--on-accent); display:grid; place-items:center; border: 2px solid var(--surface-card); }
  .qbtn .l { font-size:13.5px; font-weight:700; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* trend panel */
  .panel { background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-card); box-shadow: var(--shadow-card); padding:18px; }
  .panel .ph { display:flex; align-items:center; gap:8px; font-size:14px; font-weight:600; }
  .panel .ph svg { color: var(--text-tertiary); }
  .panel .ph .avg { margin-left:auto; font-size:12px; color:var(--text-secondary); font-weight:500; }
  .trend-svg { width:100%; height:auto; margin-top:14px; display:block; }
  .trend-x { display:flex; justify-content:space-between; font-size:11px; color:var(--text-secondary); margin-top:4px; padding:0 6px; }
  .trend-empty { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; height: 168px;
    color: var(--text-tertiary); font-size: 13px; margin-top: 8px; }

  /* ---------- pinned tasks ---------- */
  .pin-list { display:grid; grid-template-columns: repeat(3, 1fr); gap: 12px; align-items:start; }
  .pin-list .ielts-tile { grid-column: 1 / -1; }
  .pin { display:flex; align-items:center; gap: 13px; padding: 15px 16px; border-radius: var(--radius-tile);
    background: var(--surface-card); border: 1px solid var(--border); box-shadow: var(--shadow-card); transition: box-shadow .15s, transform .12s; }
  .pin:hover { border-color:var(--border-input); }
  .pin-ic { width: 38px; height: 38px; border-radius: 11px; display:grid; place-items:center; flex:0 0 auto;
    background: var(--surface-nested); border: 1px solid var(--border); }
  .pin-b { flex:1; min-width:0; cursor:pointer; }
  .pin-t { font-size: 14.5px; font-weight: 700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pin-t.done { text-decoration: line-through; color: var(--text-secondary); }
  .pin-m { font-size: 12px; color: var(--text-secondary); margin-top: 3px; }
  .pin-chk { flex:0 0 auto; width: 26px; height: 26px; border-radius: 8px; border: 1.6px solid var(--border-input);
    display:grid; place-items:center; cursor:pointer; background:var(--surface-card); color:var(--on-accent); transition: all .15s; }
  .pin-chk.on { background: var(--module-1); border-color: var(--module-1); }
  .pin-chk svg { opacity: 0; }
  .pin-chk.on svg { opacity: 1; }
  .pin-step { flex:0 0 auto; display:flex; gap: 7px; }
  .pin-step button { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border-input);
    background: var(--surface-nested); color: var(--text); font-size: 18px; line-height: 1; cursor:pointer;
    display:grid; place-items:center; transition: all .15s; }
  .pin-step button:hover { background: var(--accent-muted); border-color: var(--accent); }
  .pin-empty { grid-column: 1 / -1; padding: 26px 20px; text-align:center; color: var(--text-secondary); font-size: 13px; line-height: 1.7;
    background: var(--surface-card); border: 1px dashed var(--border-input); border-radius: var(--radius-tile); }
  .pin-empty .mini-star { display:inline-flex; vertical-align:-2px; color: var(--module-3); }

  /* ---------- toolbar in module view ---------- */
  .toolbar { display:flex; align-items:center; gap:10px; margin: 14px 0 12px; }
  .btn { background:var(--accent); color:#fff; border:1px solid var(--accent); border-radius:var(--radius-control); padding:8px 16px; font-size:13px; cursor:pointer;
    font-weight:500; transition: all .12s; display:inline-flex; align-items:center; gap:6px; font-family:var(--font); }
  .btn:hover { background:var(--brand-700); border-color:var(--brand-700); }
  .btn:active { transform: translateY(0); }
  .btn.ghost { background:var(--surface-card); color:var(--text); border:1px solid var(--border); font-weight:500; }
  .btn.ghost:hover { background:var(--surface-nested); border-color:var(--border-input); }
  .btn.danger { background:var(--danger); border-color:var(--danger); }
  .btn.danger:hover { background:#dc2626; border-color:#dc2626; }
  .spacer { flex:1; }
  input, textarea { font-family:var(--font); font-size:13px; border:1px solid var(--border); border-radius:var(--radius-control);
    padding:8px 12px; background:var(--surface-card); color:var(--text); outline:none; transition: border-color .12s, box-shadow .12s; width:100%; }
  input:focus, textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-muted); }
  textarea { resize:vertical; min-height:80px; line-height:1.5; }
  .search-box { position:relative; width: 240px; }
  .search-box svg { position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--text-tertiary); pointer-events:none; }
  .search-box input { padding-left:34px; }

  /* module hero header (per-type summary) */
  .hero { display:flex; align-items:center; gap: 13px; padding: 12px 16px; border-radius: var(--radius-tile);
    background: var(--surface-card); border: 1px solid var(--border); box-shadow: var(--shadow-card); margin-bottom: 4px; position:relative; overflow:hidden; }
  .hero.has-cover { padding: 0; min-height: 96px; }
  .hero.has-cover .hero-bg { position:absolute; inset:0; background-size:cover; background-position:center; }
  .hero.has-cover .hero-bg::after { content:""; position:absolute; inset:0; background: linear-gradient(90deg, var(--surface-card) 28%, color-mix(in srgb, var(--surface-card) 60%, transparent) 55%, transparent 80%); }
  .hero.has-cover > .hero-inner { position:relative; z-index:1; padding: 12px 16px; display:flex; align-items:center; gap:13px; }
  .hero-ic { width: 40px; height: 40px; border-radius: 11px; display:grid; place-items:center; flex:0 0 auto; }
  .hero-tx { min-width:0; flex:1; }
  .hero-row { display:flex; align-items:baseline; gap: 9px; flex-wrap:wrap; }
  .hero-v { font-size: 20px; font-weight: 800; letter-spacing: -.02em; line-height: 1; }
  .hero-l { font-size: 13px; color: var(--text-secondary); }

  /* record thumbnail + custom field meta tags */
  .rec .thumb { width:48px; height:48px; border-radius:var(--radius-tile); object-fit:cover; flex:0 0 auto; margin-right:2px; }
  .rec .meta-line { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:4px; flex:1 0 100%; }
  .rec .meta-tag { font-size:12px; font-weight:600; color:var(--text-secondary); }
  .rec .meta-tag::before { content:"·"; margin-right:6px; color:var(--text-tertiary); }
  .rec .meta-tag:first-child::before { display:none; }

  /* ---- layout variants (open-ended: add .rec-layout-xxx in <style> to extend) ---- */
  /* feature: 大图在上 + 标题 + 正文在下 */
  .rec.rec-layout-feature { padding:0; overflow:hidden; }
  .rec.rec-layout-feature .top { flex-direction:column; align-items:stretch; }
  .rec.rec-layout-feature .thumb { width:100%; height:160px; border-radius:0; margin:0; }
  .rec.rec-layout-feature .feat-title { padding:12px 16px 4px; font-size:15px; font-weight:700; color:var(--text); }
  .rec.rec-layout-feature .feat-body { padding:0 16px 14px; font-size:13px; color:var(--text-secondary); line-height:1.55; }
  /* quote: 大字居中 + 留白 */
  .rec.rec-layout-quote { padding:24px 20px; }
  .rec.rec-layout-quote .quote-text { font-size:18px; font-weight:600; line-height:1.6; color:var(--text); }
  .rec.rec-layout-quote .quote-meta { margin-top:10px; font-size:12px; color:var(--text-tertiary); }


  /* module two-column layout: 左记录 / 右统计侧栏 */
  .mod-layout { display:grid; grid-template-columns: 1fr 300px; gap: 16px; align-items: start; margin-top: 14px; }
  .mod-side { display:flex; flex-direction:column; gap: 12px; position: sticky; top: 16px; }
  .side-card { background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-tile); box-shadow:var(--shadow-card); padding:14px 15px; }
  .side-card .sh { display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:600; margin-bottom:10px; }
  .side-card .sh svg { color:var(--text-tertiary); }
  .stat-row { display:flex; align-items:center; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--border); }
  .stat-row:last-child { border-bottom:none; padding-bottom:0; }
  .stat-row .k { font-size:12.5px; color:var(--text-secondary); display:flex; align-items:center; gap:7px; }
  .stat-row .k .kd { width:8px; height:8px; border-radius:50%; flex:0 0 auto; }
  .stat-row .val { font-size:14px; font-weight:600; letter-spacing:-.01em; }
  /* 分类占比条 */
  .catbar { margin-top:4px; }
  .catbar .cbrow { display:flex; align-items:center; gap:9px; padding:7px 0; }
  .catbar .cbrow .cbn { font-size:12.5px; color:var(--text); width:52px; flex:0 0 auto; }
  .catbar .cbrow .cbt { flex:1; height:8px; border-radius:999px; background:var(--border); overflow:hidden; }
  .catbar .cbrow .cbt i { display:block; height:100%; border-radius:999px; }
  .catbar .cbrow .cbv { font-size:12px; color:var(--text-secondary); width:56px; text-align:right; flex:0 0 auto; }
  /* 大环形（进度/打卡侧栏） */
  .side-ring { display:flex; flex-direction:column; align-items:center; gap:10px; padding:6px 0 2px; }
  .side-ring .dial { position:relative; width:150px; height:150px; }
  .side-ring .dial svg.gauge { transform: rotate(-90deg); width:100%; height:100%; }
  .side-ring .dial .mid { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; }
  .side-ring .big { font-size:32px; font-weight:600; letter-spacing:-.02em; line-height:1; }
  .side-ring .cap { font-size:13px; color:var(--text-secondary); margin-top:2px; }

  /* finance summary minis */
  .mod-summary { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom: 4px; }
  .mini { background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-tile); box-shadow:var(--shadow-card); padding:12px 14px; }
  .mini .l { font-size:12px; color:var(--text-secondary); }
  .mini .v { font-size:19px; font-weight:600; margin-top:3px; letter-spacing:-.02em; }

  /* record list — 行式列表 */
  .rec-grid { display:flex; flex-direction:column; gap:9px; }
  .rec { position:relative; background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-tile); box-shadow:var(--shadow-card); padding:14px 16px; transition: border-color .12s, box-shadow .15s; }
  .rec:hover { border-color: var(--border-input); }
  .rec .top { display:flex; align-items:center; gap:12px; }
  .rec .chk { flex:0 0 auto; width:18px; height:18px; border-radius:var(--radius-sm); border:1.5px solid var(--border-input); display:grid; place-items:center;
    cursor:pointer; background:var(--surface-card); color:#fff; transition: all .12s; }
  .rec .chk.on { background:var(--accent); border-color:var(--accent); }
  .rec .chk svg { opacity:0; } .rec .chk.on svg { opacity:1; }
  .rec .body { flex:1; min-width:0; cursor:pointer; display:flex; align-items:center; gap:11px; flex-wrap:wrap; }
  .rec .rname { font-weight:700; font-size:14.5px; letter-spacing:-.01em; flex:0 1 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%; }
  .rec .rname.done { text-decoration:line-through; color:var(--text-secondary); }
  .rec .rmeta { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .rec .rnote { flex:1 0 100%; color:var(--text-secondary); font-size:12.5px; margin-top:5px; white-space:pre-wrap; line-height:1.5;
    overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .badge { display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:999px; font-size:11.5px; font-weight:700; }
  .badge .dot { width:6px; height:6px; border-radius:50%; background:currentColor; }
  .rec .acts { position:absolute; top:50%; right:8px; transform:translateY(-50%); display:flex; gap:1px; opacity:0; transition: opacity .15s; background:var(--surface-card); }
  .rec:hover .acts { opacity:1; }
  .rec .acts button { border:none; background:transparent; color:var(--text-tertiary); cursor:pointer;
    width:28px; height:28px; border-radius:7px; display:grid; place-items:center; transition: all .15s; }
  .rec .pin-btn:hover { background:var(--surface-nested); color:var(--module-3); }
  .rec .pin-btn.on { color:var(--module-3); opacity:1; } .rec .pin-btn.on svg { fill: var(--module-3); }
  .rec:has(.pin-btn.on) .acts { opacity:1; }
  .rec .del:hover { background:var(--danger-muted); color:var(--danger); }
  .rec .pbar { flex:1; min-width:80px; height:6px; border-radius:999px; background:var(--border); overflow:hidden; }
  .rec .pbar i { display:block; height:100%; border-radius:999px; }
  .rec .amt { font-size:15px; font-weight:600; letter-spacing:-.02em; white-space:nowrap; margin-left:auto; }
  .rec .amt.exp { color:var(--danger); } .rec .amt.inc { color:var(--module-1); }
  .rec .streak { font-size:11.5px; color:var(--module-3); font-weight:700; display:inline-flex; align-items:center; gap:4px; }
  .rec .rdate { color:var(--text-secondary); font-size:11.5px; margin-left:auto; white-space:nowrap; }
  .empty { text-align:center; color:var(--text-secondary); padding:50px 20px; }
  .empty .e { display:inline-grid; place-items:center; width:56px; height:56px; border-radius:16px; background:var(--surface-card); border:1px solid var(--border); color:var(--text-tertiary); margin-bottom:12px; }

  /* ---------- modal ---------- */
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:60;
    display:flex; align-items:center; justify-content:center; animation: fade .15s ease; }
  @keyframes fade { from { opacity:0; } }
  .modal { background:var(--surface-card); border-radius:var(--radius-card); padding:24px; width:460px; max-width:92vw; max-height:90vh; overflow-y:auto;
    border:1px solid var(--border); animation: pop .15s ease; }
  @keyframes pop { from { transform: translateY(8px); opacity:0; } }
  .modal h3 { font-size:18px; font-weight:600; letter-spacing:-.01em; }
  .modal .sub { color:var(--text-secondary); font-size:13px; margin:4px 0 18px; font-weight:500; }
  .field { margin-bottom:14px; }
  .field label { display:block; color:var(--text-secondary); font-size:12px; font-weight:500; margin-bottom:6px; }
  .frow { display:flex; gap:12px; } .frow .field { flex:1; }
  .seg { display:flex; gap:8px; flex-wrap:wrap; }
  .seg .opt { flex:1; min-width:64px; text-align:center; padding:8px 10px; border-radius:var(--radius-control); border:1px solid var(--border);
    cursor:pointer; font-size:13px; font-weight:500; color:var(--text-secondary); transition: all .12s; }
  .seg .opt.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .modal-actions { display:flex; align-items:center; gap:8px; margin-top:20px; }
  .link-danger { color:var(--danger); background:none; border:none; font-size:13px; font-weight:500; cursor:pointer; padding:8px 10px; border-radius:var(--radius-control); }
  .link-danger:hover { background:var(--danger-muted); }

  /* ============================================================
     BENTO DASHBOARD — 首页复杂网格布局（墨色中性 · 高密度）
     ============================================================ */
  .bento { display:grid; grid-template-columns: repeat(12, 1fr); gap:16px; align-items:stretch; }
  .bento > * { min-width:0; }   /* 允许网格轨道收窄，避免窄屏内容溢出 */
  .b3{grid-column:span 3} .b4{grid-column:span 4} .b5{grid-column:span 5}
  .b6{grid-column:span 6} .b7{grid-column:span 7} .b8{grid-column:span 8} .b12{grid-column:span 12}

  /* 分组标题（EN 副标题 + 中文标题 + 分隔线） */
  .sec-grp { display:flex; align-items:center; gap:12px; margin:26px 2px 14px; }
  .sec-grp .bar { width:4px; height:19px; border-radius:2px; background:var(--accent); flex:0 0 auto; }
  .sec-grp .zh { font-size:16px; font-weight:600; letter-spacing:-.02em; }
  .sec-grp .en { font-size:10.5px; font-weight:600; letter-spacing:.15em; color:var(--text-tertiary); }
  .sec-grp .line { flex:1; height:1px; background:var(--border); }

  /* 通用瓷砖 - Minimal Dashboard */
  .tile { background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-card);
    padding:20px; display:flex; flex-direction:column; transition:border-color .15s ease; }
  .tile:hover { border-color:var(--border-input); }
  .tile-h { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .tile-h .tic { color:var(--accent); display:flex; width:32px; height:32px; align-items:center; justify-content:center; background:var(--accent-muted); border-radius:var(--radius-control); }
  .tile-h .en { font-size:10px; font-weight:600; letter-spacing:.08em; color:var(--text-tertiary); line-height:1; text-transform:uppercase; }
  .tile-h .zh { font-size:15px; font-weight:600; line-height:1.2; color:var(--text); }
  .tile-h .tt { display:flex; flex-direction:column; gap:2px; }
  .tile-h .r { margin-left:auto; font-size:12px; color:var(--text-secondary); font-weight:500; font-family:var(--font-mono); }

  /* 整体情况瓷砖 - Minimal */
  .ov2-body { display:grid; grid-template-columns:1fr 300px; gap:20px; flex:1; align-items:stretch; }
  .ov2-body .rings { align-content:center; }
  .ov2-side { position:relative; overflow:hidden; border-radius:var(--radius-card);
    background:var(--surface-nested); border:1px solid var(--border);
    padding:20px; display:flex; flex-direction:column; justify-content:space-between; gap:12px; }
  .ov2-side::before, .ov2-side::after { display:none; }
  .ov2-stat { position:relative; z-index:1; display:flex; align-items:center; gap:12px; cursor:pointer;
    padding:10px 4px; border-radius:var(--radius-control); transition:background .15s; }
  .ov2-stat:hover { background:var(--surface-card); }
  .ov2-stat + .ov2-stat { border-top:1px solid var(--border); }
  .ov2-stat .s-ic { width:36px; height:36px; border-radius:var(--radius-control); display:grid; place-items:center; flex:0 0 auto;
    background:var(--surface-card); color:var(--accent); border:1px solid var(--border); }
  .ov2-stat .s-tx { min-width:0; }
  .ov2-stat .s-v { font-size:20px; font-weight:600; letter-spacing:-.01em; line-height:1.1; color:var(--text);
    font-variant-numeric:tabular-nums; font-family:var(--font-mono); }
  .ov2-stat .s-l { font-size:11.5px; color:var(--text-secondary); margin-top:2px; font-weight:500; }

  /* 大时钟卡 - Minimal */
  .clock-card { position:relative; overflow:hidden; border-radius:var(--radius-card);
    background:var(--surface-card); border:1px solid var(--border); color:var(--text);
    padding:24px; display:flex; flex-direction:column; justify-content:space-between; min-height:180px; }
  .clock-card::before, .clock-card::after { display:none; }
  .clock-card > * { position:relative; z-index:1; }
  .clock-card .hi { font-size:22px; font-weight:600; letter-spacing:-.01em; }
  .clock-card .sub { font-size:12.5px; color:var(--text-secondary); margin-top:4px; max-width:230px; line-height:1.5; font-weight:500; }
  .clock-card .clk { font-size:clamp(36px,4.2vw,48px); font-weight:600; letter-spacing:-.02em; font-variant-numeric:tabular-nums; line-height:1; font-family:var(--font-mono); color:var(--text); }
  .clock-card .cmeta { display:flex; align-items:center; gap:10px; margin-top:8px; font-size:12px; color:var(--text-secondary); font-weight:500; }
  .clock-card .cmeta .dot { width:4px; height:4px; border-radius:50%; background:var(--accent); }

  /* 焦点/统计瓷砖 */
  .focus-list { display:flex; flex-direction:column; gap:9px; }
  .focus-row { display:flex; align-items:center; gap:11px; }
  .focus-row .fic { width:30px; height:30px; border-radius:9px; display:grid; place-items:center; flex:0 0 auto;
    background:var(--surface-nested); border:1px solid var(--border); }
  .focus-row .ft { flex:1; min-width:0; cursor:pointer; }
  .focus-row .fn { font-size:13.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .focus-row .fn.done { text-decoration:line-through; color:var(--text-secondary); }
  .focus-row .fm { font-size:11px; color:var(--text-secondary); margin-top:2px; }
  .focus-empty { color:var(--text-secondary); font-size:12.5px; line-height:1.7; padding:6px 0; }
  .stat-big { font-size:32px; font-weight:600; letter-spacing:-.02em; line-height:1; font-family:var(--font-mono); font-variant-numeric:tabular-nums; color:var(--text); }
  .stat-big small { font-size:14px; color:var(--text-secondary); font-weight:500; letter-spacing:0; font-family:var(--font); }
  .stat-cap { font-size:12px; color:var(--text-secondary); margin-top:7px; font-weight:500; }
  .prog-line { height:6px; border-radius:999px; background:var(--surface-nested); overflow:hidden; margin-top:auto; }
  .prog-line i { display:block; height:100%; border-radius:999px; background:var(--accent); }

  /* 习惯追踪周网格表 */
  .habit-tb { width:100%; border-collapse:collapse; }
  .habit-tb th { font-size:10.5px; font-weight:700; color:var(--text-tertiary); padding:0 0 9px; text-align:center; }
  .habit-tb th.hh { text-align:left; }
  .habit-tb th.hr { text-align:right; }
  .habit-tb td { padding:5px 0; text-align:center; vertical-align:middle; }
  .habit-tb td.hn { text-align:left; font-size:12.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:118px; }
  .habit-tb td.hn .hdot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:7px; vertical-align:middle; }
  .habit-tb td.hrate { text-align:right; font-size:12.5px; font-weight:600; letter-spacing:-.02em; }
  .hcell { display:inline-grid; place-items:center; width:22px; height:22px; border-radius:7px; color:var(--on-accent); cursor:pointer; transition:transform .12s; }
  .hcell:hover { transform:scale(1.12); }
  .hcell.on { background:var(--module-1); }
  .hcell.off { background:var(--surface-nested); border:1px solid var(--border); }
  .hcell svg { opacity:0; } .hcell.on svg { opacity:1; }
  .habit-tb .tdcol { background:var(--accent-muted); }
  .habit-tb col.todaycol { background:var(--accent-muted); }

  /* 待办清单（仪表盘式） */
  .tk-head { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .tk-head .pct { font-size:22px; font-weight:600; letter-spacing:-.03em; }
  .tk-head .cnt { font-size:12px; color:var(--text-secondary); font-weight:700; }
  .tk-head .bar { flex:1; height:6px; border-radius:999px; background:var(--border); overflow:hidden; }
  .tk-head .bar i { display:block; height:100%; border-radius:999px; background:var(--accent); }
  .tk-list { display:flex; flex-direction:column; }
  .tk-row { display:flex; align-items:center; gap:11px; padding:8px 0; border-bottom:1px solid var(--border); }
  .tk-row:last-child { border-bottom:none; }
  .tk-chk { flex:0 0 auto; width:18px; height:18px; border-radius:var(--radius-sm); border:1.5px solid var(--border-input);
    display:grid; place-items:center; cursor:pointer; background:var(--surface-card); color:#fff; transition:all .15s; }
  .tk-chk:hover { border-color:var(--accent); }
  .tk-chk.on { background:var(--accent); border-color:var(--accent); }
  .tk-chk svg { opacity:0; } .tk-chk.on svg { opacity:1; }
  .tk-name { flex:1; min-width:0; font-size:13.5px; font-weight:600; cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tk-name.done { text-decoration:line-through; color:var(--text-secondary); }

  /* 番茄钟 - Minimal */
  .pomo { position:relative; overflow:hidden; border-radius:var(--radius-card); text-align:center;
    background:var(--surface-card); border:1px solid var(--border); color:var(--text); padding:20px;
    display:flex; flex-direction:column; }
  .pomo::before { display:none; }
  .pomo > * { position:relative; z-index:1; }
  .pomo .pen { font-size:10px; font-weight:600; letter-spacing:.1em; color:var(--text-tertiary); text-transform:uppercase; }
  .pomo .pzh { font-size:14px; font-weight:600; margin-top:2px; color:var(--text); }
  .pomo .ring-wrap { position:relative; width:140px; height:140px; margin:12px auto 10px; }
  .pomo .ring-wrap svg { transform:rotate(-90deg); }
  .pomo .ptime { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
  .pomo .ptime .t { font-size:30px; font-weight:600; font-variant-numeric:tabular-nums; font-family:var(--font-mono); letter-spacing:-.01em; }
  .pomo .ptime .s { font-size:11px; color:var(--text-secondary); font-weight:500; }
  .pomo .pctl { display:flex; gap:8px; justify-content:center; margin-bottom:12px; }
  .pomo .pctl button { border:1px solid var(--border); background:var(--surface-card); color:var(--text);
    border-radius:var(--radius-control); padding:8px 16px; font-size:13px; font-weight:500; cursor:pointer; transition:all .15s; font-family:var(--font); }
  .pomo .pctl button:hover { border-color:var(--border-input); background:var(--surface-nested); }
  .pomo .pctl button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .pomo .pctl button.primary:hover { background:var(--brand-700); }
  .pomo .pstats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .pomo .pstats .ps { background:var(--surface-nested); border-radius:var(--radius-control); padding:8px 4px; border:1px solid var(--border); }
  .pomo .pstats .pv { font-size:17px; font-weight:600; letter-spacing:-.01em; font-family:var(--font-mono); color:var(--text); }
  .pomo .pstats .pl { font-size:10.5px; color:var(--text-tertiary); margin-top:2px; font-weight:500; }

  /* 在读好书 */
  .book-list { display:flex; flex-direction:column; gap:12px; }
  .book-row { display:flex; align-items:center; gap:12px; cursor:pointer; }
  .book-row .spine { width:34px; height:46px; border-radius:5px; flex:0 0 auto; position:relative; box-shadow:var(--shadow-card);
    display:grid; place-items:center; color:var(--on-accent); }
  .book-row .spine::after { content:""; position:absolute; left:4px; top:4px; bottom:4px; width:2px; border-radius:2px; background:rgba(255,255,255,.35); }
  .book-row .bmid { flex:1; min-width:0; }
  .book-row .btt { font-size:13.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .book-row .bsub { font-size:11px; color:var(--text-secondary); margin-top:3px; }
  .book-row .bbar { height:5px; border-radius:999px; background:var(--border); overflow:hidden; margin-top:7px; }
  .book-row .bbar i { display:block; height:100%; border-radius:999px; }
  .book-row .bpct { font-size:14px; font-weight:600; letter-spacing:-.02em; flex:0 0 auto; }

  /* 本周目标 / 通用目标条 */
  .goal-list { display:flex; flex-direction:column; gap:13px; }
  .goal-row .gt { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; margin-bottom:7px; }
  .goal-row .gt .gp { margin-left:auto; font-size:12.5px; font-weight:600; color:var(--text-secondary); letter-spacing:-.02em; }
  .goal-row .gt .gdone { color:var(--module-1); display:flex; }
  .goal-row .gbar { height:7px; border-radius:999px; background:var(--border); overflow:hidden; }
  .goal-row .gbar i { display:block; height:100%; border-radius:999px; }

  /* 月度开销 */
  .spend-sum { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  .spend-total { font-size:26px; font-weight:600; letter-spacing:-.03em; }
  .spend-cap { font-size:11.5px; color:var(--text-secondary); }

  .hidden { display:none !important; }

  /* ---------- PWA & Sync toolbar ---------- */
  .sync-toolbar { display:flex; align-items:center; gap:6px; padding:10px 14px; margin-top:14px;
    border-top:1px solid var(--border); border-bottom:1px solid var(--border); }
  .sync-toolbar .st-label { font-size:12px; font-weight:700; color:var(--text-secondary); letter-spacing:.04em; }
  .sync-toolbar .st-spacer { flex:1; }
  .sync-btn { display:inline-flex; align-items:center; gap:5px; padding:6px 12px; font-size:12px; font-weight:600;
    border-radius:8px; border:1px solid var(--border-input); background:var(--surface-card); color:var(--text);
    cursor:pointer; transition:all .12s; }
  .sync-btn:hover { background:var(--accent-muted); border-color:var(--accent); color:var(--accent); }
  .sync-btn svg { width:15px; height:15px; }
  .sync-toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:100;
    background:var(--accent); color:var(--on-accent); padding:10px 20px; border-radius:10px;
    font-size:13px; font-weight:600; box-shadow:0 8px 20px rgba(0,0,0,.2);
    animation: toastIn .25s ease; }
  .sync-toast.error { background:var(--danger); }
  .sync-toast.warn { background:var(--module-2); }
  @keyframes toastIn { from { opacity:0; transform:translateX(-50%) translateY(10px); } }
  .sidebar .sync-bar { display:flex; gap:6px; padding:10px 14px; border-top:1px solid var(--drawer-hover); }
  .sidebar .sync-bar .sync-btn { flex:1; justify-content:center; padding:7px 10px; font-size:11.5px;
    background:var(--drawer-hover); border-color:var(--drawer-active); color:var(--drawer-text); }
  .sidebar .sync-bar .sync-btn:hover { background:var(--drawer-active); color:var(--drawer-text); }

  /* ---------- Cloud Sync ---------- */
  .cloud-bar { padding: 10px 14px; border-top:1px solid var(--drawer-hover); }
  .cloud-bar .cb-status { display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--drawer-text-mute); margin-bottom:8px; }
  .cloud-bar .cb-dot { width:7px; height:7px; border-radius:50%; background:var(--drawer-text-mute); }
  .cloud-bar .cb-dot.online { background:#4ade80; box-shadow:0 0 6px #4ade80; }
  .cloud-bar .cb-dot.syncing { background:#facc15; animation:pulse 1s infinite; }
  @keyframes pulse { 50% { opacity:.4; } }
  .cloud-bar .cb-row { display:flex; gap:6px; }
  .cloud-bar .cb-btn { flex:1; display:flex; align-items:center; justify-content:center; gap:4px;
    padding:7px 8px; font-size:11px; font-weight:600;
    background:var(--drawer-hover); border:1px solid var(--drawer-active); color:var(--drawer-text);
    border-radius:8px; cursor:pointer; transition:all .12s; }
  .cloud-bar .cb-btn:hover { background:var(--drawer-active); }
  .cloud-bar .cb-btn:disabled { opacity:.5; cursor:not-allowed; }
  .cloud-bar .cb-btn svg { width:13px; height:13px; }
  .cloud-bar .cb-logo { font-size:10px; color:var(--drawer-text-mute); text-align:center; margin-top:6px; }
  .notion-bar { padding: 10px 14px; border-top:1px solid var(--drawer-hover); }
  .notion-bar .nb-header { display:flex; align-items:center; gap:7px; margin-bottom:5px; }
  .notion-bar .nb-icon { display:flex; align-items:center; color:var(--drawer-text-mute); }
  .notion-bar .nb-icon svg { width:13px; height:13px; }
  .notion-bar .nb-title { font-size:11.5px; font-weight:600; color:var(--drawer-text); flex:1; }
  .notion-bar .nb-cfg { background:none; border:none; color:var(--drawer-text-mute); cursor:pointer; padding:2px; border-radius:4px; display:flex; }
  .notion-bar .nb-cfg:hover { color:var(--drawer-text); background:var(--drawer-hover); }
  .notion-bar .nb-status { font-size:11px; color:var(--drawer-text-mute); margin-bottom:6px; }
  .notion-bar .nb-status.connected { color:#4ade80; }
  .notion-bar .nb-status.error { color:#f87171; }
  .notion-bar .nb-modules { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:6px; }
  .notion-bar .nb-module { font-size:10px; padding:2px 6px; background:var(--drawer-hover); border:1px solid var(--drawer-active); border-radius:6px; color:var(--drawer-text-mute); cursor:pointer; }
  .notion-bar .nb-module.active { background:var(--accent-muted); color:var(--accent); border-color:var(--accent); }
  .notion-bar .nb-actions { display:flex; gap:6px; }
  .notion-bar .nb-btn { flex:1; display:flex; align-items:center; justify-content:center; gap:4px;
    padding:6px 8px; font-size:11px; font-weight:600;
    background:var(--drawer-hover); border:1px solid var(--drawer-active); color:var(--drawer-text);
    border-radius:8px; cursor:pointer; transition:all .12s; }

  .notion-bar .nb-btn:disabled { opacity:.5; cursor:not-allowed; }
  .notion-bar .nb-last { font-size:10px; color:var(--drawer-text-mute); text-align:center; margin-top:5px; }
  .notion-bar .nb-last.success { color:var(--accent); }
  .notion-bar .nb-last.error { color:var(--danger); }
  .cloud-config { display:flex; flex-direction:column; gap:10px; }
  .cloud-config .cfg-row { display:flex; flex-direction:column; gap:4px; }
  .cloud-config label { font-size:12px; font-weight:600; color:var(--text-secondary); }
  .cloud-config input { font-family:var(--font); font-size:13px; }
  .cloud-config .cfg-help { font-size:11px; color:var(--text-tertiary); line-height:1.5; }
  .cloud-config .cfg-help code { background:var(--surface-nested); padding:1px 5px; border-radius:3px; }
  /* Notion config modal styles */
  .notion-config .nc-row { display:flex; flex-direction:column; gap:4px; }
  .notion-config .nc-row label { font-size:12px; font-weight:600; color:var(--text-secondary); }
  .notion-config .nc-input { font-family:var(--font); font-size:13px; }
  .notion-config .nc-help { font-size:11px; color:var(--text-tertiary); line-height:1.5; }
  .notion-config .nc-section-title { font-size:13px; font-weight:700; color:var(--text); margin:8px 0 4px; border-bottom:1px solid var(--border); padding-bottom:6px; }
  .notion-config .nc-mod-row { display:flex; align-items:center; gap:8px; margin:4px 0; }
  .notion-config .nc-mod-name { font-size:12px; font-weight:600; color:var(--text); width:90px; }
  .notion-config .nc-field-select { font-family:var(--font); font-size:12px; }
  /* IELTS tile & card styles */
  .ielts-tile { min-height: 160px; grid-column: 1 / -1 !important; }
  .ielts-tile .tile-h { margin-bottom: 10px; }
  .ielts-tile .ielts-body { display:flex; gap:20px; align-items:stretch; }
  .ielts-tile .ielts-overview { display:flex; align-items:center; gap:16px; flex-shrink:0; margin:0; }
  .ielts-tile .ielts-ring-wrap { position:relative; display:flex; align-items:center; justify-content:center; width:80px; height:80px; }
  .ielts-tile .ielts-ring-wrap svg.gauge { width:100%; height:100%; }
  .ielts-tile .ielts-ring-label { position:absolute; text-align:center; line-height:1.1; }
  .ielts-tile .ielts-ring-label b { font-size:18px; display:block; color:#6b8e5a; font-weight:600; }
  .ielts-tile .ielts-ring-label span { font-size:9px; color:var(--text-tertiary); }
  .ielts-tile .ielts-stats { display:flex; gap:12px; }
  .ielts-tile .ielts-stat { text-align:center; min-width:56px; }
  .ielts-tile .ielts-stat b { font-size:17px; display:block; }
  .ielts-tile .ielts-stat span { font-size:10px; color:var(--text-tertiary); }
  .ielts-tile .ielts-subjects { display:flex; flex-direction:row; gap:12px; flex:1; align-items:center; }
  .ielts-tile .ielts-sub-row { display:flex; flex-direction:column; align-items:center; gap:6px; padding:10px 12px; border-radius:10px; background:var(--surface-nested); text-align:center; min-width:80px; flex:1; }
  .ielts-tile .ielts-sub-row:hover { background:var(--accent-muted); }
  .ielts-tile .ielts-sub-name { font-size:12px; font-weight:600; width:auto; display:flex; flex-direction:column; align-items:center; gap:4px; }
  .ielts-tile .ielts-sub-bar { width:100%; height:4px; background:var(--border); border-radius:2px; overflow:hidden; }
  .ielts-tile .ielts-sub-bar i { display:block; height:100%; border-radius:2px; transition:width .3s; }
  .ielts-tile .ielts-sub-pct { font-size:13px; font-weight:700; }
  .ielts-tile .ielts-sub-today { font-size:10px; color:var(--accent); }
  .ielts-tile .ielts-tile-actions { display:flex; flex-direction:column; gap:6px; flex-shrink:0; }
  .ielts-tile .ielts-action { font-size:11px; padding:6px 10px; border-radius:8px; background:var(--surface-nested); color:var(--text-secondary); cursor:pointer; transition:all .12s; text-align:center; white-space:nowrap; }
  .ielts-tile .ielts-action:hover { background:#6b8e5a; color:#fff; }
  /* IELTS card in module view */
  .ielts-rec .ielts-sub { font-size:12px; color:var(--text-tertiary); margin-top:2px; }
  .ielts-rec .ielts-info-row { display:flex; align-items:center; gap:8px; margin-top:6px; flex-wrap:wrap; }
  .ielts-rec .ielts-info-chip { display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:6px; font-size:12px; font-weight:600; }
  .ielts-rec .ielts-info-chip .icn { font-size:13px; line-height:1; }
  .ielts-rec .ielts-info-chip.section { background:var(--surface-nested); color:var(--text-secondary); }
  .ielts-rec .ielts-info-chip.frequency { background:var(--accent-muted); color:var(--accent); }
  .ielts-rec .ielts-info-chip .lbl { font-weight:500; color:var(--text-tertiary); margin-right:2px; font-size:11px; }
  .ielts-rec .meta-line { display:flex; flex-wrap:wrap; gap:4px; margin-top:4px; }
  .ielts-rec .meta-tag { font-size:10px; padding:1px 6px; border-radius:4px; background:var(--drawer-hover); color:var(--text-secondary); }
  .ielts-rec .ielts-meta { display:flex; align-items:center; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .ielts-rec .ielts-diff { font-size:12px; color:#d4a017; }
  .ielts-rec .ielts-score { font-size:12px; font-weight:600; color:var(--accent); }
  .ielts-rec .ielts-note { font-size:12px; margin-top:6px; padding:6px 8px; border-radius:6px; background:var(--surface-nested); line-height:1.5; }
  .ielts-rec .ielts-note.ielts-weak { background:rgba(220,53,69,0.08); color:var(--danger); }
  .ielts-rec .ielts-note.ielts-plan { background:rgba(40,167,69,0.08); color:#28a745; }
  .ielts-rec .ielts-link { font-size:12px; margin-top:6px; color:var(--accent); text-decoration:none; }
  .ielts-rec .ielts-link:hover { text-decoration:underline; }
  .ielts-rec .rname.done { text-decoration:line-through; color:var(--text-tertiary); }
  .ielts-rec .gauge { width:28px; height:28px; display:block; }

  /* word checkin card - Minimal */
  .word-card { background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-card); padding:16px; }
  .word-card .wc-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .word-card .wc-title { display:flex; align-items:center; gap:8px; font-size:14px; font-weight:600; color:var(--text); }
  .word-card .wc-title svg { color:var(--accent); }
  .word-card .wc-target { font-size:12px; color:var(--text-secondary); }
  .word-card .wc-target b { color:var(--accent); font-weight:600; }
  .word-card .wc-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px; }
  .word-card .wc-field { background:var(--surface-nested); border:1px solid var(--border); border-radius:var(--radius-tile); padding:8px 10px; text-align:center; }
  .word-card .wc-field label { font-size:11px; color:var(--text-tertiary); display:block; margin-bottom:3px; }
  .word-card .wc-field input { width:100%; border:none; background:transparent; font-size:18px; font-weight:600; color:var(--text); text-align:center; outline:none; font-family:var(--font-mono); }
  .word-card .wc-field input::-webkit-outer-spin-button, .word-card .wc-field input::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
  .word-card .wc-field input[type=number] { -moz-appearance:textfield; }
  .word-card .wc-actions { display:flex; gap:8px; }
  .word-card .wc-btn { flex:1; padding:9px 12px; border-radius:var(--radius-tile); border:1px solid var(--border); background:var(--surface-card); font-size:13px; font-weight:500; cursor:pointer; transition:all .15s; font-family:var(--font); display:flex; align-items:center; justify-content:center; gap:5px; }
  .word-card .wc-btn:hover { border-color:var(--border-input); }
  .word-card .wc-btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .word-card .wc-btn.primary:hover { background:var(--brand-700); }
  .word-card .wc-btn.ghost { background:transparent; color:var(--text-secondary); }
  .word-card .wc-summary { display:flex; align-items:center; justify-content:space-between; margin-top:10px; padding-top:10px; border-top:1px solid var(--border); font-size:12px; color:var(--text-secondary); }
  .word-card .wc-summary b { color:var(--accent); font-weight:600; }

  /* word weekly bar */
  .word-weekly { display:flex; align-items:flex-end; gap:6px; padding:4px 0; }
  .word-weekly .ww-day { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; }
  .word-weekly .ww-bar { width:100%; height:60px; background:var(--surface-nested); border-radius:4px; overflow:hidden; display:flex; flex-direction:column; justify-content:flex-end; }
  .word-weekly .ww-bar i { display:block; background:var(--accent); border-radius:4px; transition:height .3s; }
  .word-weekly .ww-label { font-size:10px; color:var(--text-tertiary); }
  .word-weekly .ww-label.active { color:var(--text); font-weight:600; }

  /* word stats card */
  .word-stats { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
  .word-stats .ws-item { background:var(--surface-nested); border:1px solid var(--border); border-radius:var(--radius-tile); padding:10px 12px; }
  .word-stats .ws-item .ws-label { font-size:11px; color:var(--text-tertiary); }
  .word-stats .ws-item .ws-val { font-size:18px; font-weight:600; color:var(--accent); font-family:var(--font-mono); }

  /* ============================================================
     MiaoAI 助手样式 - Minimal Dashboard
     ============================================================ */
  /* AI规划瓷砖 */
  .ai-planner { background:var(--surface-card); position:relative; overflow:hidden; border:1px solid var(--border); }
  .ai-planner::before, .ai-planner::after { display:none; }
  .ai-planner > * { position:relative; z-index:1; }
  .ai-input-wrap { display:flex; gap:8px; margin:12px 0; }
  .ai-input-wrap input { flex:1; background:var(--surface-card); border:1px solid var(--border-input); border-radius:var(--radius-control); padding:8px 12px; }
  .ai-input-wrap input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(100,116,139,.1); }
  .ai-suggest { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .ai-suggest .sug-chip { font-size:11px; padding:4px 10px; border-radius:999px; background:var(--surface-nested); border:1px solid var(--border);
    color:var(--text-secondary); cursor:pointer; transition:all .12s; font-family:var(--font); }
  .ai-suggest .sug-chip:hover { background:var(--accent-muted); border-color:var(--accent); color:var(--accent); }
  .ai-result { display:none; margin-top:10px; padding:12px; background:var(--surface-nested); border-radius:var(--radius-tile); border:1px solid var(--border); }
  .ai-result.show { display:block; }
  .ai-result .ai-result-head { display:flex; align-items:center; gap:8px; margin-bottom:8px; font-size:12px; font-weight:600; color:var(--accent); }
  .ai-plan-list { display:flex; flex-direction:column; gap:6px; }
  .ai-plan-item { display:flex; align-items:flex-start; gap:8px; font-size:12.5px; padding:6px 8px; border-radius:var(--radius-control); background:var(--surface-card); border:1px solid var(--border); }
  .ai-plan-item .pi-ic { width:22px; height:22px; border-radius:6px; display:grid; place-items:center; flex:0 0 auto; font-size:12px; background:var(--accent-muted); color:var(--accent); }
  .ai-plan-item .pi-tx { flex:1; }
  .ai-plan-item .pi-name { font-weight:500; }
  .ai-plan-item .pi-note { font-size:11px; color:var(--text-secondary); margin-top:1px; }
  .ai-plan-actions { display:flex; gap:8px; margin-top:10px; }
  .ai-plan-actions button { flex:1; padding:7px 10px; border-radius:var(--radius-control); border:1px solid var(--border); font-size:12px; font-weight:500; cursor:pointer;
    font-family:var(--font); transition:all .12s; }
  .ai-plan-actions .btn-accept { background:var(--accent); color:#fff; border-color:var(--accent); }
  .ai-plan-actions .btn-accept:hover { background:var(--brand-700); }
  .ai-plan-actions .btn-cancel { background:transparent; color:var(--text-secondary); }
  .ai-plan-actions .btn-cancel:hover { background:var(--surface-nested); }
  .ai-loading { display:none; align-items:center; gap:8px; font-size:12px; color:var(--text-secondary); padding:8px 0; }
  .ai-loading.show { display:flex; }
  .ai-loading .dots { display:inline-flex; gap:3px; }
  .ai-loading .dots i { width:6px; height:6px; border-radius:50%; background:var(--accent); animation: bounce 1.2s infinite ease-in-out; }
  .ai-loading .dots i:nth-child(2) { animation-delay:.15s; }
  .ai-loading .dots i:nth-child(3) { animation-delay:.3s; }
  @keyframes bounce { 0%,80%,100% { transform:scale(.6); opacity:.4; } 40% { transform:scale(1); opacity:1; } }

  /* 悬浮AI助手按钮 - 方案三：圆形徽章，和网站favicon统一风格（侧脸铅笔小猫） */
  .miao-fab { position:fixed; right:20px; bottom:20px; width:48px; height:48px; border-radius:999px;
    background:var(--surface-card); border:1px solid var(--border); cursor:pointer;
    box-shadow:0 2px 10px rgba(0,0,0,.06); z-index:70; display:grid; place-items:center; padding:0; overflow:hidden;
    transition:all .18s cubic-bezier(.4,0,.2,1); }
  .miao-fab:hover { background:var(--surface-nested); border-color:var(--accent);
    box-shadow:0 4px 16px rgba(71,85,105,.15); transform:translateY(-2px); }
  .miao-fab:active { transform:translateY(0) scale(.97); }
  .miao-fab img { display:block; width:30px; height:30px; transition:transform .18s ease; }
  .miao-fab:hover img { transform:scale(1.08); }
  .miao-fab .fab-pulse { display:none; }

  /* AI聊天面板 - 极简印刷风：像在白纸上对话，无气泡无框线 */
  .miao-chat { position:fixed; right:24px; bottom:84px; width:360px; max-width:calc(100vw - 48px); max-height:520px;
    background:var(--surface-card); border:1px solid var(--border); border-radius:8px;
    box-shadow:0 1px 3px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
    z-index:75; display:flex; flex-direction:column; overflow:hidden; transform-origin:bottom right;
    transform:translateY(12px); opacity:0; pointer-events:none; transition:all .2s cubic-bezier(.4,0,.2,1); }
  .miao-chat.open { transform:translateY(0); opacity:1; pointer-events:auto; }

  /* 极简头部：无背景分隔线，紧凑留白 */
  .miao-chat-head { background:transparent; padding:18px 20px 12px; display:flex; align-items:center; gap:10px; border-bottom:none; }
  .miao-chat-head .c-ava { width:24px; height:24px; border-radius:0; background:transparent; display:grid; place-items:center; flex:0 0 auto; padding:0; overflow:hidden; }
  .miao-chat-head .c-ava img { width:20px; height:20px; display:block; opacity:.7; }
  .miao-chat-head .c-info { flex:1; }
  .miao-chat-head .c-name { font-size:13px; font-weight:600; color:var(--text); letter-spacing:.01em; }
  .miao-chat-head .c-status { font-size:11px; color:var(--text-tertiary); display:flex; align-items:center; gap:4px; margin-top:1px; font-weight:400; }
  .miao-chat-head .c-status .dot { width:5px; height:5px; border-radius:50%; background:#86efac; }
  .miao-chat-head .c-cfg { display:none; }
  .miao-chat-head .c-close { width:24px; height:24px; border-radius:4px; background:transparent; border:none; color:var(--text-tertiary); cursor:pointer;
    display:grid; place-items:center; transition:all .12s; font-size:13px; font-family:var(--font); opacity:.6; }
  .miao-chat-head .c-close:hover { opacity:1; background:var(--surface-nested); color:var(--text); }

  /* 消息区域：纯白背景，舒适行高，大留白 */
  .miao-chat-body { flex:1; overflow-y:auto; padding:8px 20px 12px; display:flex; flex-direction:column; gap:14px; background:transparent; }
  .miao-chat-body::-webkit-scrollbar { width:3px; }
  .miao-chat-body::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
  .miao-chat-body::-webkit-scrollbar-track { background:transparent; }

  /* 消息：无头像无气泡，纯文字靠对齐区分 */
  .c-msg { display:flex; max-width:100%; }
  .c-msg.bot { align-self:flex-start; }
  .c-msg.user { align-self:flex-end; justify-content:flex-end; }
  .c-msg .m-ava { display:none; }
  .c-msg .m-bubble { padding:0; border-radius:0; font-size:13.5px; line-height:1.7; font-weight:400; max-width:85%; word-wrap:break-word; }
  .c-msg.bot .m-bubble { color:var(--text); border:none; background:transparent; }
  .c-msg.user .m-bubble { color:var(--text-secondary); text-align:right; font-style:italic; opacity:.85; }
  .c-msg .m-time { display:none; }

  /* 快捷问题：纯文字链接样式，无按钮背景 */
  .c-quick { display:flex; flex-wrap:wrap; gap:12px; padding:4px 20px 12px; background:transparent; }
  .c-quick .cq { font-size:12px; padding:0; border-radius:0; background:transparent; border:none;
    color:var(--text-tertiary); cursor:pointer; font-family:var(--font); transition:color .12s; font-weight:400;
    text-decoration:underline; text-decoration-color:var(--border); text-underline-offset:3px; }
  .c-quick .cq:hover { color:var(--accent); text-decoration-color:var(--accent); background:transparent; }

  /* 输入区域：只有底部一条细线，无边框 */
  .miao-chat-input { padding:12px 20px 16px; background:transparent; border-top:1px solid var(--border); display:flex; gap:10px; align-items:center; }
  .miao-chat-input input { flex:1; border:none; border-radius:0; padding:6px 0; font-size:13.5px; font-family:var(--font); outline:none; background:transparent; color:var(--text); }
  .miao-chat-input input::placeholder { color:var(--text-tertiary); }
  .miao-chat-input input:focus { border:none; box-shadow:none; background:transparent; }
  .miao-chat-input button { width:auto; height:auto; border-radius:0; background:transparent; color:var(--text-tertiary); border:none; cursor:pointer;
    display:grid; place-items:center; transition:color .12s; flex:0 0 auto; padding:4px; font-size:16px; }
  .miao-chat-input button:hover { color:var(--accent); background:transparent; }
  .miao-chat-input button:disabled { opacity:.3; cursor:not-allowed; }

  /* 输入动画：极简三个点 */
  .c-typing { display:none; gap:3px; padding:4px 0; }
  .c-typing.show { display:flex; }
  .c-typing i { width:4px; height:4px; border-radius:50%; background:var(--text-tertiary); opacity:.5; animation: bounce 1.4s infinite ease-in-out; }
  .c-typing i:nth-child(2) { animation-delay:.2s; }
  .c-typing i:nth-child(3) { animation-delay:.4s; }

  /* ============================================================
     RAG 个人数据洞察 样式 - Minimal Dashboard
     ============================================================ */
  .rag-insight { background:var(--surface-card); position:relative; overflow:hidden; border:1px solid var(--border); }
  .rag-insight::before { display:none; }
  .rag-metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:10px 0; }
  .rag-metric { background:var(--surface-nested); border-radius:var(--radius-control); padding:10px 8px; text-align:center; border:1px solid var(--border); }
  .rag-metric .rm-val { font-size:20px; font-weight:700; color:var(--accent); font-family:var(--font-mono); }
  .rag-metric .rm-label { font-size:10.5px; color:var(--text-secondary); margin-top:2px; }
  .rag-actions { display:flex; gap:8px; }
  .rag-actions button { flex:1; padding:8px; border-radius:var(--radius-control); border:1px solid var(--border); font-size:11.5px; font-weight:500;
    cursor:pointer; font-family:var(--font); transition:all .12s; background:var(--surface-card); color:var(--text); }
  .rag-actions button:hover { background:var(--accent); color:#fff; border-color:var(--accent); }
  .rag-actions button svg { width:13px; height:13px; }
  .rag-qa { display:none; margin-top:10px; }
  .rag-qa.show { display:block; }

<script>
/* ============================================================
   手机版主逻辑
   共用工具函数/CONFIG/ICONS 已抽离到 assets/common.js
   ============================================================ */

const store = {
  load(){
    const raw = localStorage.getItem(CONFIG.storageKey);
    let d;
    if(raw){ try { d = JSON.parse(raw); } catch(e){} }
    if(!d) { d={}; CONFIG.modules.forEach(m=>d[m.key]=structuredClone(m.seed||[])); }
    // Migrate: ensure all modules have data arrays
    CONFIG.modules.forEach(m=>{
      if(!d[m.key]) d[m.key] = structuredClone(m.seed||[]);
    });
    // Migrate: upgrade boolean done to multi-state status for IELTS modules
    ['ielts_read','ielts_listening','ielts_writing','ielts_speaking','ielts_record'].forEach(key=>{
      (d[key]||[]).forEach(item=>{
        if(!item.status){
          item.status = item.done ? '✅ 已完成' : '☐ 未练习';
        }
      });
    });
    // Migrate: populate missing IELTS fields from _rawProps
    ['ielts_read','ielts_listening','ielts_writing','ielts_speaking','ielts_record'].forEach(key=>{
      (d[key]||[]).forEach(item=>{
        const rp = item._rawProps || {};
        if(!item.section){
          item.section = rp['部分'] || rp['Section'] || rp['section'] || rp['P1'] || rp['P2'] || rp['P3'] || rp['S1'] || rp['S2'] || rp['S3'] || rp['S4'] || '';
        }
        if(!item.frequency){
          item.frequency = rp['频次'] || rp['Frequency'] || rp['frequency'] || rp['频率'] || '';
        }
        if(!item.part){
          item.part = rp['Part'] || rp['part'] || '';
        }
        if(!item.task){
          item.task = rp['Task'] || rp['task'] || '';
        }
        if(!item.questionType){
          item.questionType = rp['题型'] || rp['Question Type'] || rp['questionType'] || '';
        }
      });
    });
    return d;
  },
  save(){ localStorage.setItem(CONFIG.storageKey, JSON.stringify(data)); },
};
let data = store.load();
let view = "home";
let searchQ = "";
let pomo = { running:false, remain:25*60, total:25*60 };   // 番茄钟状态（内存态，跨渲染保留）
let clockTimer = null;                                       // 全局秒级心跳（时钟 + 番茄钟）
function persist(){ store.save(); render(); }

function weekNum(){ return 1; }

/* 秒级心跳：更新时钟；番茄钟运行时倒计时 */
function startClock(){ if(clockTimer) return; clockTimer=setInterval(heartbeat,1000); heartbeat(); }
function heartbeat(){
  const el=$("#clk"); if(el){ const n=new Date(); el.textContent=`${pad2(n.getHours())}:${pad2(n.getMinutes())}:${pad2(n.getSeconds())}`; }
  if(pomo.running){ pomo.remain--; if(pomo.remain<=0) completePomo(); pomoUpdate(); }
}
function pomoUpdate(){
  const t=$("#pomo-time"); if(t){ t.textContent=`${pad2(Math.floor(pomo.remain/60))}:${pad2(pomo.remain%60)}`; }
  const fg=$("#pomo-fg"); if(fg){ const r=64,c=2*Math.PI*r; fg.style.strokeDashoffset=c*(1-pomo.remain/pomo.total); }
  const st=$("#pomo-status"); if(st) st.textContent=pomo.running?"专注中":"已暂停";
  const b=$("#pomo-toggle"); if(b) b.textContent=pomo.running?"暂停":"开始";
}
function completePomo(){ pomo.running=false; pomo.remain=pomo.total;
  data.__pomo=data.__pomo||{count:0,min:0}; data.__pomo.count++; data.__pomo.min+=Math.round(pomo.total/60); store.save();
  const c=$("#pomo-count"); if(c) c.textContent=data.__pomo.count;
  const mn=$("#pomo-min"); if(mn) mn.textContent=data.__pomo.min;
}

/* ---------- ring svg ---------- */
function ringSVG(pct, color, size){
  const s = size || 96;
  const r = s * 0.40, strokeW = s * 0.085;
  const c=2*Math.PI*r, off=c*(1-Math.min(100,pct)/100);
  return `<svg class="gauge" viewBox="0 0 ${s} ${s}" preserveAspectRatio="xMidYMid meet"><circle cx="${s/2}" cy="${s/2}" r="${r}" fill="none" stroke="var(--border)" stroke-width="${strokeW}"/>
    <circle cx="${s/2}" cy="${s/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${strokeW}" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>`;
}
function trendSVG(series){
  const w=560, h=170, padX=12, padTop=16, padBot=22;
  const max=Math.max(...series), min=Math.min(...series);
  const rng=(max-min)||1;
  const innerW=w-2*padX, innerH=h-padTop-padBot;
  const pts=series.map((v,i)=>{
    const x=padX+innerW*i/(series.length-1);
    const y=padTop+innerH*(1-(v-min)/rng);
    return [x,y];
  });
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L ${padX+innerW} ${h-padBot} L ${padX} ${h-padBot} Z`;
  const dots=pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.2" fill="var(--surface-card)" stroke="var(--module-2)" stroke-width="2"/>`).join('');
  return `<svg class="trend-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">
    <defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--module-2)" stop-opacity=".22"/><stop offset="1" stop-color="var(--module-2)" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#tg)"/><path d="${line}" fill="none" stroke="var(--module-2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>${dots}</svg>`;
}

/* ---------- HOME (Bento 复杂仪表盘) ---------- */
function grp(zh,en){ return `<div class="sec-grp"><span class="bar"></span><span class="zh">${zh}</span><span class="en">${en}</span><span class="line"></span></div>`; }

/* 今日聚焦：跨模块置顶任务（就地交互，不跳转） */
function focusTileHTML(){
  const pins=[]; CONFIG.modules.forEach(m=>(data[m.key]||[]).forEach(x=>{ if(x.pinned) pins.push({m,x}); }));
  const chk=icon("check",13,2.6);
  const sub=(m,x)=>{
    if(m.type==="checkin") return `${m.name} · 连续 ${streak(x.log)} 天`;
    if(m.type==="progress"){ const p=Math.min(100,Math.round((x.current/x.target)*100||0)); return `${m.name} · ${x.current}/${x.target} ${x.unit||m.unit||''} · ${p}%`; }
    return m.name;
  };
  const ctl=(m,x)=>{
    if(m.type==="checkin"){ const on=!!(x.log&&x.log[today()]); return `<div class="pin-chk js-pin-chk ${on?'on':''}" data-mkey="${m.key}" data-id="${x.id}">${chk}</div>`; }
    if(m.type==="todo"){ return `<div class="pin-chk js-pin-chk ${x.done?'on':''}" data-mkey="${m.key}" data-id="${x.id}">${chk}</div>`; }
    if(m.type==="progress"){ return `<div class="pin-step"><button class="js-pin-dec" data-mkey="${m.key}" data-id="${x.id}">−</button><button class="js-pin-inc" data-mkey="${m.key}" data-id="${x.id}">+</button></div>`; }
    return `<span style="color:var(--text-tertiary)">${icon("chevron",16,2)}</span>`;
  };
  const rows = pins.length ? pins.map(({m,x})=>`<div class="focus-row">
      <span class="fic" style="color:${m.color}">${icon(m.icon,16)}</span>
      <div class="ft js-pin-open" data-mkey="${m.key}" data-id="${x.id}"><div class="fn ${(m.type==='todo'&&x.done)?'done':''}">${esc(x.title)}</div><div class="fm">${sub(m,x)}</div></div>
      ${ctl(m,x)}</div>`).join("")
    : `<div class="focus-empty">在任意模块点击 <span style="display:inline-flex;color:var(--module-3);vertical-align:-2px">${icon("star",13)}</span> 即可把要事置顶到这里。</div>`;
  return `<div class="tile b3"><div class="tile-h"><span class="tic">${icon("star",16)}</span><div class="tt"><span class="en">TODAY'S FOCUS</span><span class="zh">今日聚焦</span></div><span class="r">${pins.length} 项</span></div>
    <div class="focus-list">${rows}</div></div>`;
}

/* 快速记录 */
function quickTileHTML(){
  const quick = CONFIG.quickAdd.map(q=>`<button class="qbtn" data-quick="${q.module}"><span class="e" style="background:${q.tint};color:${q.color}">${icon(q.icon,20)}<i class="qplus">${icon("plus",10,3)}</i></span><span class="l">${q.label}</span></button>`).join("");
  return `<div class="tile b3"><div class="tile-h"><span class="tic">${icon("plus",16,2.2)}</span><div class="tt"><span class="en">QUICK ADD</span><span class="zh">快速记录</span></div></div>
    <div class="quick-grid" style="flex:1;align-content:start">${quick}</div></div>`;
}

/* 今日概览（环形 + 深色统计侧栏，合并原「整体情况」独有指标） */
function overviewTileHTML(){
  const rings = CONFIG.overview.map(o=>{ const r=o.calc(data);
    return `<div class="ring" data-open="${o.key}"><div class="dial">${ringSVG(r.value,o.color)}<span class="mid">${icon(o.icon,26)}</span></div>

function wireHome(){
  $("#screen").querySelectorAll("[data-open]").forEach(el=>el.onclick=()=>go(el.dataset.open));
  $("#screen").querySelectorAll("[data-quick]").forEach(el=>el.onclick=()=>{ go(el.dataset.quick); openEditor(el.dataset.quick,null); });
  const find=el=>(data[el.dataset.mkey]||[]).find(i=>i.id==el.dataset.id);
  // 就地打卡 / 完成
  $("#screen").querySelectorAll(".js-pin-chk").forEach(el=>el.onclick=e=>{
    e.stopPropagation(); const m=modOf(el.dataset.mkey), x=find(el); if(!x) return;
    if(m.type==="todo"){ x.done=!x.done; }
    else if(m.type==="checkin"){ x.log=x.log||{}; const t=today(); x.log[t]?delete x.log[t]:x.log[t]=true; }
    persist();
  });
  $("#screen").querySelectorAll(".js-pin-inc").forEach(el=>el.onclick=e=>{ e.stopPropagation(); const x=find(el); if(!x) return; x.current=(+x.current||0)+1; persist(); });
  $("#screen").querySelectorAll(".js-pin-dec").forEach(el=>el.onclick=e=>{ e.stopPropagation(); const x=find(el); if(!x) return; x.current=Math.max(0,(+x.current||0)-1); persist(); });
  $("#screen").querySelectorAll(".js-pin-open").forEach(el=>el.onclick=e=>{ e.stopPropagation(); openEditor(el.dataset.mkey, find(el)); });
  // 习惯追踪表：点方框直接给对应日期打卡 / 取消
  $("#screen").querySelectorAll(".js-habit").forEach(el=>el.onclick=e=>{
    e.stopPropagation(); const x=(data.checkin||[]).find(i=>i.id==el.dataset.id); if(!x) return;
    const d=el.dataset.day; x.log=x.log||{}; x.log[d]?delete x.log[d]:x.log[d]=true; persist();
  });
  // 番茄钟控制
  const tg=$("#pomo-toggle"); if(tg) tg.onclick=()=>{ pomo.running=!pomo.running; pomoUpdate(); };
  const rs=$("#pomo-reset"); if(rs) rs.onclick=()=>{ pomo.running=false; pomo.remain=pomo.total; pomoUpdate(); };
  // IELTS tile sub-row clicks
  $("#screen").querySelectorAll(".ielts-sub-row, .ielts-action").forEach(el=>el.onclick=()=>{ go(el.dataset.open); });
  // AI Planner events
  MiaoAI.wirePlannerEvents();
  // RAG数据洞察事件
  MiaoAI.wireRAGEvents();
}

    else if(m.type==="checkin"){ const t=today(); const hab=it.filter(x=>x.type!=="word"); main=`今日 ${hab.filter(x=>x.log&&x.log[t]).length}/${hab.length} 打卡`; pct=hab.length?Math.round(hab.filter(x=>x.log&&x.log[t]).length/hab.length*100):0; }
    else if(m.type==="progress"){ pct=avgProgress(it).value; main=`平均进度 ${pct}%`; }
    else if(m.type==="finance"){ const e=it.filter(x=>x.type==="expense").reduce((a,x)=>a+ +x.amount,0); const inc=it.filter(x=>x.type==="income").reduce((a,x)=>a+ +x.amount,0); main=`收 ¥${inc} · 支 ¥${e}`; }
    else if(m.type==="ielts"){ const done=it.filter(x=>x.status==='✅ 已完成').length; pct=it.length?Math.round(done/it.length*100):0; main=`${done}/${it.length} 完成`; }
    else main=`${it.length} 条记录`;
    return `<div class="pin" data-open="${m.key}" style="cursor:pointer">
      <span class="pin-ic" style="color:${m.color};background:${m.tint};border-color:transparent">${icon(m.icon,19)}</span>
      <div class="pin-b"><div class="pin-t">${m.name}</div><div class="pin-m">${main}</div>
      ${['progress','todo','checkin','ielts'].includes(m.type)?`<div class="hero-bar" style="margin-top:9px"><i style="width:${pct}%;background:${m.color}"></i></div>`:''}</div>
      <span class="arw" style="color:var(--text-tertiary)">${icon("chevron",16,2)}</span></div>`; }).join("");
  $("#screen").innerHTML=`<div class="header"><div><h2>洞察</h2><p>各模块进展一览 · 记录—执行—统计—反馈</p></div><div class="spacer"></div><span class="date-chip">${icon("calendar",14)} ${dateStr()}</span></div>
    <div class="sec-title">模块概况</div><div class="pin-list" style="grid-template-columns:repeat(3,1fr)">${cards}</div>`;
  $("#screen").querySelectorAll("[data-open]").forEach(el=>el.onclick=()=>go(el.dataset.open));
}

/* ---------- MODULE VIEW ---------- */
function renderModule(key){
  const m=modOf(key); const all=data[key]||[]; let it=all;
  const t=today();
  const q=searchQ.trim().toLowerCase();
  if(q) it=all.filter(x=>(x.title||"").toLowerCase().includes(q)||(x.note||x.content||"").toLowerCase().includes(q));

  let head="";
  if(m.type==="finance"){
    const inc=all.filter(x=>x.type==="income").reduce((a,x)=>a+ +x.amount,0);
    const exp=all.filter(x=>x.type==="expense").reduce((a,x)=>a+ +x.amount,0);
    head=`<div class="mod-summary">
      <div class="mini"><div class="l">收入</div><div class="v" style="color:var(--module-1)">¥${inc}</div></div>
      <div class="mini"><div class="l">支出</div><div class="v" style="color:var(--danger)">¥${exp}</div></div>
      <div class="mini"><div class="l">结余</div><div class="v">¥${inc-exp}</div></div>
      <div class="mini"><div class="l">笔数</div><div class="v">${all.length}</div></div></div>`;
  } else if(m.type==="todo"){
    const done=all.filter(x=>x.done).length;
    head=headHero(m, `${done}/${all.length}`, "今日已完成");
  } else if(m.type==="checkin"){
    const habItems=all.filter(x=>x.type!=="word");
    const done=habItems.filter(x=>x.log&&x.log[t]).length;
    const wordItem=all.find(x=>x.type==="word");
    let headLabel=`今日 ${done}/${habItems.length} 习惯打卡`;
    let headNum=`${done}`;
    if(wordItem){
      const wT=(wordItem.log&&wordItem.log[t])||{};
      const wTot=(wT.newWords||0)+(wT.reviewWords||0);
      if(wTot>0){ headLabel+=` · ${wTot} 词`; headNum=`${done} · ${wTot} 词`; }
    }
    head=headHero(m, headNum, headLabel);
  } else if(m.type==="progress"){
    const p=avgProgress(all);
    head=headHero(m, `${p.value}%`, `平均进度 · ${all.length} 项`);
  } else if(m.type==="note"){
    const todayN=all.filter(x=>x.date===t).length;
    head=headHero(m, `${all.length}`, `条记录 · 今日 ${todayN} 条`, null);
  } else if(m.type==="ielts"){
    const doneCount=all.filter(x=>x.status==='✅ 已完成').length;
    const todayPlan=all.filter(x=>x.status==='📋 今日任务').length;
    const withAcc=all.filter(x=>x.accuracy!=null && x.accuracy>0);
    const avgAcc=withAcc.length?Math.round(withAcc.reduce((s,x)=>s+x.accuracy,0)/withAcc.length):0;
    head=`<div class="mod-summary">
      <div class="mini"><div class="l">已完成</div><div class="v" style="color:${m.color}">${doneCount}</div></div>
      <div class="mini"><div class="l">今日计划</div><div class="v">${todayPlan}</div></div>
      <div class="mini"><div class="l">平均正确率</div><div class="v" style="color:var(--accent)">${avgAcc}%</div></div>
      <div class="mini"><div class="l">总条目</div><div class="v">${all.length}</div></div></div>`;
  }

  const body = it.length ? it.map(x=>recHTML(m,x)).join("")
    : `<div class="empty"><span class="e">${icon(m.icon,28)}</span><div>${q?'没有匹配的记录':'还没有记录，点右上角「新建」添加第一条吧'}</div></div>`;

  $("#screen").innerHTML=`<div class="header"><div><h2>${m.name}</h2><p>${m.desc}</p></div><div class="spacer"></div><span class="date-chip">${icon("calendar",14)} ${dateStr()}</span></div>
    <div class="toolbar">
      <div class="search-box">${icon("search",15,2.2)}<input id="search" placeholder="搜索…" value="${attr(searchQ)}"/></div>
      <div class="spacer"></div><button class="btn" id="btn-new">${icon("plus",16,2.2)}新建</button></div>
    ${head}
    <div class="mod-layout">
      <div class="mod-main">
        <div class="sec-title">全部记录 <span id="rec-count" style="margin-left:auto;font-weight:500;color:var(--text-secondary);font-size:12px">${it.length} 条</span></div>
        <div class="rec-grid">${body}</div>
      </div>
      <aside class="mod-side">${sideStats(m,all)}</aside>
    </div>`;
  const s=$("#search");
  let composing=false;
  const refresh=()=>{ searchQ=s.value; renderModuleResults(key); };
  s.addEventListener("compositionstart",()=>{ composing=true; });
  s.addEventListener("compositionend",()=>{ composing=false; refresh(); });
  s.addEventListener("input",()=>{ if(!composing) refresh(); });
  $("#btn-new").onclick=()=>openEditor(key,null);
  wireModule(key);
}
