/* 模块统计侧栏：按 type 生成多维数据，填满右侧空间 */
function sideStats(m, all){
  const t=today();
  const palette=["var(--accent)","var(--module-1)","var(--module-2)","var(--module-3)","var(--module-4)","var(--module-5)","var(--danger)"];
  const row=(k,v,dot)=>`<div class="stat-row"><span class="k">${dot?`<span class="kd" style="background:${dot}"></span>`:''}${k}</span><span class="val">${v}</span></div>`;

  if(m.type==="finance"){
    const inc=all.filter(x=>x.type==="income").reduce((a,x)=>a+ +x.amount,0);
    const exp=all.filter(x=>x.type==="expense").reduce((a,x)=>a+ +x.amount,0);
    // 支出按分类聚合
    const byCat={}; all.filter(x=>x.type==="expense").forEach(x=>{ const c=x.category||"其他"; byCat[c]=(byCat[c]||0)+ +x.amount; });
    const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
    const maxC=cats.length?cats[0][1]:1;
    const catBars=cats.length? cats.map((c,i)=>`<div class="cbrow"><span class="cbn">${esc(c[0])}</span><span class="cbt"><i style="width:${Math.round(c[1]/maxC*100)}%;background:${palette[i%palette.length]}"></i></span><span class="cbv">¥${c[1]}</span></div>`).join("")
      : `<div style="color:var(--text-tertiary);font-size:12.5px;padding:6px 0">暂无支出记录</div>`;
    const todayExp=all.filter(x=>x.type==="expense"&&x.date===t).reduce((a,x)=>a+ +x.amount,0);
    return `<div class="side-card"><div class="sh">${icon("wallet",15)} 收支概况</div>
        ${row("总收入",`<span style="color:var(--module-1)">¥${inc}</span>`)}
        ${row("总支出",`<span style="color:var(--danger)">¥${exp}</span>`)}
        ${row("净结余",`¥${inc-exp}`)}
        ${row("今日支出",`¥${todayExp}`)}
        ${row("总笔数",`${all.length} 笔`)}</div>
      <div class="side-card"><div class="sh">${icon("chart",15)} 支出分类占比</div><div class="catbar">${catBars}</div></div>`;
  }

  if(m.type==="progress"){
    const p=avgProgress(all);
    const doneN=all.filter(x=>((x.current/x.target)*100||0)>=100).length;
    const totalCur=all.reduce((a,x)=>a+ (+x.current||0),0);
    const totalTgt=all.reduce((a,x)=>a+ (+x.target||0),0);
    return `<div class="side-card"><div class="sh">${icon("target",15)} 总体进度</div>
        <div class="side-ring"><div class="dial">${ringSVG(p.value,m.color)}<span class="mid"><span class="big" style="color:${m.color}">${p.value}%</span><span class="cap">平均进度</span></span></div></div></div>
      <div class="side-card"><div class="sh">${icon("list",15)} 数据统计</div>
        ${row("进行项目",`${all.length} 项`)}
        ${row("已达成",`${doneN} 项`)}
        ${row("累计完成",`${totalCur} ${all[0]?.unit||m.unit||''}`)}
        ${row("总目标量",`${totalTgt} ${all[0]?.unit||m.unit||''}`)}</div>`;
  }

  if(m.type==="checkin"){
    const wordItem=all.find(x=>x.type==="word");
    const habitItems=all.filter(x=>x.type!=="word");
    const done=habitItems.filter(x=>x.log&&x.log[t]).length;
    const habitPct=habitItems.length?Math.round(done/habitItems.length*100):0;
    const streaks=habitItems.map(x=>({title:x.title,s:streak(x.log)})).sort((a,b)=>b.s-a.s);
    const best=streaks[0]?streaks[0].s:0;
    const list=streaks.slice(0,6).map(x=>`<div class="stat-row"><span class="k">${esc(x.title)}</span><span class="val" style="color:var(--module-3)">${x.s} 天</span></div>`).join("");

    let wordPanel="";
    if(wordItem){
      const wLog=wordItem.log||{};
      const todayLog=wLog[t]||{};
      const totalToday=(todayLog.newWords||0)+(todayLog.reviewWords||0);
      const target=wordItem.target||50;
      const wordPct=Math.min(100,Math.round(totalToday/target*100));
      const wordStreak=streak(wLog);

      const wk=weekDates();
      const weekData=wk.map(d=>{
        const l=wLog[d]||{}; const tot=(l.newWords||0)+(l.reviewWords||0);
        return {date:d,total:tot,time:l.time||0,newWords:l.newWords||0,reviewWords:l.reviewWords||0};
      });
      const maxWords=Math.max(target,...weekData.map(w=>w.total));
      const weekTotal=weekData.reduce((a,w)=>a+w.total,0);
      const weekTime=weekData.reduce((a,w)=>a+w.time,0);
      const weekNew=weekData.reduce((a,w)=>a+w.newWords,0);
      const weekReview=weekData.reduce((a,w)=>a+w.reviewWords,0);
      const dayNames=["一","二","三","四","五","六","日"];
      const todayIdx=wk.indexOf(t);

      const barsHTML=weekData.map((w,i)=>{
        const h=maxWords>0?(w.total/maxWords*100):0;
        const activeClass=(i===todayIdx)?"active":"";
        return `<div class="ww-day"><div class="ww-bar"><i style="height:${h}%"></i></div><span class="ww-label ${activeClass}">${dayNames[i]}</span></div>`;
      }).join("");

      wordPanel=`<div class="side-card"><div class="sh">${icon("book",15)} 单词打卡</div>
        <div class="side-ring"><div class="dial">${ringSVG(wordPct,m.color)}<span class="mid"><span class="big" style="color:${m.color}">${wordPct}%</span><span class="cap">今日 ${totalToday} 词</span></span></div></div></div>
        <div class="side-card"><div class="sh">${icon("flame",15)} 单词统计</div>
          <div class="word-stats">
            <div class="ws-item"><div class="ws-label">连续天数</div><div class="ws-val">${wordStreak}</div></div>
            <div class="ws-item"><div class="ws-label">本周总数</div><div class="ws-val">${weekTotal}</div></div>
            <div class="ws-item"><div class="ws-label">本周新词</div><div class="ws-val">${weekNew}</div></div>
            <div class="ws-item"><div class="ws-label">本周复习</div><div class="ws-val">${weekReview}</div></div>
          </div></div>
        <div class="side-card"><div class="sh">${icon("bar-chart",15)} 本周单词量</div>
          <div class="word-weekly">${barsHTML}</div>
          <div class="sub" style="text-align:center;margin-top:6px">本周累计 ${weekTotal} 词 · ${weekTime} 分钟</div></div>`;
    }

    let habitPanel=`<div class="side-card"><div class="sh">${icon("leaf",15)} 今日打卡</div>
      <div class="side-ring"><div class="dial">${ringSVG(habitPct,m.color)}<span class="mid"><span class="big" style="color:${m.color}">${done}/${habitItems.length}</span><span class="cap">已完成</span></span></div></div></div>
      <div class="side-card"><div class="sh">${icon("flame",15)} 连续天数</div>
        ${row("最长连续",`<span style="color:var(--module-3)">${best} 天</span>`)}
        ${row("习惯总数",`${habitItems.length} 个`)}
        <div style="margin-top:6px">${list}</div></div>`;

    return wordPanel+habitPanel;
  }

  if(m.type==="todo"){
    const done=all.filter(x=>x.done).length; const pct=all.length?Math.round(done/all.length*100):0;
    const byP={}; (m.priorities||[]).forEach(p=>byP[p.key]=0); all.forEach(x=>{ if(byP[x.priority]!=null) byP[x.priority]++; });
    const pRows=(m.priorities||[]).map(p=>`<div class="stat-row"><span class="k"><span class="kd" style="background:${p.text}"></span>${p.label}</span><span class="val">${byP[p.key]||0} 项</span></div>`).join("");
    return `<div class="side-card"><div class="sh">${icon("list",15)} 完成情况</div>
        <div class="side-ring"><div class="dial">${ringSVG(pct,m.color)}<span class="mid"><span class="big" style="color:${m.color}">${pct}%</span><span class="cap">${done}/${all.length} 完成</span></span></div></div></div>
      <div class="side-card"><div class="sh">${icon("chart",15)} 优先级分布</div>
        ${pRows}
        ${row("剩余待办",`${all.length-done} 项`)}</div>`;
  }

  // ielts
  if(m.type==="ielts"){
    const done=all.filter(x=>x.status==='✅ 已完成').length;
    const todayPlan=all.filter(x=>x.status==='📋 今日任务').length;
    const withAcc=all.filter(x=>x.accuracy!=null && x.accuracy>0);
    const avgAcc=withAcc.length?Math.round(withAcc.reduce((s,x)=>s+x.accuracy,0)/withAcc.length):0;
    const pct=all.length?Math.round(done/all.length*100):0;
    const byStatus={};
    ['☐ 未练习','📋 今日任务','⏳ 进行中','✅ 已完成'].forEach(s=>byStatus[s]=0);
    all.forEach(x=>{ const s=x.status||'☐ 未练习'; byStatus[s]=(byStatus[s]||0)+1; });
    const statusRows=Object.entries(byStatus).map(([k,v])=>
      `<div class="stat-row"><span class="k">${k}</span><span class="val">${v}</span></div>`).join("");
    return `<div class="side-card"><div class="sh">${icon("chart",15)} 完成进度</div>
        <div class="side-ring"><div class="dial">${ringSVG(pct,m.color)}<span class="mid"><span class="big" style="color:${m.color}">${pct}%</span><span class="cap">${done}/${all.length} 完成</span></span></div></div></div>
      <div class="side-card"><div class="sh">${icon("list",15)} 状态分布</div>
        ${statusRows}
        ${row("平均正确率",`<span style="color:var(--accent)">${avgAcc}%</span>`)}
        ${row("今日计划",`${todayPlan} 项`)}</div>`;
  }

  // note default
  const todayN=all.filter(x=>x.date===t).length;
  const byMood={}; all.forEach(x=>{ const md=x.mood||"未分类"; byMood[md]=(byMood[md]||0)+1; });
  const moods=Object.entries(byMood).sort((a,b)=>b[1]-a[1]);
  const maxM=moods.length?moods[0][1]:1;
  const moodBars=moods.length? moods.map((c,i)=>`<div class="cbrow"><span class="cbn">${esc(c[0])}</span><span class="cbt"><i style="width:${Math.round(c[1]/maxM*100)}%;background:${palette[i%palette.length]}"></i></span><span class="cbv">${c[1]} 条</span></div>`).join("")
    : `<div style="color:var(--text-tertiary);font-size:12.5px;padding:6px 0">暂无记录</div>`;
  return `<div class="side-card"><div class="sh">${icon("pen",15)} 记录统计</div>
      ${row("累计记录",`${all.length} 条`)}
      ${row("今日新增",`${todayN} 条`)}
      ${row("标签种类",`${moods.length} 种`)}</div>
    <div class="side-card"><div class="sh">${icon("chart",15)} 标签分布</div><div class="catbar">${moodBars}</div></div>`;
}

/* per-module hero header: icon + big number + label */

function recHTML(m,x){

  const thumb=x.image?`<img class="thumb" src="${attr(x.image)}" alt="">`:'';

  const customBlock=customMeta?`<div class="meta-line">${customMeta}</div>`:'';

    const body=(x.content||x.note||'').trim();

      <div class="quote-text">${esc(text)}</div>
      ${x.mood?`<div class="quote-meta">${esc(x.mood)}${x.date?` · ${esc(x.date)}`:''}</div>`:(x.date?`<div class="quote-meta">${esc(x.date)}</div>`:'')}

      <div class="body" data-edit="${x.id}"><span class="rname ${x.done?'done':''}">${esc(x.title)}</span>
      ${p?`<span class="badge" style="background:${p.color};color:${p.text}"><span class="dot"></span>${p.label}</span>`:''}
      ${x.note?`<span class="rdate" style="margin-left:0;color:var(--text-tertiary)">${esc(x.note).slice(0,40)}</span>`:''}${customBlock}</div></div></div>`; }

    if(x.type==="word"){
      const t=today(); const todayLog=(x.log&&x.log[t])||{};

      return `<div class="word-card rec">

        </div>
        <div class="wc-actions">
          <button class="wc-btn primary js-word-save" data-id="${x.id}">${icon("check",14)} 保存打卡</button>

      <div class="body" data-edit="${x.id}"><span class="rname">${esc(x.title)}</span>
      <span class="streak">${icon("flame",13)} 连续 ${st} 天</span>${on?'<span class="badge" style="background:var(--accent-muted);color:var(--accent)">今日已打卡</span>':''}${customBlock}</div></div></div>`; }
  if(m.type==="progress"){ const pct=Math.min(100,Math.round((x.current/x.target)*100||0));
    return `<div class="rec ${layoutCls}">${acts}<div class="top" style="padding-right:60px">${thumb}<div class="body" data-edit="${x.id}">
      <span class="rname">${esc(x.title)}</span>

      <span class="rdate" style="margin-left:0;color:var(--text-secondary)">${x.current}/${x.target} ${x.unit||m.unit||''} · ${pct}%</span>

    return `<div class="rec ${layoutCls}">${acts}<div class="top" style="padding-right:60px">${thumb}<div class="body" data-edit="${x.id}">

    const sectionVal = x.section || rp['部分'] || rp['Section'] || rp['section'] || rp['P1'] || rp['P2'] || rp['P3'] || rp['S1'] || rp['S2'] || rp['S3'] || rp['S4'];

    if(freqVal) infoChips.push(`<span class="ielts-info-chip frequency"><span class="icn">🔤</span><span class="lbl">频次</span>${esc(freqVal)}</span>`);

          ${x.estimatedScore!=null?`<span class="ielts-score">评估: ${x.estimatedScore}</span>`:''}
          ${x.date?`<span class="rdate">${esc(x.date)}</span>`:''}
          ${statusBadge}

        ${x.weakness?`<div class="ielts-note ielts-weak">⚠️ ${esc(x.weakness)}</div>`:''}
        ${x.tomorrowPlan?`<div class="ielts-note ielts-plan">📌 ${esc(x.tomorrowPlan)}</div>`:''}

      </div></div></div>`;

  // note
  return `<div class="rec ${layoutCls}">${acts}<div class="top" style="padding-right:60px">${thumb}<div class="body" data-edit="${x.id}">
    <span class="rname">${esc(x.title||'无标题')}</span>
    ${x.mood?`<span class="badge" style="background:var(--accent-muted);color:var(--accent)">${esc(x.mood)}</span>`:''}
    ${x.content?`<span class="rdate" style="margin-left:0;color:var(--text-tertiary)">${esc(x.content).slice(0,40)}</span>`:''}
    <span class="rdate">${x.date||''}</span>${customBlock}</div></div></div>`;
}

function streak(log){ if(!log) return 0; let n=0; const d=new Date();
  for(;;){ const k=d.toISOString().slice(0,10); if(log[k]){ n++; d.setDate(d.getDate()-1);} else break; } return n; }

function wireModule(key){ const m=modOf(key);
  $("#screen").querySelectorAll(".js-chk").forEach(el=>el.onclick=e=>{ e.stopPropagation();
    const x=(data[key]).find(i=>i.id==el.dataset.id);
    if(m.type==="todo") x.done=!x.done;
    else if(m.type==="ielts"){
      const states = ['☐ 未练习','⏳ 进行中','✅ 已完成','📋 今日任务'];
      const cur = states.indexOf(x.status||'☐ 未练习');
      x.status = states[(cur+1) % states.length];
      x.done = (x.status === '✅ 已完成');
    }
    else if(m.type==="checkin"){
      if(x.type==="word"){
        x.log=x.log||{}; const t=today();
        const existing=x.log[t]||{};
        const newTime=+x.__wcTime||0, newWords=+x.__wcNew||0, newReview=+x.__wcReview||0;
        x.log[t]={time:newTime,newWords:newWords,reviewWords:newReview};
      } else {
        x.log=x.log||{}; const t=today(); x.log[t]?delete x.log[t]:x.log[t]=true;
      }
    }
    persist();
    renderModule(key);
  });
  $("#screen").querySelectorAll("[data-edit]").forEach(el=>el.onclick=()=>openEditor(key,(data[key]).find(i=>i.id==el.dataset.edit)));
  $("#screen").querySelectorAll(".js-del").forEach(el=>el.onclick=e=>{ e.stopPropagation(); confirmDelete(key, el.dataset.id); });
  $("#screen").querySelectorAll(".js-pin").forEach(el=>el.onclick=e=>{ e.stopPropagation(); const x=(data[key]).find(i=>i.id==el.dataset.id); x.pinned=!x.pinned; persist(); });
  // word card buttons
  $("#screen").querySelectorAll(".js-word-save").forEach(el=>el.onclick=e=>{
    e.stopPropagation(); const x=(data[key]).find(i=>i.id==el.dataset.id); if(!x) return;
    const card=el.closest(".word-card");
    x.__wcTime=card.querySelector("#wc-time")?.value||0;
    x.__wcNew=card.querySelector("#wc-new")?.value||0;
    x.__wcReview=card.querySelector("#wc-review")?.value||0;
    x.log=x.log||{}; const t=today();
    x.log[t]={time:+x.__wcTime,newWords:+x.__wcNew,reviewWords:+x.__wcReview};
    persist(); renderModule(key);
  });
  $("#screen").querySelectorAll(".js-word-reset").forEach(el=>el.onclick=e=>{
    e.stopPropagation(); const x=(data[key]).find(i=>i.id==el.dataset.id); if(!x) return;
    x.log=x.log||{}; const t=today(); delete x.log[t];
    persist(); renderModule(key);
  });
}

  overlay.innerHTML=`<div class="modal"><h3>${editing?'编辑':'新建'} · ${m.name}</h3><div class="sub">${m.desc}</div>${fields}
    <div class="modal-actions">${editing?'<button class="link-danger" id="m-del">删除</button>':''}<div class="spacer"></div>
      <button class="btn ghost" id="m-cancel">取消</button><button class="btn" id="m-save">保存</button></div></div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.onclick=e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#m-cancel").onclick=close;
  overlay.querySelectorAll(".seg").forEach(seg=>seg.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{ seg.querySelectorAll(".opt").forEach(x=>x.classList.remove("on")); o.classList.add("on"); }));

    const seg=id=>{ const el=overlay.querySelector(id+" .on"); return el?el.dataset.v:undefined; };
    d.title=(val("#f-title")||"").trim()||"未命名";
    d.layout=seg("#f-layout")||'default';
    if(m.type==="todo"){ d.priority=seg("#f-prio")||d.priority; d.note=(val("#f-note")||"").trim(); }
    else if(m.type==="progress"){ d.current=Math.max(0,+val("#f-cur")||0); d.target=Math.max(1,+val("#f-tgt")||1); d.unit=(val("#f-unit")||"").trim(); d.note=(val("#f-note")||"").trim(); }
    else if(m.type==="checkin"){
      const ctype=seg("#f-ctype")||"habit";
      if(ctype==="word"){ d.type="word"; d.target=Math.max(1,+val("#f-target")||50); }
      else { delete d.type; }
    }
    else if(m.type==="finance"){ d.type=seg("#f-ftype")||"expense"; d.amount=Math.max(0,+val("#f-amt")||0); d.category=seg("#f-cat")||(m.categories&&m.categories[0])||"其他"; d.date=val("#f-date"); }
    else if(m.type==="note"){ d.mood=seg("#f-mood")||d.mood||""; d.content=(val("#f-content")||"").trim(); d.date=val("#f-date"); }
    else if(m.type==="ielts"){
      d.status=seg("#f-status")||d.status||"☐ 未练习";
      d.done = (d.status === '✅ 已完成');
      if(m.key==="ielts_read"){
        d.section=seg("#f-section")||d.section; d.accuracy=val("#f-accuracy")!==''?Number(val("#f-accuracy")):null;
        d.difficulty=val("#f-difficulty")||3; d.frequency=seg("#f-frequency")||d.frequency;
        d.weakness=(val("#f-weakness")||"").trim(); d.tomorrowPlan=(val("#f-tomorrowPlan")||"").trim();
        d.note=(val("#f-note")||"").trim();
      } else if(m.key==="ielts_listening"){
        d.section=seg("#f-section")||d.section; d.accuracy=val("#f-accuracy")!==''?Number(val("#f-accuracy")):null;
        d.difficulty=seg("#f-difficulty")||d.difficulty; d.questionType=(val("#f-questionType")||"").trim();
        d.weakness=(val("#f-weakness")||"").trim(); d.tomorrowPlan=(val("#f-tomorrowPlan")||"").trim();
        d.note=(val("#f-note")||"").trim();
      } else if(m.key==="ielts_writing"){
        d.task=seg("#f-task")||d.task; d.estimatedScore=val("#f-estimatedScore")!==''?Number(val("#f-estimatedScore")):null;
        d.titleCn=(val("#f-titleCn")||"").trim(); d.source=(val("#f-source")||"").trim();
        d.correctionLink=(val("#f-correctionLink")||"").trim(); d.weakness=(val("#f-weakness")||"").trim();
        d.tomorrowPlan=(val("#f-tomorrowPlan")||"").trim(); d.note=(val("#f-note")||"").trim();
      } else if(m.key==="ielts_speaking"){
        d.part=seg("#f-part")||d.part; d.selfAssessment=seg("#f-selfAssessment")||d.selfAssessment;
        d.cueCard=(val("#f-cueCard")||"").trim(); d.topicCategory=(val("#f-topicCategory")||"").trim();
        d.weakness=(val("#f-weakness")||"").trim(); d.tomorrowPlan=(val("#f-tomorrowPlan")||"").trim();
        d.note=(val("#f-note")||"").trim();
      } else if(m.key==="ielts_record"){
        d.subject=seg("#f-subject")||d.subject; d.accuracy=val("#f-accuracy")!==''?Number(val("#f-accuracy")):null;
        d.estimatedScore=val("#f-estimatedScore")!==''?Number(val("#f-estimatedScore")):null;
        d.note=(val("#f-note")||"").trim(); d.weakness=(val("#f-weakness")||"").trim();
        d.tomorrowPlan=(val("#f-tomorrowPlan")||"").trim();
      }
    }
    // save custom fields
    (m.fields||[]).forEach(f=>{
      if(f.type==="select") d[f.key]=seg("#f-cf-"+f.key)||d[f.key]||"";
      else if(f.type==="number") d[f.key]=Math.max(0,+val("#f-cf-"+f.key)||0);
      else d[f.key]=(val("#f-cf-"+f.key)||"").trim();
    });
    // save image
    d.image=(val("#f-image")||"").trim();
    if(!editing) (data[key]=data[key]||[]).unshift(d);
    persist(); close();
  };
}

function newItem(m){ const base={id:Date.now()}; let item;
  if(m.type==="todo") item={...base,title:"",priority:(m.priorities&&m.priorities[1]?m.priorities[1].key:"P1"),done:false,note:""};
  else if(m.type==="checkin") item={...base,title:"",log:{}};
  else if(m.type==="word") item={...base,title:"",type:"word",target:50,log:{}};
  else if(m.type==="progress") item={...base,title:"",current:0,target:(m.unit==="页"?100:20),unit:m.unit||"",note:""};
  else if(m.type==="finance") item={...base,title:"",type:"expense",amount:"",category:(m.categories&&m.categories[0])||"其他",date:isoToday()};
  else if(m.type==="ielts"){ item={...base,title:"",status:"☐ 未练习",date:isoToday()};
    if(m.key==="ielts_read"){ item.section="P1"; item.accuracy=null; item.difficulty=3; item.frequency="中频"; }
    else if(m.key==="ielts_listening"){ item.section="S1"; item.accuracy=null; item.difficulty="中等"; }
    else if(m.key==="ielts_writing"){ item.task="Task 2"; item.estimatedScore=null; }
    else if(m.key==="ielts_speaking"){ item.part="Part 1"; item.selfAssessment="一般"; }
    else if(m.key==="ielts_record"){ item.subject="听力"; item.accuracy=null; item.estimatedScore=null; }
  }
  else item={...base,title:"",content:"",mood:(m.moods&&m.moods[0])||"",date:isoToday()};
  // initialize custom fields
  (m.fields||[]).forEach(f=>{ if(!(f.key in item)) item[f.key]= f.type==="select"?(f.options&&f.options[0]||""):""; });
  return item;
}

/* ---------- delete confirm ---------- */
function confirmDelete(key,id){ const item=(data[key]||[]).find(i=>i.id==id); if(!item) return;
  const overlay=document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML=`<div class="modal" style="width:400px"><h3>删除记录</h3><div class="sub">确定删除「${esc(item.title||'这条记录')}」？此操作不可撤销。</div>
    <div class="modal-actions"><div class="spacer"></div><button class="btn ghost" id="c-cancel">取消</button><button class="btn danger" id="c-ok">删除</button></div></div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.onclick=e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#c-cancel").onclick=close;
  overlay.querySelector("#c-ok").onclick=()=>{ data[key]=data[key].filter(i=>i.id!=id); persist(); close(); };
}

function buildNav(){
  $("#brandName").textContent=CONFIG.owner; $("#brandSlogan").textContent=CONFIG.slogan;
  const normalModules = CONFIG.modules.filter(m => m.type !== 'ielts');
  const ieltsModules = CONFIG.modules.filter(m => m.type === 'ielts');
  const html=[`<div class="navi" data-go="home">${icon("home",19)}首页</div>`,
    `<div class="navi" data-go="agents">${icon("sparkles",19)}AI Agent中心</div>`,
    `<div class="nav-sep">猫生日常</div>`]
    .concat(normalModules.map(m=>`<div class="navi" data-go="${m.key}">${icon(m.icon,19)}${m.name}</div>`))
    .concat([`<div class="nav-sep">IELTS 备考</div>`])
    .concat(ieltsModules.map(m=>`<div class="navi" data-go="${m.key}">${icon(m.icon,19)}${m.name.replace(/^[^\s]+\s/,'')}</div>`))
    .concat([`<div class="nav-sep">统计</div>`, `<div class="navi" data-go="insight">${icon("chart",19)}洞察复盘</div>`])
    .concat([`<div class="nav-sep">其他</div>`,
      `<div class="navi" id="navi-settings" title="云同步 / 数据管理">${icon("gear",19)} 设置</div>`]);
  $("#nav").innerHTML=html.join("");
  $("#nav").querySelectorAll("[data-go]").forEach(el=>el.onclick=()=>go(el.dataset.go));
  const naviSet = document.getElementById('navi-settings');
  if(naviSet) naviSet.onclick = () => CloudSync.openConfig();
  renderNavActive();
}
function renderNavActive(){ $("#nav").querySelectorAll(".navi").forEach(el=>el.classList.toggle("active", el.dataset.go===view)); }

$("#avaCam").innerHTML = icon("camera",18);

$("#avatarInput").onchange = e => {
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = () => { data.__avatar = reader.result; $("#avaImg").src = reader.result; store.save(); };

  e.target.value = "";
};

  // 执行规划（支持多模型LLM调用）
  async planGoal(goal){
    const loading = document.getElementById('aiLoading');
    const resultEl = document.getElementById('aiResult');
    if(loading) loading.classList.add('show');
    if(resultEl) resultEl.classList.remove('show');

    let items = [];
    const useRealLLM = this.config.provider !== 'mock' && 
                      (this.config.apiKey || this.config.provider === 'ollama');

    if(!useRealLLM){
      // 演示模式：使用Mock数据
      await new Promise(r => setTimeout(r, 1500));
      items = this.mockPlan(goal);
    } else {
      // 真实LLM调用
      try {
        showToast(`正在用${this.providers[this.config.provider].name}思考中...`, 'info');
        items = await this.callLLMPlan(goal);
        
        if(items.length === 0){
          console.warn('LLM没有返回工具调用，回退到Mock');
          showToast('AI没有返回任务，已切换到演示模式', 'warn');
          items = this.mockPlan(goal);
        } else {
          showToast(`AI为你规划了${items.length}个任务！`, 'success');
        }
      } catch(e){
        console.error('LLM调用失败:', e);
        showToast(`AI调用失败: ${e.message.slice(0,30)}，已切换到演示模式`, 'warn');
        items = this.mockPlan(goal);
      }
    }

    // 保存当前规划结果，用于确认导入
    this._pendingPlan = items;

    if(loading) loading.classList.remove('show');
    if(resultEl){
      resultEl.innerHTML = this.renderPlanResult(items);
      resultEl.classList.add('show');
      // 绑定按钮事件
      const acceptBtn = document.getElementById('aiAcceptBtn');
      const cancelBtn = document.getElementById('aiCancelBtn');
      if(acceptBtn) acceptBtn.onclick = () => this.applyPlan();
      if(cancelBtn) cancelBtn.onclick = () => { resultEl.classList.remove('show'); this._pendingPlan = null; };
    }
  },

  // 通用LLM调用（支持OpenAI兼容格式：DeepSeek/豆包/Qwen/Ollama）
  async callLLM(messages, options = {}){
    const provider = this.config.provider;
    const providerConfig = this.providers[provider];
    
    if(!providerConfig || provider === 'mock'){
      throw new Error('Mock mode');
    }

    if(!this.config.apiKey && provider !== 'ollama'){
      throw new Error('请先配置API Key');
    }

    const apiUrl = this.config.proxyUrl.replace(/\/$/, '') + providerConfig.path;
    const model = options.model || this.config.model || providerConfig.model;

    const body = {
      model: model,
      messages: messages,
      temperature: options.temperature || 0.7,
    };

    // Ollama格式略有不同
    if(provider === 'ollama'){
      body.stream = false;
      if(options.tools){
        body.tools = options.tools;
      }
    } else {
      // OpenAI兼容格式
      if(options.tools){
        body.tools = options.tools;
        body.tool_choice = options.tool_choice || "auto";
      }
    }

    const headers = { 'Content-Type': 'application/json' };
    if(this.config.apiKey && provider !== 'ollama'){
      headers['Authorization'] = `Bearer ${this.config.apiKey}`;
    }

    console.log(`调用LLM: ${provider} ${model}`, apiUrl);
    
    const response = await fetch(apiUrl, {
      method: 'POST',
      headers: headers,
      body: JSON.stringify(body)
    });

    if(!response.ok){
      const errText = await response.text();
      throw new Error(`API请求失败 (${response.status}): ${errText.slice(0, 200)}`);
    }

    const data = await response.json();
    
    // 统一解析返回格式（兼容OpenAI/Ollama）
    let message;
    if(provider === 'ollama'){
      message = data.message || {};
    } else {
      message = data.choices?.[0]?.message || {};
    }

    return message;
  },

  // 调用LLM进行任务规划
  async callLLMPlan(goal){
    const messages = [
      { role: "system", content: this.getPlannerSystemPrompt() },
      { role: "user", content: `帮我规划：${goal}` }
    ];

    const message = await this.callLLM(messages, {
      tools: this.getToolDefinitions(),
      temperature: 0.6
    });

    // 解析工具调用
    const items = [];
    const toolCalls = message.tool_calls || [];

    const typeMap = {
      'create_todo': 'todo',
      'create_checkin': 'checkin',
      'create_reading': 'read',
      'create_sport': 'sport'
    };

    for(const tc of toolCalls){
      try {
        const fn = tc.function || tc;
        const name = fn.name;
        const args = typeof fn.arguments === 'string' ? JSON.parse(fn.arguments) : (fn.arguments || {});
        const type = typeMap[name];
        
        if(type && args.title){
          items.push({
            type: type,
            title: args.title,
            priority: args.priority || 'P1',
            target: args.target,
            unit: args.unit,
            note: args.note || ''
          });
        }

  async callLLMChat(userMessage, history = []){
    // 获取工作台当前数据摘要，提供上下文
    const dataSummary = this.getDataSummary();
    
    const messages = [
      { 
        role: "system", 
        content: `你是喵喵编辑部的智能助手，熟悉用户的个人工作台数据。

当前工作台数据摘要：
${dataSummary}

回答要求：

- 如果需要创建任务，可以提示用户去首页用AI规划功能`
      },
      ...history,

    return message.content || "喵～我没听清，再说一遍？";

  // 获取工作台数据摘要
  getDataSummary(){
    const todos = data.todo || [];
    const checkins = data.checkin || [];
    const reads = data.read || [];
    const moneys = data.money || [];
    const ieltsItems = (data.ielts_read || []).concat(data.ielts_listen || [], data.ielts_writing || [], data.ielts_speaking || []);
    
    const todoDone = todos.filter(t=>t.done).length;
    const todoPct = todos.length ? Math.round(todoDone/todos.length*100) : 0;
    
    return `- 待办：共${todos.length}个，完成${todoDone}个，完成率${todoPct}%
- 打卡：${checkins.length}个习惯
- 阅读：${reads.length}本书
- 记账：${moneys.length}条记录
- 雅思错题：${ieltsItems.length}道`;
  },

  // 一键导入计划到工作台
  applyPlan(){
    if(!this._pendingPlan) return;
    let added = {todo:0, checkin:0, read:0, sport:0};
    this._pendingPlan.forEach(item => {
      const moduleKey = item.type;
      if(!data[moduleKey]) data[moduleKey] = [];
      const newItem = {
        id: Date.now() + Math.floor(Math.random()*1000),
        title: item.title,
        note: item.note || '',
      };
      if(item.type === 'todo'){
        newItem.priority = item.priority || 'P1';
        newItem.done = false;
      } else if(item.type === 'checkin'){
        newItem.target = item.target || 7;
        newItem.log = {};
      } else if(item.type === 'read' || item.type === 'sport'){
        newItem.current = 0;
        newItem.target = item.target || 100;
        newItem.unit = item.unit || (item.type === 'read' ? '页' : '分钟');
      }
      data[moduleKey].push(newItem);
      added[moduleKey] = (added[moduleKey]||0) + 1;
    });
    persist();
    showToast(`✅ 已导入：待办${added.todo}个 · 打卡${added.checkin}个 · 阅读${added.read}个 · 运动${added.sport}个`);
    const resultEl = document.getElementById('aiResult');
    if(resultEl) resultEl.classList.remove('show');
    const input = document.getElementById('aiGoalInput');
    if(input) input.value = '';
    this._pendingPlan = null;
  },

function exportData(){
  const payload = {
    app: CONFIG.storageKey,
    version: 1,
    exportedAt: new Date().toISOString(),
    data: JSON.parse(JSON.stringify(data))
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const ts = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `cat-news-workbench-backup-${ts}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast('数据已导出 ✓');
}

function importData(file){
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const parsed = JSON.parse(e.target.result);
      if(!parsed.data || typeof parsed.data !== 'object'){
        showToast('文件格式不正确', 'error');
        return;
      }
      const preview = Object.entries(parsed.data)
        .filter(([k,v]) => Array.isArray(v) && v.length)
        .map(([k,v]) => `${modOf(k)?.name || k}: ${v.length} 条`)
        .join('，');
      const overlay = document.createElement('div');
      overlay.className = 'overlay';
      overlay.innerHTML = `<div class="modal" style="width:420px">
        <h3>导入数据</h3>
        <div class="sub">检测到以下数据：<br><strong style="color:var(--text)">${preview || '无记录'}</strong><br><br>导入后将覆盖当前所有数据，此操作不可撤销。</div>
        <div class="modal-actions"><div class="spacer"></div>
          <button class="btn ghost" id="imp-cancel">取消</button>
          <button class="btn danger" id="imp-ok">确认导入</button></div></div>`;
      document.body.appendChild(overlay);
      const close = () => overlay.remove();
      overlay.onclick = e => { if(e.target === overlay) close(); };
      overlay.querySelector('#imp-cancel').onclick = close;
      overlay.querySelector('#imp-ok').onclick = () => {
        data = parsed.data;
        store.save();
        render();
        close();
        showToast('数据已导入 ✓');
      };
    } catch(err) {
      showToast('解析文件失败：' + err.message, 'error');
    }
  };
  reader.readAsText(file);
}

/* ============================================================
   CLOUD SYNC — Supabase 云端同步模块
   使用前需要在 Supabase 创建数据库表，详见 schema.sql
   ============================================================ */
const CloudSync = {
  supabase: null,
  config: null,
  syncing: false,
  connected: false,
  lastError: null,

  normalizeUrl(url){
    if(!url) return '';
    let u = url.trim();
    // 移除常见的错误后缀
    u = u.replace(/\/(rest|auth|storage|realtime)\/*.*$/i, '');
    u = u.replace(/\/functions\/.*$/i, '');
    // 移除尾部斜杠
    u = u.replace(/\/+$/, '');
    return u;
  },

  init(){
    const saved = localStorage.getItem('cat-news-supabase-config');
    if(saved){
      try {
        this.config = JSON.parse(saved);
        if(this.config?.url){
          const norm = this.normalizeUrl(this.config.url);
          if(norm !== this.config.url){
            this.config.url = norm;
            localStorage.setItem('cat-news-supabase-config', JSON.stringify(this.config));
          }
        }
        if(this.config.url && this.config.key){
          this.connect();
        }
      } catch(e){}
    }
    this.updateUI();
    this.bindEvents();
  },

  connect(){
    if(!window.supabase || !this.config?.url || !this.config?.key){
      this.connected = false;
      this.updateUI();
      return;
    }
    try {
      this.supabase = window.supabase.createClient(this.config.url, this.config.key);
      this.testConnection();
    } catch(e) {
      console.error('Supabase init failed:', e);
      this.connected = false;
      this.lastError = e.message;
      this.updateUI();
    }
  },

  async testConnection(){
    if(!this.supabase){
      this.connected = false;
      this.updateUI();
      return { ok:false, msg:'客户端未初始化' };
    }
    try {
      const start = Date.now();
      const { data, error, count } = await this.supabase
        .from('workbench_data')
        .select('id', { count:'exact', head:true })
        .limit(1);
      const latency = Date.now() - start;
      if(error){
        this.connected = false;
        this.lastError = error.message;
        this.updateUI();
        return { ok:false, msg:'查询失败: ' + error.message, latency };
      }
      this.connected = true;
      this.lastError = null;
      this.updateUI();
      return { ok:true, msg:`连接成功 · 延迟 ${latency}ms`, latency, count: count ?? 0 };
    } catch(e) {
      this.connected = false;
      this.lastError = e.message;
      this.updateUI();
      return { ok:false, msg:'网络错误: ' + e.message };
    }
  },

  updateUI(){
    const bar = document.getElementById('cloudBar');
    const actionRow = document.getElementById('cbActions');
    const logo = document.getElementById('cbLogo');
    const dot = document.getElementById('cbDot');
    const text = document.getElementById('cbStatusText');

    if(!this.config?.url || !this.config?.key){
      dot.className = 'cb-dot';
      text.textContent = '未配置';
      actionRow.style.display = 'none';
      logo.textContent = '前往「其他 → 设置」开启云同步';
      logo.style.display = 'block';
      return;
    }

    const autoSync = this.config.autoSync;
    actionRow.style.display = 'flex';

    if(this.connected){
      dot.className = 'cb-dot online';
      text.textContent = '已连接 · ' + (this.config.user || '默认设备');
    } else if(this.lastError){
      dot.className = 'cb-dot';
      text.textContent = '连接失败: ' + this.lastError.slice(0, 30);
    } else {
      dot.className = 'cb-dot';
      text.textContent = '正在检测...';
    }

    if(autoSync){
      logo.textContent = '✓ 自动同步已开启 · 每次保存自动推送';
    } else {
      logo.textContent = '⚪ 自动同步未开启 · 请手动同步';
    }
    logo.style.display = 'block';
  },

  async syncNow(){
    return this.push();
  },

  async push(){
    if(!this.supabase){ showToast('请先配置云同步', 'warn'); return; }
    if(!this.connected){ showToast('数据库未连接，请先在设置中测试连接', 'warn'); return; }

    try {

/* ============================================================
   NOTION SYNC — Notion 数据库同步模块
   通过代理服务器转发请求（绕过浏览器 CORS 限制）
   ============================================================ */
const NOTION_DIRECT_API = 'https://api.notion.com/v1';
const NOTION_VERSION = '2022-06-28';

let _notionProxyUrl = null;

function notionBaseUrl(){
  if(_notionProxyUrl){
    const proxyBase = _notionProxyUrl.replace(/\/$/, '');
    // 如果代理是同源的（页面本身就是代理服务器提供的），使用相对路径
    if(proxyBase === '/notion'){
      return '/notion';
    }
    // 如果代理 URL 的 origin 与页面相同，也使用相对路径
    try {
      const u = new URL(proxyBase, window.location.origin);
      const pageUrl = new URL(window.location.href);
      // 本地代理（localhost/127.0.0.1）特殊处理：只要 pathname 是 /notion，就使用相对路径
      const isLocalProxy = ['localhost', '127.0.0.1'].includes(u.hostname);
      const sameOrigin = (u.origin === window.location.origin) ||
        (isLocalProxy && u.pathname === '/notion');
      if(sameOrigin){
        return '/notion';
      }
    } catch(e) {}
    return proxyBase;
  }
  return NOTION_DIRECT_API;
}

// 检测当前是否在远程部署环境（如 GitHub Pages）
function isRemoteDeployment(){
  const host = window.location.hostname;
  return host.endsWith('.github.io') || host.endsWith('.pages.dev') || host === 'localhost' || host === '127.0.0.1';
}

// 预检代理端点是否可达
async function checkProxyAvailable(timeoutMs = 5000){
  if(!_notionProxyUrl) return { ok: true, mode: 'direct' };
  const proxyUrl = _notionProxyUrl;
  const isLocalPath = proxyUrl === '/notion' || proxyUrl === 'http://localhost:8081/notion';
  const remoteEnv = isRemoteDeployment();
  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    const res = await fetch(notionUrl('/users/me'), {
      method: 'GET',
      headers: { 'Authorization': 'Bearer __probe__', 'Notion-Version': '2022-06-28' },
      signal: controller.signal,
    });
    clearTimeout(timer);
    // 404: 代理端点不存在
    if(res.status === 404){
      return { ok: false, mode: 'proxy', diagnosis: getProxyDiagnosis(proxyUrl, remoteEnv, 'not_found') };
    }
    // 401/403: 代理可达，只是 API Key 无效
    if(res.status === 401 || res.status === 403){
      return { ok: true, mode: 'proxy', status: res.status };
    }
    // 2xx/3xx: 代理正常工作
    return { ok: true, mode: 'proxy', status: res.status };
  } catch(e) {
    return { ok: false, mode: 'proxy', diagnosis: getProxyDiagnosis(proxyUrl, remoteEnv, e.message), error: e.message };
  }
}

function getProxyDiagnosis(proxyUrl, remoteEnv, reason){
  const isLocalPath = proxyUrl === '/notion' || proxyUrl === 'http://localhost:8081/notion';
  if(reason === 'not_found'){
    if(isLocalPath && remoteEnv){
      return '当前在远程服务器上访问，代理地址是本地路径 /notion。请填写 Cloudflare Worker 的完整 URL（如 https://your-worker.workers.dev/notion）';
    }
    if(isLocalPath){
      return '代理端点 /notion 不存在。请确认 python3 notion-proxy.py 已启动且端口正确';
    }
    return `代理服务器 ${proxyUrl} 的 /notion 端点不存在。请检查代理服务配置`;
  }
  if(isLocalPath && remoteEnv){
    return '当前在远程服务器上访问，代理地址是本地路径 /notion。请填写 Cloudflare Worker 的完整 URL（如 https://your-worker.workers.dev/notion），或在本地运行 python3 notion-proxy.py';
  }
  if(proxyUrl.includes('localhost') || proxyUrl.includes('127.0.0.1')){
    return '本地代理服务器未启动。请运行: python3 notion-proxy.py';
  }
  return `代理服务器 ${proxyUrl} 不可达。请检查代理服务是否正常运行。`;
}

function notionUrl(path){
  return notionBaseUrl() + path;
}

function notionHeaders(apiKey){
  return {
    'Authorization': `Bearer ${apiKey}`,
    'Notion-Version': NOTION_VERSION,
    'Content-Type': 'application/json',
  };
}

function isProxyMode(){
  return !!_notionProxyUrl;
}

/* 智能自动映射 Notion 字段到工作台字段 */
function autoMapField(propName, propType, moduleKey){
  const rules = [
    // IELTS 模块特定规则（优先级高，先匹配）
    { kw: ['accuracy','正确率','正确'], val: 'accuracyField', modules: ['ielts'] },
    { kw: ['difficulty','难度'], val: 'difficultyField', modules: ['ielts'] },
    { kw: ['frequency','频次','频率'], val: 'frequencyField', modules: ['ielts'] },
    { kw: ['weakness','薄弱','问题','不足'], val: 'weaknessField', modules: ['ielts'] },
    { kw: ['tomorrow','明日','计划','plan'], val: 'tomorrowPlanField', modules: ['ielts'] },
    { kw: ['question','题型'], val: 'questionTypeField', modules: ['ielts'] },
    { kw: ['source','来源'], val: 'sourceField', modules: ['ielts'] },

    // IELTS 阅读
    { kw: ['section','部分','passage','段'], val: 'sectionField', modules: ['ielts_read'] },
    { kw: ['p1','p2','p3'], val: 'sectionField', modules: ['ielts_read'] },

    // IELTS 听力
    { kw: ['section','部分'], val: 'listeningSectionField', modules: ['ielts_listening'] },
    { kw: ['s1','s2','s3','s4'], val: 'listeningSectionField', modules: ['ielts_listening'] },

    // IELTS 写作
    { kw: ['task','任务'], val: 'taskField', modules: ['ielts_writing'] },
    { kw: ['score','分数','estimated','预估'], val: 'estimatedScoreField', modules: ['ielts_writing','ielts_record'] },
    { kw: ['cn','中文','题目中'], val: 'titleCnField', modules: ['ielts_writing','ielts_listening'] },
    { kw: ['correction','批改','report'], val: 'correctionLinkField', modules: ['ielts_writing'] },

    // IELTS 口语
    { kw: ['part','部分'], val: 'partField', modules: ['ielts_speaking'] },
    { kw: ['cue','卡片','card'], val: 'cueCardField', modules: ['ielts_speaking'] },
    { kw: ['self','自我','assessment','评估'], val: 'selfAssessmentField', modules: ['ielts_speaking'] },
    { kw: ['topic','话题'], val: 'topicCategoryField', modules: ['ielts_speaking'] },

    // IELTS 备考记录
    { kw: ['subject','学科','科目'], val: 'subjectField', modules: ['ielts_record'] },

    // 通用映射（所有模块，优先级低）
    { kw: ['title','标题','name','名称'], val: 'title', modules: null },
    { kw: ['content','内容','note','备注','笔记','description','描述'], val: 'content', modules: null },
    { kw: ['date','日期','created','创建','deadline','截止'], val: 'date', modules: null },
    { kw: ['tag','标签','category','分类'], val: 'tags', modules: null },
    { kw: ['status','状态','完成'], val: 'statusField', modules: null },
    { kw: ['done','完成','completed'], val: 'done', modules: null },
    { kw: ['priority','优先级'], val: 'priorityField', modules: null },
    { kw: ['type','类型'], val: 'typeField', modules: null },
    { kw: ['count','次数','times','次数','word','单词'], val: 'timesField', modules: null },
    { kw: ['amount','金额','cost','花费'], val: 'amountField', modules: null },
    { kw: ['current','当前','progress','进度'], val: 'currentField', modules: null },
    { kw: ['target','目标','goal'], val: 'targetField', modules: null },
    { kw: ['unit','单位'], val: 'unitField', modules: null },
    { kw: ['mood','心情'], val: 'moodField', modules: null },
    { kw: ['color','颜色'], val: 'color', modules: null },
    { kw: ['section','部分','passage','段'], val: 'sectionField', modules: null },
    { kw: ['frequency','频次','频率'], val: 'frequencyField', modules: null },
    { kw: ['source','来源'], val: 'sourceField', modules: null },
    { kw: ['question','题型','type'], val: 'questionTypeField', modules: null },
  ];

  // 优先级：模块特定 > 通用（规则已按优先级排序）
  for(const r of rules){
    const kwMatch = r.kw.some(k => propName.toLowerCase().includes(k.toLowerCase()));
    if(!kwMatch) continue;
    if(r.modules){
      // 规则指定了模块，检查当前模块是否匹配
      const moduleMatch = r.modules.some(m => moduleKey.includes(m));
      if(!moduleMatch) continue;
    }
    return r.val;
  }

  // 基于 Notion 属性类型的兜底映射
  const typeMap = {
    'title': 'title',
    'rich_text': propName.includes('note') || propName.includes('备注') ? 'content' : null,
    'date': 'date',
    'checkbox': propName.includes('status') || propName.includes('完成') ? 'done' : null,
    'number': propName.includes('score') || propName.includes('分数') ? 'estimatedScoreField' :
              propName.includes('accuracy') || propName.includes('正确') ? 'accuracyField' :
              propName.includes('count') || propName.includes('次数') || propName.includes('word') || propName.includes('单词') ? 'timesField' :
              propName.includes('frequency') || propName.includes('频次') || propName.includes('频率') ? 'frequencyField' : null,
    'select': propName.includes('section') || propName.includes('部分') ? 'sectionField' :
              propName.includes('task') ? 'taskField' :
              propName.includes('part') ? 'partField' :
              propName.includes('frequency') || propName.includes('频次') || propName.includes('频率') ? 'frequencyField' : null,
    'multi_select': 'tags',
  };
  return typeMap[propType] || null;
}

function extractNotionProperties(page){
  const props = {};
  if(!page.properties) return props;
  for (const [key, prop] of Object.entries(page.properties)){
    const p = prop;
    switch(p.type){
      case 'title': props[key] = p.title?.[0]?.plain_text || ''; break;
      case 'rich_text': props[key] = p.rich_text?.map(t => t.plain_text).join('') || ''; break;
      case 'select': props[key] = p.select?.name || ''; break;
      case 'multi_select': props[key] = p.multi_select?.map(s => s.name) || []; break;
      case 'date': props[key] = p.date?.start || ''; break;
      case 'checkbox': props[key] = p.checkbox || false; break;
      case 'number': props[key] = p.number || 0; break;
      case 'url': props[key] = p.url || ''; break;
      case 'created_time': props[key] = p.created_time || ''; break;
      case 'last_edited_time': props[key] = p.last_edited_time || ''; break;
      case 'status': props[key] = p.status?.name || ''; break;
      default: props[key] = p[p.type] || '';
    }
  }
  return props;
}

function mapToWorkbenchItem(page, moduleKey, mappings){
  const props = extractNotionProperties(page);
  const mapping = mappings || {};
  const result = { id: page.id, _notionId: page.id };

  // 存储所有 Notion 属性（包括未映射的）
  result._rawProps = props;

  // 标题
  if(mapping.titleField && props[mapping.titleField]){
    result.title = props[mapping.titleField];
  } else {
    const titleKey = Object.entries(page.properties || {})
      .find(([_, p]) => p.type === 'title')?.[0];
    result.title = titleKey ? props[titleKey] : page.id;
  }

  // 内容/备注
  if(mapping.contentField && props[mapping.contentField]){
    if(moduleKey === 'note' || moduleKey === 'hot'){
      result.content = props[mapping.contentField];
    } else {
      result.note = props[mapping.contentField];
    }
  }

  // 状态（多状态支持）
  if(mapping.statusField && props[mapping.statusField] !== undefined){
    const v = props[mapping.statusField];
    if(typeof v === 'boolean'){
      result.status = v ? '✅ 已完成' : '☐ 未练习';
      result.done = v;
    } else if(typeof v === 'string'){
      result.status = v;
      result.done = ['done','completed','已完成','✅ 已完成'].includes(v.toLowerCase());
    }
  }

  // 优先级
  if(mapping.priorityField && props[mapping.priorityField]){
    result.priority = String(props[mapping.priorityField]).toUpperCase();
  }

  // 类型
  if(mapping.typeField && props[mapping.typeField]) result.type = props[mapping.typeField];

  // 分类
  if(mapping.categoryField && props[mapping.categoryField]) result.category = props[mapping.categoryField];

  // 单位
  if(mapping.unitField && props[mapping.unitField]) result.unit = props[mapping.unitField];

  // 心情
  if(mapping.moodField && props[mapping.moodField]) result.mood = props[mapping.moodField];

  // 日期
  if(mapping.dateField && props[mapping.dateField]){
    result.date = props[mapping.dateField];
  } else {
    result.date = new Date().toISOString().slice(0, 10);
  }

  // 数字
  if(mapping.amountField && props[mapping.amountField] !== undefined) result.amount = props[mapping.amountField];
  if(mapping.currentField && props[mapping.currentField] !== undefined) result.current = props[mapping.currentField];
  if(mapping.targetField && props[mapping.targetField] !== undefined) result.target = props[mapping.targetField];

  // 标签
  if(mapping.tagField && props[mapping.tagField]){
    const tags = props[mapping.tagField];
    result.tags = Array.isArray(tags) ? tags : [tags];
  }

  // 练习次数
  if(mapping.timesField && props[mapping.timesField] !== undefined) result.times = props[mapping.timesField];

  // IELTS 专用字段
  if(mapping.sectionField && props[mapping.sectionField])
    result.section = props[mapping.sectionField];
  if(mapping.listeningSectionField && props[mapping.listeningSectionField])
    result.section = props[mapping.listeningSectionField];
  if(mapping.accuracyField && props[mapping.accuracyField] != null)
    result.accuracy = Number(props[mapping.accuracyField]);
  if(mapping.difficultyField && props[mapping.difficultyField] != null)
    result.difficulty = props[mapping.difficultyField];
  if(mapping.frequencyField && props[mapping.frequencyField])
    result.frequency = props[mapping.frequencyField];
  if(mapping.partField && props[mapping.partField])
    result.part = props[mapping.partField];
  if(mapping.taskField && props[mapping.taskField])
    result.task = props[mapping.taskField];
  if(mapping.questionTypeField && props[mapping.questionTypeField])
    result.questionType = props[mapping.questionTypeField];
  if(mapping.selfAssessmentField && props[mapping.selfAssessmentField])
    result.selfAssessment = props[mapping.selfAssessmentField];
  if(mapping.estimatedScoreField && props[mapping.estimatedScoreField] != null)
    result.estimatedScore = Number(props[mapping.estimatedScoreField]);
  if(mapping.sourceField && props[mapping.sourceField])
    result.source = props[mapping.sourceField];
  if(mapping.weaknessField && props[mapping.weaknessField])
    result.weakness = props[mapping.weaknessField];
  if(mapping.tomorrowPlanField && props[mapping.tomorrowPlanField])
    result.tomorrowPlan = props[mapping.tomorrowPlanField];
  if(mapping.cueCardField && props[mapping.cueCardField])
    result.cueCard = props[mapping.cueCardField];
  if(mapping.titleCnField && props[mapping.titleCnField])
    result.titleCn = props[mapping.titleCnField];
  if(mapping.titleEnField && props[mapping.titleEnField])
    result.titleEn = props[mapping.titleEnField];
  if(mapping.correctionLinkField && props[mapping.correctionLinkField])
    result.correctionLink = props[mapping.correctionLinkField];
  if(mapping.topicCategoryField && props[mapping.topicCategoryField])
    result.topicCategory = props[mapping.topicCategoryField];
  if(mapping.subjectField && props[mapping.subjectField])
    result.subject = props[mapping.subjectField];

  return result;
}

function mapToNotionProperties(item, moduleKey, mappings, schema){
  const mapping = mappings || {};
  const properties = {};

  if(mapping.titleField){
    properties[mapping.titleField] = {
      title: [{ type: 'text', text: { content: item.title || '未命名' } }]
    };
  }

  if(mapping.contentField){
    const content = item.note || item.content;
    if(content){
      properties[mapping.contentField] = {
        rich_text: [{ type: 'text', text: { content } }]
      };
    }
  }

  if(mapping.statusField){
    const propSchema = schema?.[mapping.statusField];
    const statusVal = item.status || (item.done ? '✅ 已完成' : '☐ 未练习');
    if(propSchema?.type === 'checkbox'){
      properties[mapping.statusField] = { checkbox: item.done || (statusVal === '✅ 已完成') };
    } else if(propSchema?.type === 'status'){
      properties[mapping.statusField] = { status: { name: statusVal } };
    } else if(propSchema?.type === 'select'){
      properties[mapping.statusField] = { select: { name: statusVal } };
    }
  }

  if(mapping.typeField && item.type){
    properties[mapping.typeField] = { select: { name: item.type } };
  }

  if(mapping.categoryField && item.category){
    properties[mapping.categoryField] = { select: { name: item.category } };
  }

  if(mapping.priorityField && item.priority){
    properties[mapping.priorityField] = { select: { name: item.priority } };
  }

  if(mapping.dateField){
    properties[mapping.dateField] = { date: item.date ? { start: item.date } : null };
  }

  if(mapping.amountField && item.amount !== undefined && item.amount !== null){
    properties[mapping.amountField] = { number: item.amount };
  }
  if(mapping.currentField && item.current !== undefined && item.current !== null){
    properties[mapping.currentField] = { number: Number(item.current) };
  }
  if(mapping.targetField && item.target !== undefined && item.target !== null){
    properties[mapping.targetField] = { number: Number(item.target) };
  }
  if(mapping.timesField && item.times !== undefined && item.times !== null){
    properties[mapping.timesField] = { number: Number(item.times) };
  }

  if(mapping.moodField && item.mood){
    properties[mapping.moodField] = { select: { name: item.mood } };
  }

  if(mapping.tagField && item.tags && item.tags.length){
    properties[mapping.tagField] = {
      multi_select: item.tags.map(t => ({ name: t }))
    };
  }

  if(mapping.unitField && item.unit){
    properties[mapping.unitField] = {
      rich_text: [{ type: 'text', text: { content: item.unit } }]
    };
  }

  // IELTS 专用字段推送
  if(mapping.sectionField && item.section)
    properties[mapping.sectionField] = { select: { name: item.section } };
  if(mapping.listeningSectionField && item.section)
    properties[mapping.listeningSectionField] = { select: { name: item.section } };
  if(mapping.accuracyField && item.accuracy != null)
    properties[mapping.accuracyField] = { number: Number(item.accuracy) };
  if(mapping.difficultyField && item.difficulty != null) {
    const propSchema = schema?.[mapping.difficultyField];
    if(propSchema?.type === 'number')
      properties[mapping.difficultyField] = { number: Number(item.difficulty) };
    else
      properties[mapping.difficultyField] = { rich_text: [{ text: { content: String(item.difficulty) } }] };
  }
  if(mapping.frequencyField && item.frequency)
    properties[mapping.frequencyField] = { select: { name: item.frequency } };
  if(mapping.partField && item.part)
    properties[mapping.partField] = { select: { name: item.part } };
  if(mapping.taskField && item.task)
    properties[mapping.taskField] = { select: { name: item.task } };
  if(mapping.questionTypeField && item.questionType)
    properties[mapping.questionTypeField] = { rich_text: [{ text: { content: item.questionType } }] };
  if(mapping.selfAssessmentField && item.selfAssessment)
    properties[mapping.selfAssessmentField] = { select: { name: item.selfAssessment } };
  if(mapping.estimatedScoreField && item.estimatedScore != null)
    properties[mapping.estimatedScoreField] = { number: Number(item.estimatedScore) };
  if(mapping.sourceField && item.source)
    properties[mapping.sourceField] = { rich_text: [{ text: { content: item.source } }] };
  if(mapping.weaknessField && item.weakness)
    properties[mapping.weaknessField] = { rich_text: [{ text: { content: item.weakness } }] };
  if(mapping.tomorrowPlanField && item.tomorrowPlan)
    properties[mapping.tomorrowPlanField] = { rich_text: [{ text: { content: item.tomorrowPlan } }] };
  if(mapping.cueCardField && item.cueCard)
    properties[mapping.cueCardField] = { rich_text: [{ text: { content: item.cueCard } }] };
  if(mapping.titleCnField && item.titleCn)
    properties[mapping.titleCnField] = { rich_text: [{ text: { content: item.titleCn } }] };
  if(mapping.titleEnField && item.titleEn)
    properties[mapping.titleEnField] = { rich_text: [{ text: { content: item.titleEn } }] };
  if(mapping.correctionLinkField && item.correctionLink)
    properties[mapping.correctionLinkField] = { url: item.correctionLink };
  if(mapping.topicCategoryField && item.topicCategory)
    properties[mapping.topicCategoryField] = { rich_text: [{ text: { content: item.topicCategory } }] };
  if(mapping.subjectField && item.subject)
    properties[mapping.subjectField] = { select: { name: item.subject } };

  return properties;
}

const NotionSync = {
  config: null,
  connected: false,
  syncing: false,
  activeModule: null,

  init(){
    const saved = localStorage.getItem('cat-news-notion-config');
    if(saved){
      try {
        this.config = JSON.parse(saved);
        if(this.config?.proxyUrl){
          _notionProxyUrl = this.config.proxyUrl;
        }
        if(this.config?.apiKey){
          this.testConnection(true);
        }
      } catch(e){}
    }
    this.updateUI();
    this.bindEvents();
  },

  bindEvents(){
    const btnCfg = document.getElementById('btn-notion-cfg');
    const btnPull = document.getElementById('btn-notion-pull');
    const btnPush = document.getElementById('btn-notion-push');
    if(btnCfg) btnCfg.onclick = () => this.openConfig();
    if(btnPull) btnPull.onclick = () => this.pull();
    if(btnPush) btnPush.onclick = () => this.push();
  },

  updateUI(){
    const status = document.getElementById('nbStatus');
    const modules = document.getElementById('nbModules');
    const actions = document.getElementById('nbActions');
    const last = document.getElementById('nbLast');
    if(!status) return;

    if(!this.config?.apiKey){
      status.textContent = '未配置 · 点击齿轮图标';
      status.className = 'nb-status';
      if(modules) modules.style.display = 'none';
      if(actions) actions.style.display = 'none';
      if(last) last.textContent = '';
      return;
    }

    status.textContent = this.connected ? '已连接 · API Key 有效' : '正在检测连接...';
    status.className = 'nb-status' + (this.connected ? ' connected' : '');

    const mappings = this.config.mappings || {};
    const mappedModules = Object.keys(mappings).filter(k => mappings[k]?.databaseId);
    if(modules && mappedModules.length > 0){
      modules.style.display = 'flex';
      modules.innerHTML = mappedModules.map(k => {
        const mod = CONFIG.modules.find(m => m.key === k);
        const active = this.activeModule === k;
        return `<div class="nb-module${active ? ' active' : ''}" data-module="${k}">${mod?.name || k}</div>`;
      }).join('');
      modules.querySelectorAll('.nb-module').forEach(el => {
        el.onclick = () => { this.activeModule = el.dataset.module; this.updateUI(); };
      });
      this.activeModule = this.activeModule || mappedModules[0];
      modules.querySelectorAll('.nb-module').forEach(el => {
        if(el.dataset.module === this.activeModule) el.classList.add('active');
      });
    } else if(modules){
      modules.style.display = 'none';
    }

    if(actions){
      actions.style.display = mappedModules.length > 0 ? 'flex' : 'none';
    }
    if(last){
      if(this.lastSync){
        last.textContent = `上次同步: ${this.lastSync}`;
        last.className = 'nb-last ' + (this.lastSyncOk ? 'success' : 'error');
      } else {
        last.textContent = '';
      }
    }
  },

  async testConnection(silent){
    if(!this.config?.apiKey) return false;
    // 预检代理可用性
    const proxyCheck = await checkProxyAvailable();
    if(!proxyCheck.ok){
      this.connected = false;
      const msg = proxyCheck.diagnosis || '代理服务器不可达';
      if(!silent) showToast('Notion 连接失败: ' + msg, 'error');
      this.updateUI();
      return false;
    }
    try {
      const probeRes = await fetch(notionUrl('/users/me'), {
        method: 'GET',
        headers: notionHeaders(this.config.apiKey),
      });
      if(!probeRes.ok){
        const text = await probeRes.text();
        if(probeRes.status === 401 || probeRes.status === 403){
          throw new Error(`API Key 无效 (HTTP ${probeRes.status})`);
        } else if(probeRes.status === 404){
          throw new Error(`端点不存在 (HTTP 404)`);
        } else {
          throw new Error(`HTTP ${probeRes.status}: ${text.slice(0, 100)}`);
        }
      }
      const result = await probeRes.json();
      this.connected = true;
      if(!silent) showToast(`Notion 连接成功 ✓ (${result.name || result.bot_name || 'Bot'})`);
    } catch(e) {
      this.connected = false;
      let msg = e.message;
      if(e.message === 'Failed to fetch'){
        if(isProxyMode()){
          const proxyCheck2 = await checkProxyAvailable();
          msg = proxyCheck2.diagnosis || '代理服务器无响应，请检查代理配置';
        } else {
          msg = '网络无法连接到 api.notion.com。建议使用代理模式（在设置中填写代理服务器地址）';
        }
      }
      if(!silent) showToast('Notion 连接失败: ' + msg, 'error');
    }
    this.updateUI();
    return this.connected;
  },

  async getDatabaseSchema(databaseId){
    if(!this.config?.apiKey || !databaseId) return null;
    try {
      const res = await fetch(notionUrl(`/databases/${databaseId}`), {
        headers: notionHeaders(this.config.apiKey),
      });
      if(!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      return data.properties || {};
    } catch(e) { return null; }
  },

  async queryDatabase(databaseId){
    const results = [];
    let cursor = null;
    do {
      const body = { page_size: 100 };
      if(cursor) body.start_cursor = cursor;
      const res = await fetch(notionUrl(`/databases/${databaseId}/query`), {
        method: 'POST',
        headers: notionHeaders(this.config.apiKey),
        body: JSON.stringify(body),
      });
      if(!res.ok) throw new Error(`查询失败: HTTP ${res.status}`);
      const data = await res.json();
      results.push(...data.results);
      cursor = data.has_more ? data.next_cursor : null;
    } while(cursor);
    return results;
  },

  async createPage(databaseId, properties){
    const res = await fetch(notionUrl('/pages'), {
      method: 'POST',
      headers: notionHeaders(this.config.apiKey),
      body: JSON.stringify({ parent: { database_id: databaseId }, properties }),
    });
    if(!res.ok) throw new Error(`创建失败: HTTP ${res.status}`);
    return res.json();
  },

  async updatePage(pageId, properties){
    const res = await fetch(notionUrl(`/pages/${pageId}`), {
      method: 'PATCH',
      headers: notionHeaders(this.config.apiKey),
      body: JSON.stringify({ properties }),
    });
    if(!res.ok) throw new Error(`更新失败: HTTP ${res.status}`);
    return res.json();
  },

  async pull(){
    if(!this.activeModule){ showToast('请先配置 Notion 映射', 'warn'); return; }
    const mapping = this.config?.mappings?.[this.activeModule];
    if(!mapping?.databaseId){ showToast('未配置数据库 ID', 'warn'); return; }

    this.syncing = true;
    this.updateUI();
    try {
      // 自动获取 Schema 并智能映射字段（补全未映射的字段）
      const schema = await this.getDatabaseSchema(mapping.databaseId);
      if(schema){
        const existingFields = mapping.fields || {};
        const autoFields = {};
        let newCount = 0;
        for(const [propName, propDef] of Object.entries(schema)){
          // 只自动映射尚未配置的字段
          if(existingFields[propName]){
            autoFields[propName] = existingFields[propName];
            continue;
          }
          const mapped = autoMapField(propName, propDef.type, this.activeModule);
          if(mapped){
            autoFields[propName] = mapped;
            newCount++;
          }
        }
        mapping.fields = autoFields;
        // 保存配置
        this.config.mappings[this.activeModule] = mapping;
        localStorage.setItem('cat-news-notion-config', JSON.stringify(this.config));
        if(newCount > 0){
          showToast(`✨ 自动映射 ${newCount} 个新字段`);
        }
      }

      const pages = await this.queryDatabase(mapping.databaseId);
      const items = pages.map(p => mapToWorkbenchItem(p, this.activeModule, mapping.fields));

      const moduleData = data[this.activeModule] || [];
      const notExisting = items.filter(item => !moduleData.find(x => x._notionId === item._notionId));

      let imported = 0;
      if(this.config.pullMode === 'merge'){
        notExisting.forEach(item => {
          item.id = item.id || Date.now() + Math.floor(Math.random() * 1000);
          moduleData.push(item);
          imported++;
        });
      } else {
        items.forEach(item => {
          if(!item.id) item.id = Date.now() + Math.floor(Math.random() * 1000);
        });
        data[this.activeModule] = items;
        imported = items.length;
      }

      store.save();
      render();
      this.lastSync = new Date().toLocaleString('zh-CN', { hour12: false });
      this.lastSyncOk = true;
      showToast(`从 Notion 拉取 ${imported} 条数据 ✓`);
    } catch(e) {
      this.lastSync = new Date().toLocaleString('zh-CN', { hour12: false });
      this.lastSyncOk = false;
      showToast('拉取失败: ' + e.message, 'error');
    } finally {
      this.syncing = false;
      this.updateUI();
    }
  },

  async push(){
    if(!this.activeModule){ showToast('请先配置 Notion 映射', 'warn'); return; }
    const mapping = this.config?.mappings?.[this.activeModule];
    if(!mapping?.databaseId){ showToast('未配置数据库 ID', 'warn'); return; }

    const moduleData = data[this.activeModule] || [];
    if(moduleData.length === 0){ showToast('没有可推送的数据', 'warn'); return; }

    this.syncing = true;
    this.updateUI();
    try {
      const schema = await this.getDatabaseSchema(mapping.databaseId);
      const results = [];

      for(const item of moduleData){
        const properties = mapToNotionProperties(item, this.activeModule, mapping.fields, schema);
        try {
          if(item._notionId){
            await this.updatePage(item._notionId, properties);
            results.push({ ok: true, id: item._notionId, action: 'updated' });
          } else {
            const newPage = await this.createPage(mapping.databaseId, properties);
            results.push({ ok: true, id: newPage.id, action: 'created' });
            item._notionId = newPage.id;
          }
        } catch(e) {
          results.push({ ok: false, id: item._notionId || 'new', error: e.message });
        }
      }

      store.save();
      this.lastSync = new Date().toLocaleString('zh-CN', { hour12: false });
      this.lastSyncOk = true;
      const successCount = results.filter(r => r.ok).length;
      showToast(`推送到 Notion: ${successCount}/${results.length} 条 ✓`);
    } catch(e) {
      this.lastSync = new Date().toLocaleString('zh-CN', { hour12: false });
      this.lastSyncOk = false;
      showToast('推送失败: ' + e.message, 'error');
    } finally {
      this.syncing = false;
      this.updateUI();
    }
  },

  openConfig(){
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    const modules = CONFIG.modules.map(m => {
      const mapping = this.config?.mappings?.[m.key] || {};
      const hasDb = mapping.databaseId ? '✓' : '';
      return `<div class="nc-mod-row">
        <div class="nc-mod-name">${m.name}</div>
        <input type="text" class="nc-input" data-mod="${m.key}" data-field="databaseId"
          value="${mapping.databaseId || ''}" placeholder="Notion 数据库 ID"
          style="flex:1; min-width:100px"/>
        <button class="btn ghost" data-test="${m.key}" ${!mapping.databaseId ? 'disabled' : ''}>获取结构</button>
      </div>`;
    }).join('');

    overlay.innerHTML = `<div class="modal" style="width:640px; max-height:85vh; overflow-y:auto">
      <h3>Notion 同步配置</h3>
      <div class="sub">连接到你的 Notion 工作区，将数据库映射到工作台模块。<br>
      需要先在 <a href="https://www.notion.so/my-integrations" target="_blank">Notion Developers</a> 创建 Integration 并授权访问数据库</div>
      <div class="notion-config" style="display:flex; flex-direction:column; gap:14px; margin-top:16px">
        <div class="nc-row">
          <label>Notion API Key</label>
          <input type="password" class="nc-input" id="nc-api-key"
            value="${attr(this.config?.apiKey || '')}"
            placeholder="ntn_xxxxxxxxxxxxxxxx"
            style="flex:1"/>
          <span class="nc-help">在 <a href="https://www.notion.so/my-integrations" target="_blank">Notion Developers</a> 创建 Integration 后获取</span>
        </div>
        <div class="nc-row">
          <label>代理服务器 URL</label>
          <input type="text" class="nc-input" id="nc-proxy-url"
            value="${attr(this.config?.proxyUrl || '')}"
            placeholder="/notion 或 http://localhost:8081/notion"
            style="flex:1"/>
          <span class="nc-help">本地使用（python3 notion-proxy.py）填 /notion；GitHub Pages 部署需填 Cloudflare Worker 完整 URL（如 https://your-worker.workers.dev/notion）</span>
        </div>
        <div class="nc-row">
          <label>拉取模式</label>
          <select class="nc-input" id="nc-pull-mode" style="flex:1">
            <option value="merge" ${this.config?.pullMode === 'merge' ? 'selected' : ''}>合并（仅导入新条目）</option>
            <option value="overwrite" ${(!this.config?.pullMode || this.config?.pullMode === 'overwrite') ? 'selected' : ''}>覆盖（用 Notion 数据完全替换）</option>
          </select>
        </div>
        <div class="nc-section-title">模块映射</div>
        ${modules}
        <div id="nc-schema" style="display:none; margin-top:12px"></div>
        <div id="nc-test-result" style="display:none"></div>
      </div>
      <div class="modal-actions"><div class="spacer"></div>
        <button class="btn ghost" id="nc-cancel">取消</button>
        <button class="btn" id="nc-test">测试连接</button>
        <button class="btn primary" id="nc-save">保存</button></div></div>`;
    document.body.appendChild(overlay);
    const close = () => overlay.remove();
    overlay.onclick = e => { if(e.target === overlay) close(); };
    overlay.querySelector('#nc-cancel').onclick = close;

    // 测试连接
    overlay.querySelector('#nc-test').onclick = async () => {
      const key = overlay.querySelector('#nc-api-key').value.trim();
      const proxyUrl = overlay.querySelector('#nc-proxy-url').value.trim();
      _notionProxyUrl = proxyUrl || null;
      const resultEl = overlay.querySelector('#nc-test-result');
      resultEl.style.display = 'block';
      resultEl.style.background = 'var(--surface-nested)';
      resultEl.style.color = 'var(--text-secondary)';
      resultEl.innerHTML = `⏳ 正在连接 Notion API${isProxyMode() ? ' (代理模式: ' + proxyUrl + ')' : ' (直连模式)'}...`;

      // 预检代理
      const proxyCheck = await checkProxyAvailable();
      if(!proxyCheck.ok){
        resultEl.style.background = 'var(--danger-muted)';
        resultEl.style.color = 'var(--danger)';
        resultEl.innerHTML = `❌ 代理不可达: ${attr(proxyCheck.diagnosis || '未知错误')}`;
        return;
      }

      try {
        const res = await fetch(notionUrl('/users/me'), {
          headers: notionHeaders(key),
        });
        if(!res.ok) throw new Error(`HTTP ${res.status}`);
        const result = await res.json();
        resultEl.style.background = 'var(--accent-muted)';
        resultEl.style.color = 'var(--accent)';
        resultEl.innerHTML = `✅ 连接成功！Notion 用户: ${attr(result.name || result.bot_name || 'Bot')}<br><span style="color:var(--text-tertiary);font-size:12px">${isProxyMode() ? '(代理模式)' : '(直连模式)'} 现在可以配置模块映射了</span>`;
      } catch(e) {
        resultEl.style.background = 'var(--danger-muted)';
        resultEl.style.color = 'var(--danger)';
        let errMsg = e.message;
        if(e.message === 'Failed to fetch'){
          const pc = await checkProxyAvailable();
          errMsg = pc.diagnosis || (isProxyMode() ? '代理服务器无响应' : '网络连接失败或 CORS 被阻止，建议使用代理模式');
        }
        resultEl.innerHTML = `❌ 连接失败: ${attr(errMsg)}<br><span style="color:var(--text-tertiary);font-size:12px">请检查 API Key 是否正确</span>`;
      }
    };

    // 获取数据库结构
    overlay.querySelectorAll('[data-test]').forEach(btn => {
      btn.onclick = async () => {
        const modKey = btn.dataset.test;
        const dbInput = overlay.querySelector(`input[data-mod="${modKey}"][data-field="databaseId"]`);
        const dbId = dbInput.value.trim();
        const key = overlay.querySelector('#nc-api-key').value.trim();
        if(!dbId){ showToast('请先填写数据库 ID', 'warn'); return; }
        if(!key){ showToast('请先填写 API Key', 'warn'); return; }

        const schemaEl = overlay.querySelector('#nc-schema');
        schemaEl.style.display = 'block';
        schemaEl.innerHTML = '⏳ 获取结构中...';

        try {
          const res = await fetch(notionUrl(`/databases/${dbId}`), {
            headers: notionHeaders(key),
          });
          if(!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          const props = data.properties || {};

          const propList = Object.entries(props).map(([name, def]) =>
            `<div style="display:flex;align-items:center;gap:8px;padding:4px 8px;background:var(--surface);border-radius:6px;margin:2px 0">
              <span style="font-weight:600; min-width:120px">${attr(name)}</span>
              <span style="font-size:11px;color:var(--text-tertiary); min-width:80px">${def.type}</span>
              <span style="flex:1"></span>
              <select data-prop="${name}" class="nc-field-select">
                <option value="">→ 选择映射字段</option>
                <optgroup label="通用字段">
                  <option value="title">标题</option>
                  <option value="content">内容/备注</option>
                  <option value="date">日期</option>
                  <option value="tags">标签</option>
                </optgroup>
                <optgroup label="任务字段 (todo)">
                  <option value="done">状态(完成)</option>
                  <option value="priority">优先级</option>
                </optgroup>
                <optgroup label="进度字段 (read/sport)">
                  <option value="current">当前进度</option>
                  <option value="target">目标进度</option>
                  <option value="unit">单位</option>
                  <option value="times">次数</option>
                </optgroup>
                <optgroup label="财经字段 (money)">
                  <option value="amount">金额</option>
                  <option value="type">类型(收入/支出)</option>
                  <option value="category">分类</option>
                </optgroup>
                <optgroup label="笔记字段 (note/hot)">
                  <option value="mood">心情/标签</option>
                </optgroup>
                <optgroup label="IELTS 字段">
                  <option value="statusField">练习状态</option>
                  <option value="sectionField">Section/P 部分</option>
                  <option value="accuracyField">正确率</option>
                  <option value="difficultyField">难度</option>
                  <option value="frequencyField">频次</option>
                  <option value="partField">Speaking Part</option>
                  <option value="taskField">Writing Task</option>
                  <option value="questionTypeField">题型</option>
                  <option value="selfAssessmentField">自我评估</option>
                  <option value="estimatedScoreField">预估分数</option>
                  <option value="sourceField">题目来源</option>
                  <option value="weaknessField">薄弱环节</option>
                  <option value="tomorrowPlanField">改进计划</option>
                  <option value="cueCardField">Cue Card</option>
                  <option value="titleCnField">中文题目</option>
                  <option value="titleEnField">英文题目</option>
                  <option value="correctionLinkField">批改链接</option>
                  <option value="topicCategoryField">话题分类</option>
                  <option value="subjectField">学科</option>
                </optgroup>
              </select>
            </div>`
          ).join('');

          schemaEl.innerHTML = `<div style="margin-bottom:8px;display:flex;align-items:center;gap:8px"><span style="font-weight:600">数据库属性 → 工作台字段</span><button class="btn ghost" id="nc-auto-map" style="font-size:11px;padding:2px 8px">✨ 智能映射</button></div>${propList}`;

          // 智能自动映射
          const autoMapBtn = overlay.querySelector('#nc-auto-map');
          if(autoMapBtn){
            autoMapBtn.onclick = () => {
              const modKey = el.dataset.mod;
              const selectors = schemaEl.querySelectorAll('.nc-field-select');
              let mappedCount = 0;
              selectors.forEach(sel => {
                const propName = sel.dataset.prop.toLowerCase();
                const propType = sel.closest('div').querySelector('span:nth-child(2)').textContent;
                const val = autoMapField(propName, propType, modKey);
                if(val){
                  sel.value = val;
                  mappedCount++;
                }
              });
              if(mappedCount > 0){
                showToast(`✓ 自动映射 ${mappedCount} 个字段`);
              } else {
                showToast('没有可自动映射的字段，请手动选择', 'warn');
              }
            };
          }

          // 恢复已保存的映射
          const saved = this.config?.mappings?.[modKey] || {};
          const savedFields = saved.fields || {};
          schemaEl.querySelectorAll('.nc-field-select').forEach(sel => {
            const propName = sel.dataset.prop;
            if(savedFields[propName]){
              sel.value = savedFields[propName];
            }
          });

          btn.onclick = null;
          btn.textContent = '✓ 已获取';
          setTimeout(() => { btn.textContent = '重新获取'; btn.onclick = arguments.callee; }, 3000);
        } catch(e) {
          schemaEl.innerHTML = `❌ 获取失败: ${attr(e.message)}<br><span style="color:var(--text-tertiary);font-size:12px">请检查数据库 ID 是否正确，以及 Integration 是否已授权访问该数据库</span>`;
        }
      };
    });

    // 保存
    overlay.querySelector('#nc-save').onclick = () => {
      const apiKey = overlay.querySelector('#nc-api-key').value.trim();
      const proxyUrl = overlay.querySelector('#nc-proxy-url').value.trim();
      const pullMode = overlay.querySelector('#nc-pull-mode').value;

      if(!apiKey){ showToast('请填写 Notion API Key', 'warn'); return; }

      _notionProxyUrl = proxyUrl || null;

      const mappings = {};
      overlay.querySelectorAll('.nc-mod-row').forEach(row => {
        const modKey = row.querySelector('input').dataset.mod;
        const dbId = row.querySelector('input').value.trim();
        if(dbId){
          mappings[modKey] = { databaseId: dbId };
          const fieldMaps = {};
          overlay.querySelectorAll('#nc-schema .nc-field-select').forEach(sel => {
            if(sel.value){
              fieldMaps[sel.dataset.prop] = sel.value;
            }
          });
          Object.assign(mappings[modKey], { fields: fieldMaps });
        }
      });

      this.config = { apiKey, proxyUrl: proxyUrl || '', pullMode, mappings };
      localStorage.setItem('cat-news-notion-config', JSON.stringify(this.config));
      this.updateUI();
      close();
      showToast('Notion 配置已保存 ✓');
      this.testConnection(true);
    };
  },
};

/* 初始化云同步 */
CloudSync.init();

/* 初始化 Notion 同步 */
NotionSync.init();

/* 初始化 MiaoAI */
MiaoAI.init();

/* 包装 store.save 以支持自动同步 */
const _origSave = store.save.bind(store);
store.save = function(){
  _origSave();
  if(CloudSync.config?.autoSync && CloudSync.supabase){
    debounce(() => CloudSync.autoSync(), 2000);
  }
};

function debounce(fn, ms){
  clearTimeout(fn._t);
  fn._t = setTimeout(() => fn(), ms);
}
</script>
