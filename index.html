        const start = Date.now();
        const { error, count } = await tempClient
          .from('workbench_data')
          .select('id', { count:'exact', head:true })
          .limit(1);
        const latency = Date.now() - start;
        if(error){
          resultEl.style.background = 'var(--danger-muted)';
          resultEl.style.color = 'var(--danger)';
          resultEl.innerHTML = `❌ 连接失败：${attr(error.message)}<br><span style="color:var(--text-tertiary);font-size:12px">请检查 Key 是否正确，以及是否已在 SQL Editor 执行 schema.sql 建表</span>`;
        } else {
          resultEl.style.background = 'var(--accent-muted)';
          resultEl.style.color = 'var(--accent)';
          resultEl.innerHTML = `✅ 连接成功！延迟 ${latency}ms，表中已有 ${count ?? 0} 条记录<br><span style="color:var(--text-tertiary);font-size:12px">可以安全保存配置</span>`;
        }
      } catch(e) {
        resultEl.style.background = 'var(--danger-muted)';
        resultEl.style.color = 'var(--danger)';
        resultEl.innerHTML = `❌ 网络错误：${attr(e.message)}`;
      }
    };
    overlay.querySelector('#cfg-save').onclick = () => {
      const url = this.normalizeUrl(overlay.querySelector('#cfg-url').value.trim());
      const key = overlay.querySelector('#cfg-key').value.trim();
      const user = overlay.querySelector('#cfg-user').value.trim();
      const autoSync = overlay.querySelector('#cfg-autosync').checked;
      if(!url || !key){ showToast('请填写 URL 和 Key', 'warn'); return; }
      this.config = { url, key, user, autoSync, id: 'default' };
      localStorage.setItem('cat-news-supabase-config', JSON.stringify(this.config));
      this.connect();
      close();
      showToast('云同步配置已保存 ✓');
    };
  },

  bindEvents(){
    document.getElementById('btn-sync-now').onclick = () => this.syncNow();
    document.getElementById('btn-sync-pull').onclick = () => this.pull();
  }
};

/* ============================================================
   NOTION SYNC — Notion 数据库同步模块
   通过代理服务器转发请求（绕过浏览器 CORS 限制）
   ============================================================ */
const NOTION_DIRECT_API = 'https://api.notion.com/v1';
const NOTION_VERSION = '2022-06-28';

let _notionProxyUrl = null;

function notionBaseUrl(){
  if(_notionProxyUrl){
    const proxyBase = _notionProxyUrl.replace(/\/$/, '');
    // 如果代理是同源的（页面本身就是代理服务器提供的），使用相对路径
    if(proxyBase === '/notion'){
      return '/notion';
    }
    // 如果代理 URL 的 origin 与页面相同，也使用相对路径
    try {
      const u = new URL(proxyBase, window.location.origin);
      if(u.origin === window.location.origin && u.pathname === '/notion'){
        return '/notion';
      }
    } catch(e) {}
    return proxyBase;
  }
  return NOTION_DIRECT_API;
}

function notionUrl(path){
  return notionBaseUrl() + path;
}

function notionHeaders(apiKey){
  return {
    'Authorization': `Bearer ${apiKey}`,
    'Notion-Version': NOTION_VERSION,
    'Content-Type': 'application/json',
  };
}

function isProxyMode(){
  return !!_notionProxyUrl;
}

function extractNotionProperties(page){
  const props = {};
  if(!page.properties) return props;
  for (const [key, prop] of Object.entries(page.properties)){
    const p = prop;
    switch(p.type){
      case 'title': props[key] = p.title?.[0]?.plain_text || ''; break;
      case 'rich_text': props[key] = p.rich_text?.map(t => t.plain_text).join('') || ''; break;
      case 'select': props[key] = p.select?.name || ''; break;
      case 'multi_select': props[key] = p.multi_select?.map(s => s.name) || []; break;
      case 'date': props[key] = p.date?.start || ''; break;
      case 'checkbox': props[key] = p.checkbox || false; break;
      case 'number': props[key] = p.number || 0; break;
      case 'url': props[key] = p.url || ''; break;
      case 'created_time': props[key] = p.created_time || ''; break;
      case 'last_edited_time': props[key] = p.last_edited_time || ''; break;
      case 'status': props[key] = p.status?.name || ''; break;
      default: props[key] = p[p.type] || '';
    }
  }
  return props;
}

function mapToWorkbenchItem(page, moduleKey, mappings){
  const props = extractNotionProperties(page);
  const mapping = mappings || {};
  const result = { id: page.id, _notionId: page.id };

  // 标题
  if(mapping.titleField && props[mapping.titleField]){
    result.title = props[mapping.titleField];
  } else {
    const titleKey = Object.entries(page.properties || {})
      .find(([_, p]) => p.type === 'title')?.[0];
    result.title = titleKey ? props[titleKey] : page.id;
  }

  // 内容/备注
  if(mapping.contentField && props[mapping.contentField]){
    if(moduleKey === 'note' || moduleKey === 'hot'){
      result.content = props[mapping.contentField];
    } else {
      result.note = props[mapping.contentField];
    }
  }

  // 状态（多状态支持）
  if(mapping.statusField && props[mapping.statusField] !== undefined){
    const v = props[mapping.statusField];
    if(typeof v === 'boolean'){
      result.status = v ? '✅ 已完成' : '☐ 未练习';
      result.done = v;
    } else if(typeof v === 'string'){
      result.status = v;
      result.done = ['done','completed','已完成','✅ 已完成'].includes(v.toLowerCase());
    }
  }

  // 优先级
  if(mapping.priorityField && props[mapping.priorityField]){
    result.priority = String(props[mapping.priorityField]).toUpperCase();
  }

  // 类型
  if(mapping.typeField && props[mapping.typeField]) result.type = props[mapping.typeField];

  // 分类
  if(mapping.categoryField && props[mapping.categoryField]) result.category = props[mapping.categoryField];

  // 单位
  if(mapping.unitField && props[mapping.unitField]) result.unit = props[mapping.unitField];

  // 心情
  if(mapping.moodField && props[mapping.moodField]) result.mood = props[mapping.moodField];

  // 日期
  if(mapping.dateField && props[mapping.dateField]){
    result.date = props[mapping.dateField];
  } else {
    result.date = new Date().toISOString().slice(0, 10);
  }

  // 数字
  if(mapping.amountField && props[mapping.amountField] !== undefined) result.amount = props[mapping.amountField];
  if(mapping.currentField && props[mapping.currentField] !== undefined) result.current = props[mapping.currentField];
  if(mapping.targetField && props[mapping.targetField] !== undefined) result.target = props[mapping.targetField];

  // 标签
  if(mapping.tagField && props[mapping.tagField]){
    const tags = props[mapping.tagField];
    result.tags = Array.isArray(tags) ? tags : [tags];
  }

  // 练习次数
  if(mapping.timesField && props[mapping.timesField] !== undefined) result.times = props[mapping.timesField];

  // IELTS 专用字段
  if(mapping.sectionField && props[mapping.sectionField])
    result.section = props[mapping.sectionField];
  if(mapping.listeningSectionField && props[mapping.listeningSectionField])
    result.section = props[mapping.listeningSectionField];
  if(mapping.accuracyField && props[mapping.accuracyField] != null)
    result.accuracy = Number(props[mapping.accuracyField]);
  if(mapping.difficultyField && props[mapping.difficultyField] != null)
    result.difficulty = props[mapping.difficultyField];
  if(mapping.frequencyField && props[mapping.frequencyField])
    result.frequency = props[mapping.frequencyField];
  if(mapping.partField && props[mapping.partField])
    result.part = props[mapping.partField];
  if(mapping.taskField && props[mapping.taskField])
    result.task = props[mapping.taskField];
  if(mapping.questionTypeField && props[mapping.questionTypeField])
    result.questionType = props[mapping.questionTypeField];
  if(mapping.selfAssessmentField && props[mapping.selfAssessmentField])
    result.selfAssessment = props[mapping.selfAssessmentField];
  if(mapping.estimatedScoreField && props[mapping.estimatedScoreField] != null)
    result.estimatedScore = Number(props[mapping.estimatedScoreField]);
  if(mapping.sourceField && props[mapping.sourceField])
    result.source = props[mapping.sourceField];
  if(mapping.weaknessField && props[mapping.weaknessField])
    result.weakness = props[mapping.weaknessField];
  if(mapping.tomorrowPlanField && props[mapping.tomorrowPlanField])
    result.tomorrowPlan = props[mapping.tomorrowPlanField];
  if(mapping.cueCardField && props[mapping.cueCardField])
    result.cueCard = props[mapping.cueCardField];
  if(mapping.titleCnField && props[mapping.titleCnField])
    result.titleCn = props[mapping.titleCnField];
  if(mapping.titleEnField && props[mapping.titleEnField])
    result.titleEn = props[mapping.titleEnField];
  if(mapping.correctionLinkField && props[mapping.correctionLinkField])
    result.correctionLink = props[mapping.correctionLinkField];
  if(mapping.topicCategoryField && props[mapping.topicCategoryField])
    result.topicCategory = props[mapping.topicCategoryField];
  if(mapping.subjectField && props[mapping.subjectField])
    result.subject = props[mapping.subjectField];

  return result;
}

function mapToNotionProperties(item, moduleKey, mappings, schema){
  const mapping = mappings || {};
  const properties = {};

  if(mapping.titleField){
    properties[mapping.titleField] = {
      title: [{ type: 'text', text: { content: item.title || '未命名' } }]
    };
  }

  if(mapping.contentField){
    const content = item.note || item.content;
    if(content){
      properties[mapping.contentField] = {
        rich_text: [{ type: 'text', text: { content } }]
      };
    }
  }

  if(mapping.statusField){
    const propSchema = schema?.[mapping.statusField];
    const statusVal = item.status || (item.done ? '✅ 已完成' : '☐ 未练习');
    if(propSchema?.type === 'checkbox'){
      properties[mapping.statusField] = { checkbox: item.done || (statusVal === '✅ 已完成') };
    } else if(propSchema?.type === 'status'){
      properties[mapping.statusField] = { status: { name: statusVal } };
    } else if(propSchema?.type === 'select'){
      properties[mapping.statusField] = { select: { name: statusVal } };
    }
  }

  if(mapping.typeField && item.type){
    properties[mapping.typeField] = { select: { name: item.type } };
  }

  if(mapping.categoryField && item.category){
    properties[mapping.categoryField] = { select: { name: item.category } };
  }

  if(mapping.priorityField && item.priority){
    properties[mapping.priorityField] = { select: { name: item.priority } };
  }

  if(mapping.dateField){
    properties[mapping.dateField] = { date: item.date ? { start: item.date } : null };
  }

  if(mapping.amountField && item.amount !== undefined && item.amount !== null){
    properties[mapping.amountField] = { number: item.amount };
  }
  if(mapping.currentField && item.current !== undefined && item.current !== null){
    properties[mapping.currentField] = { number: Number(item.current) };
  }
  if(mapping.targetField && item.target !== undefined && item.target !== null){
    properties[mapping.targetField] = { number: Number(item.target) };
  }
  if(mapping.timesField && item.times !== undefined && item.times !== null){
    properties[mapping.timesField] = { number: Number(item.times) };
  }

  if(mapping.moodField && item.mood){
    properties[mapping.moodField] = { select: { name: item.mood } };
  }

  if(mapping.tagField && item.tags && item.tags.length){
    properties[mapping.tagField] = {
      multi_select: item.tags.map(t => ({ name: t }))
    };
  }

  if(mapping.unitField && item.unit){
    properties[mapping.unitField] = {
      rich_text: [{ type: 'text', text: { content: item.unit } }]
    };
  }

  // IELTS 专用字段推送
  if(mapping.sectionField && item.section)
    properties[mapping.sectionField] = { select: { name: item.section } };
  if(mapping.listeningSectionField && item.section)
    properties[mapping.listeningSectionField] = { select: { name: item.section } };
  if(mapping.accuracyField && item.accuracy != null)
    properties[mapping.accuracyField] = { number: Number(item.accuracy) };
  if(mapping.difficultyField && item.difficulty != null) {
    const propSchema = schema?.[mapping.difficultyField];
    if(propSchema?.type === 'number')
      properties[mapping.difficultyField] = { number: Number(item.difficulty) };
    else
      properties[mapping.difficultyField] = { rich_text: [{ text: { content: String(item.difficulty) } }] };
  }
  if(mapping.frequencyField && item.frequency)
    properties[mapping.frequencyField] = { select: { name: item.frequency } };
  if(mapping.partField && item.part)
    properties[mapping.partField] = { select: { name: item.part } };
  if(mapping.taskField && item.task)
    properties[mapping.taskField] = { select: { name: item.task } };
  if(mapping.questionTypeField && item.questionType)
    properties[mapping.questionTypeField] = { rich_text: [{ text: { content: item.questionType } }] };
  if(mapping.selfAssessmentField && item.selfAssessment)
    properties[mapping.selfAssessmentField] = { select: { name: item.selfAssessment } };
  if(mapping.estimatedScoreField && item.estimatedScore != null)
    properties[mapping.estimatedScoreField] = { number: Number(item.estimatedScore) };
  if(mapping.sourceField && item.source)
    properties[mapping.sourceField] = { rich_text: [{ text: { content: item.source } }] };
  if(mapping.weaknessField && item.weakness)
    properties[mapping.weaknessField] = { rich_text: [{ text: { content: item.weakness } }] };
  if(mapping.tomorrowPlanField && item.tomorrowPlan)
    properties[mapping.tomorrowPlanField] = { rich_text: [{ text: { content: item.tomorrowPlan } }] };
  if(mapping.cueCardField && item.cueCard)
    properties[mapping.cueCardField] = { rich_text: [{ text: { content: item.cueCard } }] };
  if(mapping.titleCnField && item.titleCn)
    properties[mapping.titleCnField] = { rich_text: [{ text: { content: item.titleCn } }] };
  if(mapping.titleEnField && item.titleEn)
    properties[mapping.titleEnField] = { rich_text: [{ text: { content: item.titleEn } }] };
  if(mapping.correctionLinkField && item.correctionLink)
    properties[mapping.correctionLinkField] = { url: item.correctionLink };
  if(mapping.topicCategoryField && item.topicCategory)
    properties[mapping.topicCategoryField] = { rich_text: [{ text: { content: item.topicCategory } }] };
  if(mapping.subjectField && item.subject)
    properties[mapping.subjectField] = { select: { name: item.subject } };

  return properties;
}

const NotionSync = {
  config: null,
  connected: false,
  syncing: false,
  activeModule: null,

  init(){
    const saved = localStorage.getItem('cat-news-notion-config');
    if(saved){
      try {
        this.config = JSON.parse(saved);
        if(this.config?.proxyUrl){
          _notionProxyUrl = this.config.proxyUrl;
        }
        if(this.config?.apiKey){
          this.testConnection(true);
        }
      } catch(e){}
    }
    this.updateUI();
    this.bindEvents();
  },

  bindEvents(){
    const btnCfg = document.getElementById('btn-notion-cfg');
    const btnPull = document.getElementById('btn-notion-pull');
    const btnPush = document.getElementById('btn-notion-push');
    if(btnCfg) btnCfg.onclick = () => this.openConfig();
    if(btnPull) btnPull.onclick = () => this.pull();
    if(btnPush) btnPush.onclick = () => this.push();
  },

  updateUI(){
    const status = document.getElementById('nbStatus');
    const modules = document.getElementById('nbModules');
    const actions = document.getElementById('nbActions');
    const last = document.getElementById('nbLast');
    if(!status) return;

    if(!this.config?.apiKey){
      status.textContent = '未配置 · 点击齿轮图标';
      status.className = 'nb-status';
      if(modules) modules.style.display = 'none';
      if(actions) actions.style.display = 'none';
      if(last) last.textContent = '';
      return;
    }

    status.textContent = this.connected ? '已连接 · API Key 有效' : '正在检测连接...';
    status.className = 'nb-status' + (this.connected ? ' connected' : '');

    const mappings = this.config.mappings || {};
    const mappedModules = Object.keys(mappings).filter(k => mappings[k]?.databaseId);
    if(modules && mappedModules.length > 0){
      modules.style.display = 'flex';
      modules.innerHTML = mappedModules.map(k => {
        const mod = CONFIG.modules.find(m => m.key === k);
        const active = this.activeModule === k;
        return `<div class="nb-module${active ? ' active' : ''}" data-module="${k}">${mod?.name || k}</div>`;
      }).join('');
      modules.querySelectorAll('.nb-module').forEach(el => {
        el.onclick = () => { this.activeModule = el.dataset.module; this.updateUI(); };
      });
      this.activeModule = this.activeModule || mappedModules[0];
      modules.querySelectorAll('.nb-module').forEach(el => {
        if(el.dataset.module === this.activeModule) el.classList.add('active');
      });
    } else if(modules){
      modules.style.display = 'none';
    }

    if(actions){
      actions.style.display = mappedModules.length > 0 ? 'flex' : 'none';
    }
    if(last){
      if(this.lastSync){
        last.textContent = `上次同步: ${this.lastSync}`;
        last.className = 'nb-last ' + (this.lastSyncOk ? 'success' : 'error');
      } else {
        last.textContent = '';
      }
    }
  },

  async testConnection(silent){
    if(!this.config?.apiKey) return false;
    try {
      const probeRes = await fetch(notionUrl('/users/me'), {
        method: 'GET',
        headers: notionHeaders(this.config.apiKey),
      });
      if(!probeRes.ok){
        const text = await probeRes.text();
        if(probeRes.status === 401 || probeRes.status === 403){
          throw new Error(`API Key 无效 (HTTP ${probeRes.status})`);
        } else if(probeRes.status === 404){
          throw new Error(`端点不存在 (HTTP 404)`);
        } else {
          throw new Error(`HTTP ${probeRes.status}: ${text.slice(0, 100)}`);
        }
      }
      const result = await probeRes.json();
      this.connected = true;
      if(!silent) showToast(`Notion 连接成功 ✓ (${result.name || result.bot_name || 'Bot'})`);
    } catch(e) {
      this.connected = false;
      let msg = e.message;
      if(e.message === 'Failed to fetch'){
        msg = isProxyMode()
          ? '代理无响应。本地: python3 notion-proxy.py；线上: 检查 Cloudflare Workers 是否正常运行'
          : '网络无法连接到 api.notion.com。建议使用代理模式（在设置中填写代理地址）';
      }
      if(!silent) showToast('Notion 连接失败: ' + msg, 'error');
    }
    this.updateUI();
    return this.connected;
  },

  async getDatabaseSchema(databaseId){
    if(!this.config?.apiKey || !databaseId) return null;
    try {
      const res = await fetch(notionUrl(`/databases/${databaseId}`), {
        headers: notionHeaders(this.config.apiKey),
      });
      if(!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      return data.properties || {};
    } catch(e) { return null; }
  },

  async queryDatabase(databaseId){
    const results = [];
    let cursor = null;
    do {
      const body = { page_size: 100 };
      if(cursor) body.start_cursor = cursor;
      const res = await fetch(notionUrl(`/databases/${databaseId}/query`), {
        method: 'POST',
        headers: notionHeaders(this.config.apiKey),
        body: JSON.stringify(body),
      });
      if(!res.ok) throw new Error(`查询失败: HTTP ${res.status}`);
      const data = await res.json();
      results.push(...data.results);
      cursor = data.has_more ? data.next_cursor : null;
    } while(cursor);
    return results;
  },

  async createPage(databaseId, properties){
    const res = await fetch(notionUrl('/pages'), {
      method: 'POST',
      headers: notionHeaders(this.config.apiKey),
      body: JSON.stringify({ parent: { database_id: databaseId }, properties }),
    });
    if(!res.ok) throw new Error(`创建失败: HTTP ${res.status}`);
    return res.json();
  },

  async updatePage(pageId, properties){
    const res = await fetch(notionUrl(`/pages/${pageId}`), {
      method: 'PATCH',
      headers: notionHeaders(this.config.apiKey),
      body: JSON.stringify({ properties }),
    });
    if(!res.ok) throw new Error(`更新失败: HTTP ${res.status}`);
    return res.json();
  },

  async pull(){
    if(!this.activeModule){ showToast('请先配置 Notion 映射', 'warn'); return; }
    const mapping = this.config?.mappings?.[this.activeModule];
    if(!mapping?.databaseId){ showToast('未配置数据库 ID', 'warn'); return; }

    this.syncing = true;
    this.updateUI();
    try {
      const pages = await this.queryDatabase(mapping.databaseId);
      const items = pages.map(p => mapToWorkbenchItem(p, this.activeModule, mapping.fields));

      const moduleData = data[this.activeModule] || [];
      const notExisting = items.filter(item => !moduleData.find(x => x._notionId === item._notionId));

      let imported = 0;
      if(this.config.pullMode === 'merge'){
        notExisting.forEach(item => {
          item.id = item.id || Date.now() + Math.floor(Math.random() * 1000);
          moduleData.push(item);
          imported++;
        });
      } else {
        items.forEach(item => {
          if(!item.id) item.id = Date.now() + Math.floor(Math.random() * 1000);
        });
        data[this.activeModule] = items;
        imported = items.length;
      }

      store.save();
      render();
      this.lastSync = new Date().toLocaleString('zh-CN', { hour12: false });
      this.lastSyncOk = true;
      showToast(`从 Notion 拉取 ${imported} 条数据 ✓`);
    } catch(e) {
      this.lastSync = new Date().toLocaleString('zh-CN', { hour12: false });
      this.lastSyncOk = false;
      showToast('拉取失败: ' + e.message, 'error');
    } finally {
      this.syncing = false;
      this.updateUI();
    }
  },

  async push(){
    if(!this.activeModule){ showToast('请先配置 Notion 映射', 'warn'); return; }
    const mapping = this.config?.mappings?.[this.activeModule];
    if(!mapping?.databaseId){ showToast('未配置数据库 ID', 'warn'); return; }

    const moduleData = data[this.activeModule] || [];
    if(moduleData.length === 0){ showToast('没有可推送的数据', 'warn'); return; }

    this.syncing = true;
    this.updateUI();
    try {
      const schema = await this.getDatabaseSchema(mapping.databaseId);
      const results = [];

      for(const item of moduleData){
        const properties = mapToNotionProperties(item, this.activeModule, mapping.fields, schema);
        try {
          if(item._notionId){
            await this.updatePage(item._notionId, properties);
            results.push({ ok: true, id: item._notionId, action: 'updated' });
          } else {
            const newPage = await this.createPage(mapping.databaseId, properties);
            results.push({ ok: true, id: newPage.id, action: 'created' });
            item._notionId = newPage.id;
          }
        } catch(e) {
          results.push({ ok: false, id: item._notionId || 'new', error: e.message });
        }
      }

      store.save();
      this.lastSync = new Date().toLocaleString('zh-CN', { hour12: false });
      this.lastSyncOk = true;
      const successCount = results.filter(r => r.ok).length;
      showToast(`推送到 Notion: ${successCount}/${results.length} 条 ✓`);
    } catch(e) {
      this.lastSync = new Date().toLocaleString('zh-CN', { hour12: false });
      this.lastSyncOk = false;
      showToast('推送失败: ' + e.message, 'error');
    } finally {
      this.syncing = false;
      this.updateUI();
    }
  },

  openConfig(){
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    const modules = CONFIG.modules.map(m => {
      const mapping = this.config?.mappings?.[m.key] || {};
      const hasDb = mapping.databaseId ? '✓' : '';
      return `<div class="nc-mod-row">
        <div class="nc-mod-name">${m.name}</div>
        <input type="text" class="nc-input" data-mod="${m.key}" data-field="databaseId"
          value="${mapping.databaseId || ''}" placeholder="Notion 数据库 ID"
          style="flex:1; min-width:100px"/>
        <button class="btn ghost" data-test="${m.key}" ${!mapping.databaseId ? 'disabled' : ''}>获取结构</button>
      </div>`;
    }).join('');

    overlay.innerHTML = `<div class="modal" style="width:640px; max-height:85vh; overflow-y:auto">
      <h3>Notion 同步配置</h3>
      <div class="sub">连接到你的 Notion 工作区，将数据库映射到工作台模块。<br>
      需要先在 <a href="https://www.notion.so/my-integrations" target="_blank">Notion Developers</a> 创建 Integration 并授权访问数据库</div>
      <div class="notion-config" style="display:flex; flex-direction:column; gap:14px; margin-top:16px">
        <div class="nc-row">
          <label>Notion API Key</label>
          <input type="password" class="nc-input" id="nc-api-key"
            value="${attr(this.config?.apiKey || '')}"
            placeholder="ntn_xxxxxxxxxxxxxxxx"
            style="flex:1"/>
          <span class="nc-help">在 <a href="https://www.notion.so/my-integrations" target="_blank">Notion Developers</a> 创建 Integration 后获取</span>
        </div>
        <div class="nc-row">
          <label>代理服务器 URL</label>
          <input type="text" class="nc-input" id="nc-proxy-url"
            value="${attr(this.config?.proxyUrl || '')}"
            placeholder="/notion 或 http://localhost:8081/notion"
            style="flex:1"/>
          <span class="nc-help">本地代理填 /notion；Cloudflare Workers 填 https://你的域名.workers.dev/notion；直连模式需自建代理</span>
        </div>
        <div class="nc-row">
          <label>拉取模式</label>
          <select class="nc-input" id="nc-pull-mode" style="flex:1">
            <option value="merge" ${this.config?.pullMode === 'merge' ? 'selected' : ''}>合并（仅导入新条目）</option>
            <option value="overwrite" ${(!this.config?.pullMode || this.config?.pullMode === 'overwrite') ? 'selected' : ''}>覆盖（用 Notion 数据完全替换）</option>
          </select>
        </div>
        <div class="nc-section-title">模块映射</div>
        ${modules}
        <div id="nc-schema" style="display:none; margin-top:12px"></div>
        <div id="nc-test-result" style="display:none"></div>
      </div>
      <div class="modal-actions"><div class="spacer"></div>
        <button class="btn ghost" id="nc-cancel">取消</button>
        <button class="btn" id="nc-test">测试连接</button>
        <button class="btn primary" id="nc-save">保存</button></div></div>`;
    document.body.appendChild(overlay);
    const close = () => overlay.remove();
    overlay.onclick = e => { if(e.target === overlay) close(); };
    overlay.querySelector('#nc-cancel').onclick = close;

    // 测试连接
    overlay.querySelector('#nc-test').onclick = async () => {
      const key = overlay.querySelector('#nc-api-key').value.trim();
      const proxyUrl = overlay.querySelector('#nc-proxy-url').value.trim();
      _notionProxyUrl = proxyUrl || null;
      const resultEl = overlay.querySelector('#nc-test-result');
      resultEl.style.display = 'block';
      resultEl.style.background = 'var(--surface-nested)';
      resultEl.style.color = 'var(--text-secondary)';
      resultEl.innerHTML = `⏳ 正在连接 Notion API${isProxyMode() ? ' (代理模式: ' + proxyUrl + ')' : ' (直连模式)'}...`;

      try {
        const res = await fetch(notionUrl('/users/me'), {
          headers: notionHeaders(key),
        });
        if(!res.ok) throw new Error(`HTTP ${res.status}`);
        const result = await res.json();
        resultEl.style.background = 'var(--accent-muted)';
        resultEl.style.color = 'var(--accent)';
        resultEl.innerHTML = `✅ 连接成功！Notion 用户: ${attr(result.name || result.bot_name || 'Bot')}<br><span style="color:var(--text-tertiary);font-size:12px">${isProxyMode() ? '(代理模式)' : '(直连模式)'} 现在可以配置模块映射了</span>`;
      } catch(e) {
        resultEl.style.background = 'var(--danger-muted)';
        resultEl.style.color = 'var(--danger)';
        let errMsg = e.message;
        if(e.message === 'Failed to fetch'){
          errMsg = isProxyMode() ? '代理服务器无响应，请确认已启动 python3 notion-proxy.py' : '网络连接失败或 CORS 被阻止，建议使用代理模式';
        }
        resultEl.innerHTML = `❌ 连接失败: ${attr(errMsg)}<br><span style="color:var(--text-tertiary);font-size:12px">请检查 API Key 是否正确</span>`;
      }
    };

    // 获取数据库结构
    overlay.querySelectorAll('[data-test]').forEach(btn => {
      btn.onclick = async () => {
        const modKey = btn.dataset.test;
        const dbInput = overlay.querySelector(`input[data-mod="${modKey}"][data-field="databaseId"]`);
        const dbId = dbInput.value.trim();
        const key = overlay.querySelector('#nc-api-key').value.trim();
        if(!dbId){ showToast('请先填写数据库 ID', 'warn'); return; }
        if(!key){ showToast('请先填写 API Key', 'warn'); return; }

        const schemaEl = overlay.querySelector('#nc-schema');
        schemaEl.style.display = 'block';
        schemaEl.innerHTML = '⏳ 获取结构中...';

        try {
          const res = await fetch(notionUrl(`/databases/${dbId}`), {
            headers: notionHeaders(key),
          });
          if(!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          const props = data.properties || {};

          const propList = Object.entries(props).map(([name, def]) =>
            `<div style="display:flex;align-items:center;gap:8px;padding:4px 8px;background:var(--surface);border-radius:6px;margin:2px 0">
              <span style="font-weight:600; min-width:120px">${attr(name)}</span>
              <span style="font-size:11px;color:var(--text-tertiary); min-width:80px">${def.type}</span>
              <span style="flex:1"></span>
              <select data-prop="${name}" class="nc-field-select">
                <option value="">→ 选择映射字段</option>
                <optgroup label="通用字段">
                  <option value="title">标题</option>
                  <option value="content">内容/备注</option>
                  <option value="date">日期</option>
                  <option value="tags">标签</option>
                </optgroup>
                <optgroup label="任务字段 (todo)">
                  <option value="done">状态(完成)</option>
                  <option value="priority">优先级</option>
                </optgroup>
                <optgroup label="进度字段 (read/sport)">
                  <option value="current">当前进度</option>
                  <option value="target">目标进度</option>
                  <option value="unit">单位</option>
                  <option value="times">次数</option>
                </optgroup>
                <optgroup label="财经字段 (money)">
                  <option value="amount">金额</option>
                  <option value="type">类型(收入/支出)</option>
                  <option value="category">分类</option>
                </optgroup>
                <optgroup label="笔记字段 (note/hot)">
                  <option value="mood">心情/标签</option>
                </optgroup>
                <optgroup label="IELTS 字段">
                  <option value="statusField">练习状态</option>
                  <option value="sectionField">Section/P 部分</option>
                  <option value="accuracyField">正确率</option>
                  <option value="difficultyField">难度</option>
                  <option value="frequencyField">频次</option>
                  <option value="partField">Speaking Part</option>
                  <option value="taskField">Writing Task</option>
                  <option value="questionTypeField">题型</option>
                  <option value="selfAssessmentField">自我评估</option>
                  <option value="estimatedScoreField">预估分数</option>
                  <option value="sourceField">题目来源</option>
                  <option value="weaknessField">薄弱环节</option>
                  <option value="tomorrowPlanField">改进计划</option>
                  <option value="cueCardField">Cue Card</option>
                  <option value="titleCnField">中文题目</option>
                  <option value="titleEnField">英文题目</option>
                  <option value="correctionLinkField">批改链接</option>
                  <option value="topicCategoryField">话题分类</option>
                  <option value="subjectField">学科</option>
                </optgroup>
              </select>
            </div>`
          ).join('');

          schemaEl.innerHTML = `<div style="margin-bottom:8px;font-weight:600">数据库属性 → 工作台字段</div>${propList}`;

          // 恢复已保存的映射
          const saved = this.config?.mappings?.[modKey] || {};
          const savedFields = saved.fields || {};
          schemaEl.querySelectorAll('.nc-field-select').forEach(sel => {
            const propName = sel.dataset.prop;
            if(savedFields[propName]){
              sel.value = savedFields[propName];
            }
          });

          btn.onclick = null;
          btn.textContent = '✓ 已获取';
          setTimeout(() => { btn.textContent = '重新获取'; btn.onclick = arguments.callee; }, 3000);
        } catch(e) {
          schemaEl.innerHTML = `❌ 获取失败: ${attr(e.message)}<br><span style="color:var(--text-tertiary);font-size:12px">请检查数据库 ID 是否正确，以及 Integration 是否已授权访问该数据库</span>`;
        }
      };
    });

    // 保存
    overlay.querySelector('#nc-save').onclick = () => {
      const apiKey = overlay.querySelector('#nc-api-key').value.trim();
      const proxyUrl = overlay.querySelector('#nc-proxy-url').value.trim();
      const pullMode = overlay.querySelector('#nc-pull-mode').value;

      if(!apiKey){ showToast('请填写 Notion API Key', 'warn'); return; }

      _notionProxyUrl = proxyUrl || null;

      const mappings = {};
      overlay.querySelectorAll('.nc-mod-row').forEach(row => {
        const modKey = row.querySelector('input').dataset.mod;
        const dbId = row.querySelector('input').value.trim();
        if(dbId){
          mappings[modKey] = { databaseId: dbId };
          const fieldMaps = {};
          overlay.querySelectorAll('#nc-schema .nc-field-select').forEach(sel => {
            if(sel.value){
              fieldMaps[sel.dataset.prop] = sel.value;
            }
          });
          Object.assign(mappings[modKey], { fields: fieldMaps });
        }
      });

      this.config = { apiKey, proxyUrl: proxyUrl || '', pullMode, mappings };
      localStorage.setItem('cat-news-notion-config', JSON.stringify(this.config));
      this.updateUI();
      close();
      showToast('Notion 配置已保存 ✓');
      this.testConnection(true);
    };
  },
};

/* 初始化云同步 */
CloudSync.init();

/* 初始化 Notion 同步 */
NotionSync.init();

/* 包装 store.save 以支持自动同步 */
const _origSave = store.save.bind(store);
store.save = function(){
  _origSave();
  if(CloudSync.config?.autoSync && CloudSync.supabase){
    debounce(() => CloudSync.autoSync(), 2000);
  }
};

function debounce(fn, ms){
  clearTimeout(fn._t);
  fn._t = setTimeout(() => fn(), ms);
}
</script>
