<style>
  /* ============================================================
     THEME TOKENS — Minimal Dashboard Design System
     主色: #2563ef (brand blue), 无阴影, 边框对比, 紧凑专业
     ============================================================ */
  :root {
    /* ---- 页面与表面 ---- */
    --page-bg: #ffffff;

    /* ---- 边框 ---- */

    /* ---- 模块色 — 统一只用灰蓝色系！ ---- */
    --module-1: #475569;

    --module-4: #475569;
    --module-5: #475569;

    /* ---- 状态色 ---- */
    --danger: #ef4444;
    --danger-muted: #fef2f2;
    --success: #10b981;
    --warning: #f59e0b;

    /* ---- 抽屉/侧栏 ---- */
    --drawer-bg: #f9fafb;
    --drawer-bg-top: #f9fafb;
    --drawer-text: #111827;

    --radius-lg: 16px;
    --radius-sheet: 20px;

    /* ---- 阴影 — 全部去掉！ ---- */
    --shadow-card: none;

    /* ---- 字体与布局 ---- */
    --font: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-mono: 'JetBrains Mono', "SF Mono", Menlo, Consolas, monospace;
    --sidebar-w: 240px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--page-bg); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.5;

  }
  svg { display: block; }

  .sidebar .brand { padding: 24px 20px 20px; display: flex; align-items: center; gap: 12px; }
  .sidebar .brand .ava { position: relative; width: 40px; height: 40px; border-radius: var(--radius-control); overflow: hidden; flex: 0 0 auto;
    background: var(--surface-card); border:1px solid var(--border); cursor: pointer; }

    background: rgba(0,0,0,.4); color: white; transition: opacity .15s; }

  .sidebar .brand h1 { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
  .sidebar .brand p { font-size: 11px; color:var(--text-tertiary); margin-top: 2px; font-weight:500; }

  .sidebar .nav::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .navi { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: var(--radius-control); cursor: pointer;

    background: var(--surface-card); border:1px solid var(--border); border-radius:999px; padding:8px 15px; box-shadow: var(--shadow-card); }
  .date-chip svg { color: var(--text-tertiary); }

  /* ---------- hero banner (顶部问候区) ---------- */
  .hero-banner { position: relative; overflow: hidden; border-radius: var(--radius-card); border: 1px solid var(--border);
    min-height: 160px; display: flex; flex-direction: column; justify-content: center;
    padding: 28px 32px; margin-bottom: 20px; background: var(--surface-card); }
  .hero-banner::before { display:none; }
  .hero-banner > * { position: relative; z-index: 1; }
  .hero-banner .hi { font-size: 28px; font-weight: 600; letter-spacing: -.02em; }
  .hero-banner .sub { color: var(--text-secondary); font-size: 14px; margin-top: 6px; max-width: 460px; line-height:1.5; font-weight:500; }
  .hero-banner .hstats { display: flex; gap: 24px; margin-top: 18px; }
  .hero-banner .hstat { display: flex; flex-direction: column; gap: 2px; }
  .hero-banner .hstat .n { font-size: 20px; font-weight: 600; letter-spacing: -.01em; font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
  .hero-banner .hstat .t { font-size: 12px; color: var(--text-secondary); font-weight:500; }
  .hero-banner .hstat + .hstat { padding-left: 24px; border-left: 1px solid var(--border); }
  .hero-banner .htop { position: absolute; top: 20px; right: 24px; z-index: 2; display: flex; gap: 10px; align-items: center; }

  .card { background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-card); box-shadow: var(--shadow-card); }
  .sec-title { display:flex; align-items:center; gap:9px; font-size:14px; font-weight:600; margin: 18px 2px 10px; letter-spacing: -.01em; }

  /* ---------- dashboard grid ---------- */
  .grid { display: grid; gap: 16px; }
  .g-4 { grid-template-columns: repeat(4, 1fr); }
  .g-3 { grid-template-columns: repeat(3, 1fr); }
  .g-2 { grid-template-columns: repeat(2, 1fr); }
  .g-main { grid-template-columns: 1.55fr 1fr; align-items: start; }

  /* 各模块概况卡片 */
  .modcard-grid { display:grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .modcard { background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-card);
    padding: 15px 16px; cursor: pointer; transition: border-color .12s; }
  .modcard:hover { border-color: var(--border-input); }
  .modcard .mc-head { display:flex; align-items:center; gap: 11px; }
  .modcard .mc-ic { width: 36px; height: 36px; border-radius: 10px; display:grid; place-items:center; flex:0 0 auto; }
  .modcard .mc-tt { flex:1; min-width:0; }
  .modcard .mc-name { font-size: 14.5px; font-weight: 800; letter-spacing: -.01em; }
  .modcard .mc-desc { font-size: 11.5px; color: var(--text-secondary); margin-top: 1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .modcard .mc-arw { color: var(--text-tertiary); flex:0 0 auto; }
  .modcard .mc-body { display:flex; align-items:baseline; gap: 8px; margin-top: 11px; }
  .modcard .mc-main { font-size: 15px; font-weight: 800; letter-spacing: -.01em; }
  .modcard .mc-extra { font-size: 12px; color: var(--text-secondary); }

  /* quote banner */
  .quote { padding: 22px 26px; border-radius: var(--radius-card); position: relative; overflow: hidden;
    background: var(--surface-card); border: 1px solid var(--border); box-shadow: var(--shadow-card); }
  .quote::before { content:""; position:absolute; left:0; top:18px; bottom:18px; width:3px; border-radius:2px; background: var(--accent); }
  .quote .tag { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; color:var(--text-secondary);
    letter-spacing:.04em; margin-bottom:11px; }
  .quote .tag svg { color: var(--text-tertiary); }
  .quote .txt { font-size:20px; font-weight:700; color:var(--text); letter-spacing:-.01em; line-height:1.5; }

  /* overview rings */
  .rings { display:grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap:0; }
  .ring { display:flex; flex-direction:column; align-items:center; gap:6px; padding:14px 4px; cursor:pointer; min-width:0;
    border-radius: var(--radius-card); transition: background .15s; }
  .ring:hover { background: var(--surface-nested); }
  .ring .dial { position:relative; width:96px; height:96px; }

  .ring .pct { font-size:20px; font-weight:600; letter-spacing:-.02em; color:var(--text); }
  .ring .lbl { font-size:14px; font-weight:700; color:var(--text); }
  .ring .sub { font-size:11px; color:var(--text-secondary); }

  /* quick add */
  .quick-grid { display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:10px; }
  .qbtn { display:flex; align-items:center; gap:12px; padding:14px 15px; border:none; cursor:pointer; border-radius:var(--radius-tile);
    background:var(--surface-card); border:1px solid var(--border); box-shadow: var(--shadow-card); text-align:left; transition: all .15s; min-width:0; }
  .qbtn:hover { border-color:var(--border-input); }

  .qbtn .e .qplus { position:absolute; right:-3px; bottom:-3px; width:17px; height:17px; border-radius:50%;
    background: var(--accent); color:var(--on-accent); display:grid; place-items:center; border: 2px solid var(--surface-card); }
  .qbtn .l { font-size:13.5px; font-weight:700; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .panel { background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-card); box-shadow: var(--shadow-card); padding:18px; }

  .panel .ph svg { color: var(--text-tertiary); }
  .panel .ph .avg { margin-left:auto; font-size:12px; color:var(--text-secondary); font-weight:500; }
  .trend-svg { width:100%; height:auto; margin-top:14px; display:block; }

  .trend-empty { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; height: 168px;
    color: var(--text-tertiary); font-size: 13px; margin-top: 8px; }

  /* ---------- pinned tasks ---------- */
  .pin-list { display:grid; grid-template-columns: repeat(3, 1fr); gap: 12px; align-items:start; }
  .pin-list .ielts-tile { grid-column: 1 / -1; }
  .pin { display:flex; align-items:center; gap: 13px; padding: 15px 16px; border-radius: var(--radius-tile);
    background: var(--surface-card); border: 1px solid var(--border); box-shadow: var(--shadow-card); transition: box-shadow .15s, transform .12s; }
  .pin:hover { border-color:var(--border-input); }
  .pin-ic { width: 38px; height: 38px; border-radius: 11px; display:grid; place-items:center; flex:0 0 auto;
    background: var(--surface-nested); border: 1px solid var(--border); }
  .pin-b { flex:1; min-width:0; cursor:pointer; }
  .pin-t { font-size: 14.5px; font-weight: 700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pin-t.done { text-decoration: line-through; color: var(--text-secondary); }
  .pin-m { font-size: 12px; color: var(--text-secondary); margin-top: 3px; }
  .pin-chk { flex:0 0 auto; width: 26px; height: 26px; border-radius: 8px; border: 1.6px solid var(--border-input);
    display:grid; place-items:center; cursor:pointer; background:var(--surface-card); color:var(--on-accent); transition: all .15s; }
  .pin-chk.on { background: var(--module-1); border-color: var(--module-1); }
  .pin-chk svg { opacity: 0; }
  .pin-chk.on svg { opacity: 1; }
  .pin-step { flex:0 0 auto; display:flex; gap: 7px; }
  .pin-step button { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border-input);

  .pin-step button:hover { background: var(--accent-muted); border-color: var(--accent); }
  .pin-empty { grid-column: 1 / -1; padding: 26px 20px; text-align:center; color: var(--text-secondary); font-size: 13px; line-height: 1.7;
    background: var(--surface-card); border: 1px dashed var(--border-input); border-radius: var(--radius-tile); }
  .pin-empty .mini-star { display:inline-flex; vertical-align:-2px; color: var(--module-3); }

  /* ---------- toolbar in module view ---------- */
  .toolbar { display:flex; align-items:center; gap:10px; margin: 14px 0 12px; }
  .btn { background:var(--accent); color:#fff; border:1px solid var(--accent); border-radius:var(--radius-control); padding:8px 16px; font-size:13px; cursor:pointer;

  .search-box input { padding-left:34px; }

  .hero { display:flex; align-items:center; gap: 13px; padding: 12px 16px; border-radius: var(--radius-tile);
    background: var(--surface-card); border: 1px solid var(--border); box-shadow: var(--shadow-card); margin-bottom: 4px; position:relative; overflow:hidden; }
  .hero.has-cover { padding: 0; min-height: 96px; }

  /* ---- layout variants (open-ended: add .rec-layout-xxx in <style> to extend) ---- */

  .rec.rec-layout-feature .thumb { width:100%; height:160px; border-radius:0; margin:0; }

  /* module two-column layout: 左记录 / 右统计侧栏 */
  .mod-layout { display:grid; grid-template-columns: 1fr 300px; gap: 16px; align-items: start; margin-top: 14px; }
  .mod-side { display:flex; flex-direction:column; gap: 12px; position: sticky; top: 16px; }

  .stat-row .k .kd { width:8px; height:8px; border-radius:50%; flex:0 0 auto; }
  .stat-row .val { font-size:14px; font-weight:600; letter-spacing:-.01em; }
  /* 分类占比条 */
  .catbar { margin-top:4px; }
  .catbar .cbrow { display:flex; align-items:center; gap:9px; padding:7px 0; }
  .catbar .cbrow .cbn { font-size:12.5px; color:var(--text); width:52px; flex:0 0 auto; }
  .catbar .cbrow .cbt { flex:1; height:8px; border-radius:999px; background:var(--border); overflow:hidden; }
  .catbar .cbrow .cbt i { display:block; height:100%; border-radius:999px; }
  .catbar .cbrow .cbv { font-size:12px; color:var(--text-secondary); width:56px; text-align:right; flex:0 0 auto; }
  /* 大环形（进度/打卡侧栏） */
  .side-ring { display:flex; flex-direction:column; align-items:center; gap:10px; padding:6px 0 2px; }
  .side-ring .dial { position:relative; width:150px; height:150px; }
  .side-ring .dial svg.gauge { transform: rotate(-90deg); width:100%; height:100%; }
  .side-ring .dial .mid { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; }
  .side-ring .big { font-size:32px; font-weight:600; letter-spacing:-.02em; line-height:1; }
  .side-ring .cap { font-size:13px; color:var(--text-secondary); margin-top:2px; }

  /* finance summary minis */
  .mod-summary { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom: 4px; }
  .mini { background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-tile); box-shadow:var(--shadow-card); padding:12px 14px; }
  .mini .l { font-size:12px; color:var(--text-secondary); }
  .mini .v { font-size:19px; font-weight:600; margin-top:3px; letter-spacing:-.02em; }

  /* record list — 行式列表 */
  .rec-grid { display:flex; flex-direction:column; gap:9px; }
  .rec { position:relative; background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-tile); box-shadow:var(--shadow-card); padding:14px 16px; transition: border-color .12s, box-shadow .15s; }
  .rec:hover { border-color: var(--border-input); }
  .rec .top { display:flex; align-items:center; gap:12px; }
  .rec .chk { flex:0 0 auto; width:18px; height:18px; border-radius:var(--radius-sm); border:1.5px solid var(--border-input); display:grid; place-items:center;
    cursor:pointer; background:var(--surface-card); color:#fff; transition: all .12s; }
  .rec .chk.on { background:var(--accent); border-color:var(--accent); }
  .rec .chk svg { opacity:0; } .rec .chk.on svg { opacity:1; }
  .rec .body { flex:1; min-width:0; cursor:pointer; display:flex; align-items:center; gap:11px; flex-wrap:wrap; }
  .rec .rname { font-weight:700; font-size:14.5px; letter-spacing:-.01em; flex:0 1 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%; }
  .rec .rname.done { text-decoration:line-through; color:var(--text-secondary); }
  .rec .rmeta { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .rec .rnote { flex:1 0 100%; color:var(--text-secondary); font-size:12.5px; margin-top:5px; white-space:pre-wrap; line-height:1.5;
    overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .badge { display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:999px; font-size:11.5px; font-weight:700; }
  .badge .dot { width:6px; height:6px; border-radius:50%; background:currentColor; }
  .rec .acts { position:absolute; top:50%; right:8px; transform:translateY(-50%); display:flex; gap:1px; opacity:0; transition: opacity .15s; background:var(--surface-card); }
  .rec:hover .acts { opacity:1; }
  .rec .acts button { border:none; background:transparent; color:var(--text-tertiary); cursor:pointer;
    width:28px; height:28px; border-radius:7px; display:grid; place-items:center; transition: all .15s; }
  .rec .pin-btn:hover { background:var(--surface-nested); color:var(--module-3); }
  .rec .pin-btn.on { color:var(--module-3); opacity:1; } .rec .pin-btn.on svg { fill: var(--module-3); }
  .rec:has(.pin-btn.on) .acts { opacity:1; }
  .rec .del:hover { background:var(--danger-muted); color:var(--danger); }
  .rec .pbar { flex:1; min-width:80px; height:6px; border-radius:999px; background:var(--border); overflow:hidden; }
  .rec .pbar i { display:block; height:100%; border-radius:999px; }
  .rec .amt { font-size:15px; font-weight:600; letter-spacing:-.02em; white-space:nowrap; margin-left:auto; }
  .rec .amt.exp { color:var(--danger); } .rec .amt.inc { color:var(--module-1); }
  .rec .streak { font-size:11.5px; color:var(--module-3); font-weight:700; display:inline-flex; align-items:center; gap:4px; }
  .rec .rdate { color:var(--text-secondary); font-size:11.5px; margin-left:auto; white-space:nowrap; }
  .empty { text-align:center; color:var(--text-secondary); padding:50px 20px; }
  .empty .e { display:inline-grid; place-items:center; width:56px; height:56px; border-radius:16px; background:var(--surface-card); border:1px solid var(--border); color:var(--text-tertiary); margin-bottom:12px; }

  /* ---------- modal ---------- */
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:60;
    display:flex; align-items:center; justify-content:center; animation: fade .15s ease; }
  @keyframes fade { from { opacity:0; } }
  .modal { background:var(--surface-card); border-radius:var(--radius-card); padding:24px; width:460px; max-width:92vw; max-height:90vh; overflow-y:auto;
    border:1px solid var(--border); animation: pop .15s ease; }
  @keyframes pop { from { transform: translateY(8px); opacity:0; } }
  .modal h3 { font-size:18px; font-weight:600; letter-spacing:-.01em; }
  .modal .sub { color:var(--text-secondary); font-size:13px; margin:4px 0 18px; font-weight:500; }
  .field { margin-bottom:14px; }
  .field label { display:block; color:var(--text-secondary); font-size:12px; font-weight:500; margin-bottom:6px; }
  .frow { display:flex; gap:12px; } .frow .field { flex:1; }
  .seg { display:flex; gap:8px; flex-wrap:wrap; }
  .seg .opt { flex:1; min-width:64px; text-align:center; padding:8px 10px; border-radius:var(--radius-control); border:1px solid var(--border);
    cursor:pointer; font-size:13px; font-weight:500; color:var(--text-secondary); transition: all .12s; }
  .seg .opt.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .modal-actions { display:flex; align-items:center; gap:8px; margin-top:20px; }
  .link-danger { color:var(--danger); background:none; border:none; font-size:13px; font-weight:500; cursor:pointer; padding:8px 10px; border-radius:var(--radius-control); }
  .link-danger:hover { background:var(--danger-muted); }

  /* ============================================================
     BENTO DASHBOARD — 首页复杂网格布局（墨色中性 · 高密度）
     ============================================================ */
  .bento { display:grid; grid-template-columns: repeat(12, 1fr); gap:16px; align-items:stretch; }
  .bento > * { min-width:0; }   /* 允许网格轨道收窄，避免窄屏内容溢出 */
  .b3{grid-column:span 3} .b4{grid-column:span 4} .b5{grid-column:span 5}
  .b6{grid-column:span 6} .b7{grid-column:span 7} .b8{grid-column:span 8} .b12{grid-column:span 12}

  /* 分组标题（EN 副标题 + 中文标题 + 分隔线） */
  .sec-grp { display:flex; align-items:center; gap:12px; margin:26px 2px 14px; }
  .sec-grp .bar { width:4px; height:19px; border-radius:2px; background:var(--accent); flex:0 0 auto; }
  .sec-grp .zh { font-size:16px; font-weight:600; letter-spacing:-.02em; }
  .sec-grp .en { font-size:10.5px; font-weight:600; letter-spacing:.15em; color:var(--text-tertiary); }
  .sec-grp .line { flex:1; height:1px; background:var(--border); }

  /* 通用瓷砖 - Minimal Dashboard */
  .tile { background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-card);
    padding:20px; display:flex; flex-direction:column; transition:border-color .15s ease; }
  .tile:hover { border-color:var(--border-input); }
  .tile-h { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .tile-h .tic { color:var(--accent); display:flex; width:32px; height:32px; align-items:center; justify-content:center; background:var(--accent-muted); border-radius:var(--radius-control); }
  .tile-h .en { font-size:10px; font-weight:600; letter-spacing:.08em; color:var(--text-tertiary); line-height:1; text-transform:uppercase; }
  .tile-h .zh { font-size:15px; font-weight:600; line-height:1.2; color:var(--text); }
  .tile-h .tt { display:flex; flex-direction:column; gap:2px; }
  .tile-h .r { margin-left:auto; font-size:12px; color:var(--text-secondary); font-weight:500; font-family:var(--font-mono); }

  /* 整体情况瓷砖 - Minimal */
  .ov2-body { display:grid; grid-template-columns:1fr 300px; gap:20px; flex:1; align-items:stretch; }
  .ov2-body .rings { align-content:center; }
  .ov2-side { position:relative; overflow:hidden; border-radius:var(--radius-card);
    background:var(--surface-nested); border:1px solid var(--border);
    padding:20px; display:flex; flex-direction:column; justify-content:space-between; gap:12px; }
  .ov2-side::before, .ov2-side::after { display:none; }
  .ov2-stat { position:relative; z-index:1; display:flex; align-items:center; gap:12px; cursor:pointer;
    padding:10px 4px; border-radius:var(--radius-control); transition:background .15s; }
  .ov2-stat:hover { background:var(--surface-card); }
  .ov2-stat + .ov2-stat { border-top:1px solid var(--border); }
  .ov2-stat .s-ic { width:36px; height:36px; border-radius:var(--radius-control); display:grid; place-items:center; flex:0 0 auto;
    background:var(--surface-card); color:var(--accent); border:1px solid var(--border); }
  .ov2-stat .s-tx { min-width:0; }
  .ov2-stat .s-v { font-size:20px; font-weight:600; letter-spacing:-.01em; line-height:1.1; color:var(--text);
    font-variant-numeric:tabular-nums; font-family:var(--font-mono); }
  .ov2-stat .s-l { font-size:11.5px; color:var(--text-secondary); margin-top:2px; font-weight:500; }

  /* 大时钟卡 - Minimal */
  .clock-card { position:relative; overflow:hidden; border-radius:var(--radius-card);
    background:var(--surface-card); border:1px solid var(--border); color:var(--text);
    padding:24px; display:flex; flex-direction:column; justify-content:space-between; min-height:180px; }
  .clock-card::before, .clock-card::after { display:none; }
  .clock-card > * { position:relative; z-index:1; }
  .clock-card .hi { font-size:22px; font-weight:600; letter-spacing:-.01em; }
  .clock-card .sub { font-size:12.5px; color:var(--text-secondary); margin-top:4px; max-width:230px; line-height:1.5; font-weight:500; }
  .clock-card .clk { font-size:clamp(36px,4.2vw,48px); font-weight:600; letter-spacing:-.02em; font-variant-numeric:tabular-nums; line-height:1; font-family:var(--font-mono); color:var(--text); }
  .clock-card .cmeta { display:flex; align-items:center; gap:10px; margin-top:8px; font-size:12px; color:var(--text-secondary); font-weight:500; }
  .clock-card .cmeta .dot { width:4px; height:4px; border-radius:50%; background:var(--accent); }

  /* 焦点/统计瓷砖 */
  .focus-list { display:flex; flex-direction:column; gap:9px; }
  .focus-row { display:flex; align-items:center; gap:11px; }
  .focus-row .fic { width:30px; height:30px; border-radius:9px; display:grid; place-items:center; flex:0 0 auto;
    background:var(--surface-nested); border:1px solid var(--border); }
  .focus-row .ft { flex:1; min-width:0; cursor:pointer; }
  .focus-row .fn { font-size:13.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .focus-row .fn.done { text-decoration:line-through; color:var(--text-secondary); }
  .focus-row .fm { font-size:11px; color:var(--text-secondary); margin-top:2px; }
  .focus-empty { color:var(--text-secondary); font-size:12.5px; line-height:1.7; padding:6px 0; }
  .stat-big { font-size:32px; font-weight:600; letter-spacing:-.02em; line-height:1; font-family:var(--font-mono); font-variant-numeric:tabular-nums; color:var(--text); }
  .stat-big small { font-size:14px; color:var(--text-secondary); font-weight:500; letter-spacing:0; font-family:var(--font); }
  .stat-cap { font-size:12px; color:var(--text-secondary); margin-top:7px; font-weight:500; }
  .prog-line { height:6px; border-radius:999px; background:var(--surface-nested); overflow:hidden; margin-top:auto; }
  .prog-line i { display:block; height:100%; border-radius:999px; background:var(--accent); }

  /* 习惯追踪周网格表 */
  .habit-tb { width:100%; border-collapse:collapse; }
  .habit-tb th { font-size:10.5px; font-weight:700; color:var(--text-tertiary); padding:0 0 9px; text-align:center; }
  .habit-tb th.hh { text-align:left; }
  .habit-tb th.hr { text-align:right; }
  .habit-tb td { padding:5px 0; text-align:center; vertical-align:middle; }
  .habit-tb td.hn { text-align:left; font-size:12.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:118px; }
  .habit-tb td.hn .hdot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:7px; vertical-align:middle; }
  .habit-tb td.hrate { text-align:right; font-size:12.5px; font-weight:600; letter-spacing:-.02em; }
  .hcell { display:inline-grid; place-items:center; width:22px; height:22px; border-radius:7px; color:var(--on-accent); cursor:pointer; transition:transform .12s; }
  .hcell:hover { transform:scale(1.12); }
  .hcell.on { background:var(--module-1); }
  .hcell.off { background:var(--surface-nested); border:1px solid var(--border); }
  .hcell svg { opacity:0; } .hcell.on svg { opacity:1; }
  .habit-tb .tdcol { background:var(--accent-muted); }
  .habit-tb col.todaycol { background:var(--accent-muted); }

  /* 待办清单（仪表盘式） */
  .tk-head { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .tk-head .pct { font-size:22px; font-weight:600; letter-spacing:-.03em; }
  .tk-head .cnt { font-size:12px; color:var(--text-secondary); font-weight:700; }
  .tk-head .bar { flex:1; height:6px; border-radius:999px; background:var(--border); overflow:hidden; }
  .tk-head .bar i { display:block; height:100%; border-radius:999px; background:var(--accent); }
  .tk-list { display:flex; flex-direction:column; }
  .tk-row { display:flex; align-items:center; gap:11px; padding:8px 0; border-bottom:1px solid var(--border); }
  .tk-row:last-child { border-bottom:none; }
  .tk-chk { flex:0 0 auto; width:18px; height:18px; border-radius:var(--radius-sm); border:1.5px solid var(--border-input);
    display:grid; place-items:center; cursor:pointer; background:var(--surface-card); color:#fff; transition:all .15s; }
  .tk-chk:hover { border-color:var(--accent); }
  .tk-chk.on { background:var(--accent); border-color:var(--accent); }
  .tk-chk svg { opacity:0; } .tk-chk.on svg { opacity:1; }
  .tk-name { flex:1; min-width:0; font-size:13.5px; font-weight:600; cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tk-name.done { text-decoration:line-through; color:var(--text-secondary); }

  /* 番茄钟 - Minimal */
  .pomo { position:relative; overflow:hidden; border-radius:var(--radius-card); text-align:center;
    background:var(--surface-card); border:1px solid var(--border); color:var(--text); padding:20px;
    display:flex; flex-direction:column; }
  .pomo::before { display:none; }
  .pomo > * { position:relative; z-index:1; }
  .pomo .pen { font-size:10px; font-weight:600; letter-spacing:.1em; color:var(--text-tertiary); text-transform:uppercase; }
  .pomo .pzh { font-size:14px; font-weight:600; margin-top:2px; color:var(--text); }
  .pomo .ring-wrap { position:relative; width:140px; height:140px; margin:12px auto 10px; }
  .pomo .ring-wrap svg { transform:rotate(-90deg); }
  .pomo .ptime { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
  .pomo .ptime .t { font-size:30px; font-weight:600; font-variant-numeric:tabular-nums; font-family:var(--font-mono); letter-spacing:-.01em; }
  .pomo .ptime .s { font-size:11px; color:var(--text-secondary); font-weight:500; }
  .pomo .pctl { display:flex; gap:8px; justify-content:center; margin-bottom:12px; }
  .pomo .pctl button { border:1px solid var(--border); background:var(--surface-card); color:var(--text);
    border-radius:var(--radius-control); padding:8px 16px; font-size:13px; font-weight:500; cursor:pointer; transition:all .15s; font-family:var(--font); }
  .pomo .pctl button:hover { border-color:var(--border-input); background:var(--surface-nested); }
  .pomo .pctl button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .pomo .pctl button.primary:hover { background:var(--brand-700); }
  .pomo .pstats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .pomo .pstats .ps { background:var(--surface-nested); border-radius:var(--radius-control); padding:8px 4px; border:1px solid var(--border); }
  .pomo .pstats .pv { font-size:17px; font-weight:600; letter-spacing:-.01em; font-family:var(--font-mono); color:var(--text); }
  .pomo .pstats .pl { font-size:10.5px; color:var(--text-tertiary); margin-top:2px; font-weight:500; }

  /* 在读好书 */
  .book-list { display:flex; flex-direction:column; gap:12px; }
  .book-row { display:flex; align-items:center; gap:12px; cursor:pointer; }
  .book-row .spine { width:34px; height:46px; border-radius:5px; flex:0 0 auto; position:relative; box-shadow:var(--shadow-card);
    display:grid; place-items:center; color:var(--on-accent); }
  .book-row .spine::after { content:""; position:absolute; left:4px; top:4px; bottom:4px; width:2px; border-radius:2px; background:rgba(255,255,255,.35); }
  .book-row .bmid { flex:1; min-width:0; }
  .book-row .btt { font-size:13.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .book-row .bsub { font-size:11px; color:var(--text-secondary); margin-top:3px; }
  .book-row .bbar { height:5px; border-radius:999px; background:var(--border); overflow:hidden; margin-top:7px; }
  .book-row .bbar i { display:block; height:100%; border-radius:999px; }
  .book-row .bpct { font-size:14px; font-weight:600; letter-spacing:-.02em; flex:0 0 auto; }

  /* 本周目标 / 通用目标条 */
  .goal-list { display:flex; flex-direction:column; gap:13px; }
  .goal-row .gt { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; margin-bottom:7px; }
  .goal-row .gt .gp { margin-left:auto; font-size:12.5px; font-weight:600; color:var(--text-secondary); letter-spacing:-.02em; }
  .goal-row .gt .gdone { color:var(--module-1); display:flex; }
  .goal-row .gbar { height:7px; border-radius:999px; background:var(--border); overflow:hidden; }
  .goal-row .gbar i { display:block; height:100%; border-radius:999px; }

  /* 月度开销 */
  .spend-sum { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  .spend-total { font-size:26px; font-weight:600; letter-spacing:-.03em; }
  .spend-cap { font-size:11.5px; color:var(--text-secondary); }

  .hidden { display:none !important; }

  /* ---------- PWA & Sync toolbar ---------- */
  .sync-toolbar { display:flex; align-items:center; gap:6px; padding:10px 14px; margin-top:14px;
    border-top:1px solid var(--border); border-bottom:1px solid var(--border); }
  .sync-toolbar .st-label { font-size:12px; font-weight:700; color:var(--text-secondary); letter-spacing:.04em; }
  .sync-toolbar .st-spacer { flex:1; }
  .sync-btn { display:inline-flex; align-items:center; gap:5px; padding:6px 12px; font-size:12px; font-weight:600;
    border-radius:8px; border:1px solid var(--border-input); background:var(--surface-card); color:var(--text);
    cursor:pointer; transition:all .12s; }
  .sync-btn:hover { background:var(--accent-muted); border-color:var(--accent); color:var(--accent); }
  .sync-btn svg { width:15px; height:15px; }
  .sync-toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:100;
    background:var(--accent); color:var(--on-accent); padding:10px 20px; border-radius:10px;
    font-size:13px; font-weight:600; box-shadow:0 8px 20px rgba(0,0,0,.2);
    animation: toastIn .25s ease; }
  .sync-toast.error { background:var(--danger); }
  .sync-toast.warn { background:var(--module-2); }
  @keyframes toastIn { from { opacity:0; transform:translateX(-50%) translateY(10px); } }
  .sidebar .sync-bar { display:flex; gap:6px; padding:10px 14px; border-top:1px solid var(--drawer-hover); }
  .sidebar .sync-bar .sync-btn { flex:1; justify-content:center; padding:7px 10px; font-size:11.5px;
    background:var(--drawer-hover); border-color:var(--drawer-active); color:var(--drawer-text); }
  .sidebar .sync-bar .sync-btn:hover { background:var(--drawer-active); color:var(--drawer-text); }

  /* ---------- Cloud Sync ---------- */
  .cloud-bar { padding: 10px 14px; }
  .cloud-bar .cb-status { display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--drawer-text-mute); margin-bottom:8px; }
  .cloud-bar .cb-dot { width:7px; height:7px; border-radius:50%; background:var(--drawer-text-mute); }
  .cloud-bar .cb-dot.online { background:#4ade80; box-shadow:0 0 6px #4ade80; }
  .cloud-bar .cb-dot.syncing { background:#facc15; animation:pulse 1s infinite; }
  @keyframes pulse { 50% { opacity:.4; } }
  .cloud-bar .cb-row { display:flex; gap:6px; }
  .cloud-bar .cb-btn { flex:1; display:flex; align-items:center; justify-content:center; gap:4px;
    padding:7px 8px; font-size:11px; font-weight:600;
    background:var(--drawer-hover); border:1px solid var(--drawer-active); color:var(--drawer-text);
    border-radius:8px; cursor:pointer; transition:all .12s; }
  .cloud-bar .cb-btn:hover { background:var(--drawer-active); }
  .cloud-bar .cb-btn:disabled { opacity:.5; cursor:not-allowed; }
  .cloud-bar .cb-btn svg { width:13px; height:13px; }
  .cloud-bar .cb-logo { font-size:10px; color:var(--drawer-text-mute); text-align:center; margin-top:6px; }
  .notion-bar { padding: 10px 14px; border-top:1px solid var(--drawer-hover); }
  .notion-bar .nb-header { display:flex; align-items:center; gap:7px; margin-bottom:5px; }
  .notion-bar .nb-icon { display:flex; align-items:center; color:var(--drawer-text-mute); }
  .notion-bar .nb-icon svg { width:13px; height:13px; }
  .notion-bar .nb-title { font-size:11.5px; font-weight:600; color:var(--drawer-text); flex:1; }

const AP_MAT_CYCLE = ["未提交","进行中","已提交","不适用"];
function cycleMaterial(m){
  const i = AP_MAT_CYCLE.indexOf(m.state);
  m.state = AP_MAT_CYCLE[(i+1) % AP_MAT_CYCLE.length];
  persist();
}

function editTimelineNode(n){
  const statusByKey = {
    school:["未开始","进行中","已确认"],
    docs:["未开始","撰写中","已提交"],
    apply:["未开始","已提交","已付费"],
    interview:["未开始","已邀约","已完成"],
    visa:["未开始","材料准备中","已递交"],
  };
  const opts = statusByKey[n.key] || ["未开始","进行中","已完成"];
  const overlay = document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML = `<div class="modal"><h3>编辑 · ${esc(n.name)}</h3>
    <div class="field"><label>状态</label><div class="seg" id="ap-tl-status">${opts.map(s=>`<div class="opt ${s===n.status?'on':''}" data-v="${s}">${s}</div>`).join("")}</div></div>
    <div class="field"><label>${n.date!==undefined&&n.date!==""?"日期":"截止日期"}</label><input id="ap-tl-due" type="date" value="${n.date||n.due||isoToday()}"/></div>
    <div class="field"><label>备注</label><textarea id="ap-tl-note" placeholder="补充信息">${esc(n.note||'')}</textarea></div>
    <div class="modal-actions"><div class="spacer"></div>
      <button class="btn ghost" id="m-cancel">取消</button><button class="btn" id="m-save">保存</button></div></div>`;
  document.body.appendChild(overlay);
  const close = ()=>overlay.remove();
  overlay.onclick = e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#m-cancel").onclick = close;
  overlay.querySelector(".seg").querySelectorAll(".opt").forEach(o=>o.onclick=()=>{
    overlay.querySelector(".seg").querySelectorAll(".opt").forEach(x=>x.classList.remove("on"));
    o.classList.add("on");
  });
  overlay.querySelector("#m-save").onclick = ()=>{
    const seg = id => { const el = overlay.querySelector(id+" .on"); return el?el.dataset.v:undefined; };
    const val = id => { const el = overlay.querySelector(id); return el?el.value:""; };
    n.status = seg("#ap-tl-status") || n.status;
    if(n.date!==undefined) n.date = val("#ap-tl-due");
    else n.due = val("#ap-tl-due");
    n.note = (val("#ap-tl-note")||"").trim();
    persist(); close();
  };
}

function openScoreEditor(){
  const overlay = document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML = `<div class="modal"><h3>添加雅思分数</h3>
    <div class="field"><label>考试日期</label><input id="ap-s-date" type="month" value="${isoToday().slice(0,7)}"/></div>
    <div class="frow">
      <div class="field"><label>听力</label><input id="ap-s-l" type="number" min="0" max="9" step="0.5" placeholder="0-9"/></div>
      <div class="field"><label>阅读</label><input id="ap-s-r" type="number" min="0" max="9" step="0.5" placeholder="0-9"/></div>
    </div>
    <div class="frow">
      <div class="field"><label>写作</label><input id="ap-s-w" type="number" min="0" max="9" step="0.5" placeholder="0-9"/></div>
      <div class="field"><label>口语</label><input id="ap-s-s" type="number" min="0" max="9" step="0.5" placeholder="0-9"/></div>
    </div>
    <div class="modal-actions"><div class="spacer"></div>
      <button class="btn ghost" id="m-cancel">取消</button><button class="btn" id="m-save">保存</button></div></div>`;
  document.body.appendChild(overlay);
  const close = ()=>overlay.remove();
  overlay.onclick = e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#m-cancel").onclick = close;
  overlay.querySelector("#m-save").onclick = ()=>{
    const num = id => { const el = overlay.querySelector(id); return el&&el.value!==""?Number(el.value):null; };
    const l=num("#ap-s-l"), r=num("#ap-s-r"), w=num("#ap-s-w"), sp=num("#ap-s-s");
    if(l===null||r===null||w===null||sp===null){ showToast("请填写四科分数","warn"); return; }
    const total = +(((l+r+w+sp)/4).toFixed(1));
    const month = overlay.querySelector("#ap-s-date").value;
    const ap = data.__application;
    const exists = ap.scores.find(s=>s.date===month);
    if(exists){ exists.listening=l; exists.reading=r; exists.writing=w; exists.speaking=sp; exists.total=total; }
    else { ap.scores.push({ date:month, listening:l, reading:r, writing:w, speaking:sp, total }); ap.scores.sort((a,b)=>a.date<b.date?-1:1); }
    persist(); close();
    showToast("分数已记录","ok");
  };
}

    return `<div title="${d}${act?"：有案例产出":""}" style="aspect-ratio:1;border-radius:3px;background:${levelColor(lvl)};"></div>`;
  }).join("");
  const heatActive = days.filter(d=>caseDates.has(d)).length;

  const allCases = data.product_cases||[];
  const caseCard = c => `<div style="padding:10px 12px;border-radius:var(--radius-control);border:1px solid var(--border);background:var(--surface-card);margin-bottom:8px;">

function openCaseEditor(id){
  const cases = (data.product_cases = data.product_cases || []);
  const isNew = id === undefined || id === null;
  const c = isNew ? null : cases.find(x=>x.id === id);
  if(!isNew && !c) return;
  const target = isNew
    ? { tag:"产品分析", date: today(), title:"", insight:"", prd_content:"" }
    : { tag:c.tag||"产品分析", date:c.date||today(), title:c.title||"", insight:c.insight||c.note||"", prd_content:c.prd_content||"" };
  const tags = ["产品分析","AI 产品","社交","电商","效率工具","其他"];
  const overlay = document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML = `<div class="modal" style="width:540px;max-width:94vw;"><h3>${isNew?"新增产品案例":"编辑 · "+esc(target.title)}</h3>
    <div class="field"><label>案例标题</label><input id="ce-title" placeholder="如：抖音评论区设计分析" value="${esc(target.title)}"/></div>
    <div class="frow">
      <div class="field"><label>标签</label><input id="ce-tag" list="ce-tags" value="${esc(target.tag)}"/><datalist id="ce-tags">${tags.map(t=>`<option value="${t}">`).join("")}</datalist></div>
      <div class="field"><label>日期</label><input id="ce-date" type="date" value="${target.date}"/></div>
    </div>
    <div class="field"><label>洞察 / 结论</label><textarea id="ce-insight" placeholder="一句话总结核心洞察（展示在案例卡片上）">${esc(target.insight)}</textarea></div>
    <div class="field"><label>PRD 内容 · STAR 结构</label><textarea id="ce-prd" style="min-height:120px;" placeholder="Situation / Task / Action / Result 完整记录">${esc(target.prd_content)}</textarea></div>
    <div class="modal-actions"><div class="spacer"></div>${isNew?"":`<button class="btn danger" id="ce-del">删除</button>`}<button class="btn ghost" id="m-cancel">取消</button><button class="btn" id="m-save">保存</button></div></div>`;
  document.body.appendChild(overlay);
  const close = ()=>overlay.remove();
  overlay.onclick = e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#m-cancel").onclick = close;
  const delBtn = overlay.querySelector("#ce-del");
  if(delBtn) delBtn.onclick = ()=>{
    const i = cases.findIndex(x=>x.id===c.id);
    if(i>=0){ cases.splice(i,1); persist(); }
    close(); showToast("案例已删除","ok");
  };
  overlay.querySelector("#m-save").onclick = ()=>{
    const title = (overlay.querySelector("#ce-title").value||"").trim();
    if(title.length < 2){ showToast("请填写案例标题","warn"); return; }
    const tag = (overlay.querySelector("#ce-tag").value||"").trim() || "产品分析";
    const date = overlay.querySelector("#ce-date").value || today();
    const insight = (overlay.querySelector("#ce-insight").value||"").trim();
    const prd_content = overlay.querySelector("#ce-prd").value || "";
    if(isNew){
      const nid = cases.reduce((mx,x)=>Math.max(mx, x.id||0), 0) + 1;
      cases.unshift({ id:nid, tag, date, title, insight, prd_content });
      showToast("案例已添加","ok");
    } else {
      c.tag=tag; c.date=date; c.title=title; c.insight=insight; c.prd_content=prd_content;
      showToast("案例已更新","ok");
    }
    persist(); close();
  };
}

/* ---------- V4 PM 教练 / 申请管家（双人格对话） ---------- */
const PMCoach = {
  persona: 'pm',
  msgs: [],
  _init: false,

  init(){
    if(this._init) return;
    this._init = true;
    this.msgs.push({ role:'bot', text:'你好，我是 <b>PM 成长教练</b> 🎯<br>我可以：<br>• 📋 输入产品名，用「用户-场景-需求-方案-指标」框架分析<br>• 📝 描述需求，帮你梳理 PRD<br>• ⚖️ 给两个产品做竞品对比<br>• ⭐ 说「记录为案例」，提炼成 STAR 案例' });
  },

  msgsHTML(){
    this.init();
    return this.msgs.map(m => {
      const time = m.time ? `<div class="m-time" style="display:block;font-size:10px;color:var(--text-tertiary);margin-top:4px;">${m.time}</div>` : '';
      if(m.role === 'user'){
        return `<div class="c-msg user"><div><div class="m-bubble" style="padding:9px 12px;border-radius:12px 12px 2px 12px;background:var(--accent);color:var(--on-accent);">${esc(m.text)}</div>${time}</div></div>`;
      }
      return `<div class="c-msg bot"><div><div class="m-bubble" style="padding:9px 12px;border-radius:12px 12px 12px 2px;background:var(--surface-card);border:1px solid var(--border);color:var(--text);">${m.text}</div>${time}</div></div>`;
    }).join('');
  },

  async send(text){
    const msgsEl = document.getElementById('pmChatMsgs');
    if(!msgsEl || !text.trim()) return;
    const time = new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
    this.msgs.push({ role:'user', text, time });
    msgsEl.innerHTML = this.msgsHTML();
    msgsEl.scrollTop = msgsEl.scrollHeight;

    const typing = document.createElement('div');
    typing.id = 'pmTyping';
    typing.style.cssText = 'display:flex;gap:4px;align-self:flex-start;padding:4px 2px;';
    typing.innerHTML = '<i style="width:5px;height:5px;border-radius:50%;background:var(--text-tertiary);animation:pmPulse 1.2s infinite ease-in-out;"></i><i style="width:5px;height:5px;border-radius:50%;background:var(--text-tertiary);animation:pmPulse 1.2s infinite ease-in-out .18s;"></i><i style="width:5px;height:5px;border-radius:50%;background:var(--text-tertiary);animation:pmPulse 1.2s infinite ease-in-out .36s;"></i>';
    msgsEl.appendChild(typing);
    msgsEl.scrollTop = msgsEl.scrollHeight;

    const reply = (this.persona === 'pm' && text.trim().includes('记录为案例'))
      ? this._recordCase(text)
      : await this._getReply(text);
    this.msgs.push({ role:'bot', text: reply, time: new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}) });
    msgsEl.innerHTML = this.msgsHTML();
    msgsEl.scrollTop = msgsEl.scrollHeight;
  },

  _useRealLLM(){
    if(IS_DEMO_MODE) return false;
    const config = MewAI.getApiConfigForAgent(this.persona);
    return config.provider !== 'mock' && (config.apiKey || config.provider === 'ollama');
  },

  async _getReply(text){
    if(!this._useRealLLM()){
      await new Promise(r => setTimeout(r, 900));
      return this._demoReply(text);
    }
    try {
      const history = this.msgs
        .filter(m => m.text)
        .map(m => ({ role: m.role === 'user' ? 'user' : 'assistant', content: m.text.replace(/<br>/g,'\n').replace(/<[^>]+>/g,'') }));
      history.pop();
      const reply = await MewAI.callLLMChat(text, history, this.persona);
      if(!reply) return this._demoReply(text);
      return reply.replace(/\n/g, '<br>');
    } catch(e){
      console.error('PM 教练真实AI调用失败:', e);
      return '喵～ AI 服务暂不可用（' + e.message + '）<br>已退回本地回复：<br><br>' + this._demoReply(text);
    }
  },

  _recordCase(text){
    const cases = (data.product_cases = data.product_cases || []);
    const prev = [...this.msgs].reverse().find(m => m.role === 'user' && m.text !== text);
    const explicit = text.match(/记录为案例[：:]\s*(.{2,20})/);
    let title = '';
    if(explicit) title = explicit[1].trim();
    else if(prev){
      const m = prev.text.match(/分析(?:\s*的|下|一下|其|它|他的)?\s*([\u4e00-\u9fa5A-Za-z][\u4e00-\u9fa5A-Za-z0-9]{1,9})/);
      if(m) title = m[1] + ' 分析';
      else title = prev.text.replace(/^[帮我请给设计一个]*/,'').replace(/的?(评论区|设计|功能|机制|玩法|算法|产品)$/,'').slice(0,12);
    }
    if(title.length < 2) title = '产品分析案例';
    const id = cases.reduce((mx,c)=>Math.max(mx, c.id||0), 0) + 1;
    cases.unshift({
      id,
      tag: /AI|算法|模型/i.test(title) ? 'AI 产品' : (/小红书|抖音|微信|微博|社交|社区/.test(title) ? '社交' : (/淘宝|拼多多|电商|下单/.test(title) ? '电商' : '产品分析')),
      date: today(),
      title,
      insight: '基于「用户-场景-需求-方案-指标」框架拆解，核心机制与交互设计要点待补充（可在数据中心编辑完整版）。',
      prd_content: ''
    });
    persist();
    const prdChars = cases.reduce((s,c)=>s+((c.prd_content||'').length),0);
    return `⭐ 已收录案例「${esc(title)}」<br><br>📊 案例库现有 <b>${cases.length}</b> 个案例 · PRD 累计 ${prdChars.toLocaleString()} 字<br><br>可在「数据中心」查看 / 编辑 / 补充 PRD，也可以继续对话分析下一个产品。`;
  },

  _demoReply(text){
    return this.persona === 'butler' ? this._butlerReply(text) : this._pmReply(text);
  },

  _pmReply(text){
    const t = text.trim();
    if(t.includes('记录为案例') || t.includes('案例')){

  // 通用聊天（不带工具调用，用于AI助手对话）
  async callLLMChat(userMessage, history = [], agentKey){
    const agent = this.agents[agentKey || this.currentAgent] || this.agents.pm;
    const ctx = agent.getContextData ? agent.getContextData() : '';
    const systemPrompt = agent.systemPrompt(ctx);
    
    const messages = [
      { role: "system", content: systemPrompt },
      ...history,
      { role: "user", content: userMessage }
    ];

    const config = this.getApiConfigForAgent(agentKey || this.currentAgent);
    const useRealLLM = !IS_DEMO_MODE && config.provider !== 'mock' && (config.apiKey || config.provider === 'ollama');

    if(!useRealLLM){
      return null;
    }

    try {
      const result = await this.callLLMWithConfig(messages, config, { temperature: 0.8 });
      return result.content || "喵～我没听清，再说一遍？";
    } catch(e){
      throw e;
    }
  },

  // 聊天发送消息
  async chatSend(text){
    const msgsEl = document.getElementById('mewMsgs');
    const typing = document.getElementById('mewTyping');
    const agent = this.agents[this.currentAgent] || this.agents.pm;
    if(!text.trim()) return;

    if(!this._chatHistory) this._chatHistory = [];

    const time = new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
    msgsEl.innerHTML += `<div class="c-msg user">
      <div><div class="m-bubble">${esc(text)}</div><div class="m-time">${time}</div></div>
    </div>`;
    msgsEl.scrollTop = msgsEl.scrollHeight;

    typing.classList.add('show');

    let reply = '';
    const config = this.getApiConfigForAgent(this.currentAgent);
    const useRealLLM = !IS_DEMO_MODE && config.provider !== 'mock' && (config.apiKey || config.provider === 'ollama');

    if(!useRealLLM){
      await new Promise(r => setTimeout(r, 1000));
      reply = this._getAgentDemoReply(agent, text);
      this._chatHistory.push({ role: 'user', content: text });
      this._chatHistory.push({ role: 'assistant', content: reply.replace(/<br>/g, '\n') });
    } else {
      try {
        this._chatHistory.push({ role: 'user', content: text });
        if(this._chatHistory.length > 20) this._chatHistory = this._chatHistory.slice(-20);
        
        reply = await this.callLLMChat(text, this._chatHistory.slice(0, -1));
        if(!reply){
          reply = this._getAgentDemoReply(agent, text);
        } else {
          reply = reply.replace(/\n/g, '<br>');
          this._chatHistory.push({ role: 'assistant', content: reply.replace(/<br>/g, '\n') });
        }
      } catch(e){
        console.error('聊天API调用失败:', e);
        reply = `喵～ <b>${agent.name}</b>暂时无法回应（API错误）：${e.message}<br>请检查代理和API Key配置。`;
      }
    }

    typing.classList.remove('show');

    msgsEl.innerHTML += `<div class="c-msg bot">
      <div><div class="m-bubble" style="border-left:3px solid ${agent.color}">${reply}</div><div class="m-time">${new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}</div></div>

  // 使用指定配置调用LLM（预留多API支持）
  async callLLMWithConfig(messages, config, options = {}){
    if(IS_DEMO_MODE) throw new Error('Demo mode'); // 演示模式禁止任何真实调用
    const provider = config.provider || this.config.provider;
    const proxyUrl = config.proxyUrl || this.config.proxyUrl;
    const apiKey = config.apiKey || this.config.apiKey;
    const model = config.model || this.config.model;

    const providerCfg = this.providers[provider];
    if(!providerCfg) throw new Error(`未知的AI提供商: ${provider}`);

    const isOllama = provider === 'ollama';
    const customBaseUrl = config.customBaseUrl || this.config.customBaseUrl;
    const endpoint = (provider === 'custom' && customBaseUrl)
      ? customBaseUrl.replace(/\/+$/, '')
      : (proxyUrl + (providerCfg.path || '/chat/completions'));

    let payload;
    if(isOllama){
      payload = {
        model: model || providerCfg.model,
        messages: messages,
        stream: false
      };
    } else {
      payload = {
        model: model || providerCfg.model,
        messages: messages,
        temperature: options.temperature ?? 0.8,
        stream: false
      };
      if(options.tools) payload.tools = options.tools;
    }

    const headers = isOllama ? { 'Content-Type': 'application/json' }
      : { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` };

    const resp = await fetch(endpoint, {
      method: 'POST',
      headers: headers,
      body: JSON.stringify(payload)
    });

    if(!resp.ok){
      const errText = await resp.text();
      throw new Error(`API请求失败 (${resp.status}): ${errText.slice(0, 200)}`);
    }

    const data = await resp.json();

    if(isOllama){
      return { content: data.message?.content || '', tool_calls: [] };
    }

    const choice = data.choices?.[0];
    if(!choice) throw new Error('AI返回为空');

    const msg = choice.message || {};
    return {
      content: msg.content || '',
      tool_calls: msg.tool_calls || choice.message?.tool_calls || []
    };
  },

  // 更新聊天面板头部（显示当前Agent）
  _updateChatHeader(){
    const agent = this.agents[this.currentAgent];
    if(!agent) return;

    const nameEl = document.getElementById('mewAgentName');
    const statusTextEl = document.getElementById('mewStatusText');
    const statusDotEl = document.getElementById('mewStatusDot');
    const selectEl = document.getElementById('mewAgentSelect');

    if(nameEl) nameEl.textContent = agent.name;
    if(statusTextEl) statusTextEl.textContent = agent.title || '在线';
    if(statusDotEl) statusDotEl.style.background = agent.color || '#86efac';
    if(selectEl && selectEl.value !== this.currentAgent){
      selectEl.value = this.currentAgent;
    }
  },

/* ---------- Export / Import ---------- */
function exportData(){
  const payload = {
    app: CONFIG.storageKey,
    version: 1,
    exportedAt: new Date().toISOString(),
    data: JSON.parse(JSON.stringify(data))
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const ts = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `cat-news-workbench-backup-${ts}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast('数据已导出 ✓');
}

function importData(file){
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const parsed = JSON.parse(e.target.result);
      if(!parsed.data || typeof parsed.data !== 'object'){
        showToast('文件格式不正确', 'error');
        return;
      }
      const preview = Object.entries(parsed.data)
        .filter(([k,v]) => Array.isArray(v) && v.length)
        .map(([k,v]) => `${modOf(k)?.name || k}: ${v.length} 条`)
        .join('，');
      const overlay = document.createElement('div');
      overlay.className = 'overlay';
      overlay.innerHTML = `<div class="modal" style="width:420px">
        <h3>导入数据</h3>
        <div class="sub">检测到以下数据：<br><strong style="color:var(--text)">${preview || '无记录'}</strong><br><br>导入后将覆盖当前所有数据，此操作不可撤销。</div>
        <div class="modal-actions"><div class="spacer"></div>
          <button class="btn ghost" id="imp-cancel">取消</button>
          <button class="btn danger" id="imp-ok">确认导入</button></div></div>`;
      document.body.appendChild(overlay);
      const close = () => overlay.remove();
      overlay.onclick = e => { if(e.target === overlay) close(); };
      overlay.querySelector('#imp-cancel').onclick = close;
      overlay.querySelector('#imp-ok').onclick = () => {
        data = parsed.data;
        store.save();
        render();
        close();
        showToast('数据已导入 ✓');
      };
    } catch(err) {
      showToast('解析文件失败：' + err.message, 'error');
    }
  };
  reader.readAsText(file);
}

/* ============================================================
   CLOUD SYNC — Supabase 云端同步模块
   使用前需要在 Supabase 创建数据库表，详见 schema.sql
   ============================================================ */
const CloudSync = {
  supabase: null,
  config: null,
  syncing: false,
  connected: false,
  lastError: null,

  normalizeUrl(url){
    if(!url) return '';
    let u = url.trim();
    // 移除常见的错误后缀
    u = u.replace(/\/(rest|auth|storage|realtime)\/*.*$/i, '');
    u = u.replace(/\/functions\/.*$/i, '');
    // 移除尾部斜杠
    u = u.replace(/\/+$/, '');
    return u;
  },

  init(){
    if(IS_DEMO_MODE){ // 演示模式：禁用云同步（不连接、不拉取、不推送）
      this.config = { url:'', key:'', user:'', autoSync:false };
      this.updateUI();
      this.bindEvents();
      return;
    }
    const saved = localStorage.getItem('cat-news-supabase-config');
    if(saved){
      try {
        this.config = JSON.parse(saved);
        if(this.config?.url){
          const norm = this.normalizeUrl(this.config.url);
          if(norm !== this.config.url){
            this.config.url = norm;
            localStorage.setItem('cat-news-supabase-config', JSON.stringify(this.config));
          }
        }
        if(this.config.url && this.config.key){
          this.connect();
        }
      } catch(e){}
    }
    this.updateUI();
    this.bindEvents();
  },

  connect(){
    if(!window.supabase || !this.config?.url || !this.config?.key){
      this.connected = false;
      this.updateUI();
      return;
    }
    try {
      this.supabase = window.supabase.createClient(this.config.url, this.config.key);
      this.testConnection();
    } catch(e) {
      console.error('Supabase init failed:', e);
      this.connected = false;
      this.lastError = e.message;
      this.updateUI();
    }
  },

  async testConnection(){
    if(!this.supabase){
      this.connected = false;
      this.updateUI();
      return { ok:false, msg:'客户端未初始化' };
    }
    try {
      const start = Date.now();
      const { data, error, count } = await this.supabase
        .from('workbench_data')
        .select('id', { count:'exact', head:true })
        .limit(1);
      const latency = Date.now() - start;
      if(error){
        this.connected = false;
        this.lastError = error.message;
        this.updateUI();
        return { ok:false, msg:'查询失败: ' + error.message, latency };
      }
      this.connected = true;
      this.lastError = null;
      this.updateUI();
      return { ok:true, msg:`连接成功 · 延迟 ${latency}ms`, latency, count: count ?? 0 };
    } catch(e) {
      this.connected = false;
      this.lastError = e.message;
      this.updateUI();
      return { ok:false, msg:'网络错误: ' + e.message };
    }
  },

  updateUI(){
    const bar = document.getElementById('cloudBar');
    const actionRow = document.getElementById('cbActions');
    const logo = document.getElementById('cbLogo');
    const dot = document.getElementById('cbDot');
    const text = document.getElementById('cbStatusText');

    if(!this.config?.url || !this.config?.key){
      dot.className = 'cb-dot';
      text.textContent = '未配置';
      actionRow.style.display = 'none';
      logo.textContent = '前往「其他 → 设置」开启云同步';
      logo.style.display = 'block';
      return;
    }

    const autoSync = this.config.autoSync;
    actionRow.style.display = 'flex';

    if(this.connected){
      dot.className = 'cb-dot online';
      text.textContent = '已连接 · ' + (this.config.user || '默认设备');
    } else if(this.lastError){
      dot.className = 'cb-dot';
      text.textContent = '连接失败: ' + this.lastError.slice(0, 30);
    } else {
      dot.className = 'cb-dot';
      text.textContent = '正在检测...';
    }

    if(autoSync){
      logo.textContent = '✓ 自动同步已开启 · 每次保存自动推送';
    } else {
      logo.textContent = '⚪ 自动同步未开启 · 请手动同步';
    }
    logo.style.display = 'block';
  },

  async syncNow(){
    return this.push();
  },

  async push(){
    if(!this.supabase){ showToast('请先配置云同步', 'warn'); return; }
    if(!this.connected){ showToast('数据库未连接，请先在设置中测试连接', 'warn'); return; }
    this.setSyncing(true);
    try {
      const payload = {
        id: 'default',
        data: JSON.parse(JSON.stringify(data)),
        updated_at: new Date().toISOString()
      };
      const { error } = await this.supabase
        .from('workbench_data')
        .upsert(payload, { onConflict: 'id' });
      if(error){ throw error; }
      showToast('✓ 已同步到云端', 'success');
    } catch(e) {
      showToast('同步失败: ' + e.message, 'error');
    } finally {
      this.setSyncing(false);
    }
  },

  async pull(){
    if(!this.supabase){ showToast('请先配置云同步', 'warn'); return; }
    if(!this.connected){ showToast('数据库未连接，请先测试连接', 'warn'); return; }
    this.setSyncing(true);
    try {
      const { data: remote, error } = await this.supabase
        .from('workbench_data')
        .select('data, updated_at')
        .order('updated_at', { ascending: false })
        .limit(1);
      if(error){ throw error; }
      if(remote && remote.length > 0 && remote[0].data){
        const preview = this.buildPreview(remote[0].data);
        const overlay = document.createElement('div');
        overlay.className = 'overlay';
        overlay.innerHTML = `<div class="modal" style="width:420px">
          <h3>从云端拉取</h3>
          <div class="sub">云端最新数据（${remote[0].updated_at?.slice(0,19).replace('T',' ')||'未知时间'}）：<br><strong style="color:var(--text)">${preview}</strong><br><br>拉取后将覆盖本地数据，此操作不可撤销。</div>
          <div class="modal-actions"><div class="spacer"></div>
            <button class="btn ghost" id="pull-cancel">取消</button>
            <button class="btn danger" id="pull-ok">确认拉取</button></div></div>`;
        document.body.appendChild(overlay);
        const close = () => overlay.remove();
        overlay.onclick = e => { if(e.target === overlay) close(); };
        overlay.querySelector('#pull-cancel').onclick = close;
        overlay.querySelector('#pull-ok').onclick = () => {
          data = remote[0].data;
          store.save();
          render();
          close();
          showToast('已从云端拉取 ✓');
        };
      } else {
        showToast('云端暂无数据，先在本地做一次推送到云端', 'warn');
      }
    } catch(e) {
      showToast('拉取失败: ' + e.message, 'error');
    } finally {
      this.setSyncing(false);
    }
  },

  buildPreview(d){
    return Object.entries(d)
      .filter(([k,v]) => Array.isArray(v) && v.length)
      .map(([k,v]) => `${modOf(k)?.name || k}: ${v.length} 条`)
      .join('，') || '无记录';
  },

  setSyncing(s){
    this.syncing = s;
    const dot = document.getElementById('cbDot');
    const text = document.getElementById('cbStatusText');
    if(s){
      dot.className = 'cb-dot syncing';
      text.textContent = '同步中...';
    } else {
      this.updateUI();
    }
  },

  async autoSync(){
    if(!this.supabase || !this.config?.autoSync || !this.connected) return;
    const payload = {
      id: 'default',
      data: JSON.parse(JSON.stringify(data)),
      updated_at: new Date().toISOString()
    };
    try {
      await this.supabase
        .from('workbench_data')
        .upsert(payload, { onConflict: 'id' });
    } catch(e) { /* silent fail for auto-sync */ }
  },

  openConfig(){
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `<div class="modal" style="width:480px">
      <h3>云同步设置</h3>
      <div class="sub">配置 Supabase 实现手机电脑数据同步</div>
      <div class="cloud-config">
        <div class="cfg-row">
          <label>Supabase 项目 URL</label>

    document.body.appendChild(overlay);
    const close = () => overlay.remove();

      const resultEl = overlay.querySelector('#cfg-test-result');

        resultEl.style.color = 'var(--danger)';

        resultEl.style.display = 'block';
        resultEl.style.background = 'var(--danger-muted)';
        resultEl.style.color = 'var(--danger)';
        resultEl.innerHTML = `⚠️ URL 格式可能不正确。<br>正确格式：<code>https://项目ref.supabase.co</code><br>你的输入：<code>${attr(url)}</code><br><span style="color:var(--text-tertiary);font-size:12px">请到 Supabase → Data API → 复制 Project URL</span>`;
        return;
